plugins {
    id 'org.cyclonedx.bom' apply false
    id 'org.jlleitschuh.gradle.ktlint' apply false
    id 'org.jetbrains.kotlinx.kover' apply false
}

def aqlReleaseVersion = providers
        .gradleProperty("AQL_VERSION_NAME")
        .orElse(providers.environmentVariable("AQL_VERSION_NAME"))
        .getOrElse("1.0.0")

subprojects {
    pluginManager.apply("org.cyclonedx.bom")
    pluginManager.apply("org.jlleitschuh.gradle.ktlint")
    pluginManager.apply("org.jetbrains.kotlinx.kover")

    ktlint {
        version = "1.8.0"
        android = true
        outputToConsole = true
        ignoreFailures = false
        baseline = file("ktlint-baseline.xml")
        reporters {
            reporter "plain"
            reporter "checkstyle"
            reporter "sarif"
        }
        filter {
            exclude("**/build/**")
            exclude("**/generated/**")
        }
    }

    kover {
        useJacoco("0.8.15")
        reports {
            filters {
                excludes {
                    classes(
                            "*.R",
                            '*.R$*',
                            "*.BuildConfig",
                            "*.*Binding",
                            "*.databinding.*",
                            "*.proto.*"
                    )
                }
            }
        }
    }

    tasks.named("cyclonedxDirectBom") {
        includeConfigs = ["releaseRuntimeClasspath"]
        skipConfigs = [".*[Tt]est.*", ".*[Dd]ebug.*", ".*[Rr]eleaseSmoke.*"]
        projectType = "application"
        componentGroup = "com.aqua"
        componentName = "AquaLight"
        componentVersion = aqlReleaseVersion
        includeBomSerialNumber = true
        includeLicenseText = false
        includeMetadataResolution = true
        includeBuildEnvironment = false
        includeBuildSystem = true
        jsonOutput = layout.buildDirectory.file(
                "reports/cyclonedx-release/AquaLight-${aqlReleaseVersion}-sbom.cdx.json"
        ).get().asFile
        xmlOutput.unsetConvention()
    }
}
