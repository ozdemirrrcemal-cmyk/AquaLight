import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.nio.charset.StandardCharsets
import java.util.Base64

class FirebaseConfigSupport {
    static Map validate(String rawJson, String expectedPackage, String environment) {
        def parsed
        try {
            parsed = new JsonSlurper().parseText(rawJson)
        } catch (Exception error) {
            throw new GradleException("Invalid Firebase JSON for ${environment}.", error)
        }

        def projectId = parsed?.project_info?.project_id?.toString()?.trim()
        if (!projectId) {
            throw new GradleException("Firebase project_id is missing for ${environment}.")
        }

        def clients = parsed?.client instanceof Collection ? parsed.client : []
        def matchingClient = clients.find { client ->
            client?.client_info?.android_client_info?.package_name == expectedPackage
        }
        if (matchingClient == null) {
            throw new GradleException(
                    "Firebase config for ${environment} must contain Android package ${expectedPackage}."
            )
        }

        return [
                json     : JsonOutput.prettyPrint(JsonOutput.toJson(parsed)) + System.lineSeparator(),
                projectId: projectId
        ]
    }

    static String createCiPlaceholder(String environment, String packageName) {
        def suffixByEnvironment = [
                debug       : "01",
                staging     : "02",
                releaseSmoke: "03"
        ]
        def suffix = suffixByEnvironment[environment]
        if (suffix == null) {
            throw new GradleException(
                    "CI Firebase placeholders are not allowed for environment '${environment}'."
            )
        }

        def projectId = "aqualight-ci-${environment.toLowerCase()}"
        def webClientId = "000000000000-${environment.toLowerCase()}.apps.googleusercontent.com"
        def config = [
                project_info          : [
                        project_number: "000000000000",
                        project_id    : projectId,
                        storage_bucket: "${projectId}.appspot.com"
                ],
                client                : [[
                        client_info: [
                                mobilesdk_app_id   : "1:000000000000:android:000000000000000000000000000000${suffix}",
                                android_client_info: [package_name: packageName]
                        ],
                        oauth_client: [[client_id: webClientId, client_type: 3]],
                        api_key     : [[current_key: "AIzaSyAQLCI000000000000000000000000000${suffix}"]],
                        services    : [
                                appinvite_service: [
                                        other_platform_oauth_client: [[client_id: webClientId, client_type: 3]]
                                ]
                        ]
                ]],
                configuration_version: "1"
        ]
        return JsonOutput.prettyPrint(JsonOutput.toJson(config)) + System.lineSeparator()
    }

    static Map prepare(String appDirectoryPath,
                       String environment,
                       String expectedPackage,
                       String secretName,
                       List<String> targetBuildTypes,
                       boolean allowCiPlaceholder) {
        def encodedConfig = System.getenv(secretName)?.trim()
        String rawConfig

        if (encodedConfig) {
            try {
                rawConfig = new String(Base64.getDecoder().decode(encodedConfig), StandardCharsets.UTF_8)
            } catch (IllegalArgumentException error) {
                throw new GradleException("${secretName} is not valid base64.", error)
            }
        } else if (allowCiPlaceholder && "true".equalsIgnoreCase(System.getenv("CI"))) {
            rawConfig = createCiPlaceholder(environment, expectedPackage)
        } else {
            throw new GradleException(
                    "Firebase config for ${environment} is missing. Set ${secretName}; " +
                            "repository and legacy-file fallbacks are forbidden."
            )
        }

        def validated = validate(rawConfig, expectedPackage, environment)
        targetBuildTypes.each { buildType ->
            def target = new File(appDirectoryPath, "src/${buildType}/google-services.json")
            target.parentFile.mkdirs()
            target.setText(validated.json as String, "UTF-8")
        }
        return validated
    }

    static Map readProjectIds(String appDirectoryPath, Map<String, String> environmentBuildTypes) {
        return environmentBuildTypes.collectEntries { environment, buildType ->
            def configFile = new File(
                    appDirectoryPath,
                    "src/${buildType}/google-services.json"
            )
            if (!configFile.isFile()) {
                throw new GradleException(
                        "Generated Firebase config is missing for ${environment}: ${configFile}."
                )
            }

            [
                    (environment): new JsonSlurper()
                            .parse(configFile)
                            .project_info
                            .project_id
                            .toString()
                            .trim()
            ]
        }
    }

    static void requireDistinctProjectIds(Map<String, String> projectIds, String scope) {
        if (projectIds.any { environment, projectId -> !projectId }) {
            throw new GradleException(
                    "Firebase ${scope} isolation contains an empty project ID: ${projectIds}."
            )
        }
        if (projectIds.values().toSet().size() != projectIds.size()) {
            throw new GradleException(
                    "Firebase ${scope} projects must be distinct: ${projectIds}."
            )
        }
    }
}

project(":app") {
    def detektVersion = "1.23.8"
    def detektCli = configurations.create("detektCli") {
        canBeConsumed = false
        canBeResolved = true
        visible = false
    }
    dependencies.add(detektCli.name, "io.gitlab.arturbosch.detekt:detekt-cli:${detektVersion}")

    def detektConfigFile = layout.buildDirectory.file("generated/detekt/aqualight-detekt.yml")
    def detektXmlReport = layout.buildDirectory.file("reports/lint-results-detekt.xml").get().asFile
    def detektHtmlReport = layout.buildDirectory.file("reports/lint-results-detekt.html").get().asFile
    def detektSarifReport = layout.buildDirectory.file("reports/detekt/detekt.sarif").get().asFile
    def detektSourceDirectories = [
            file("src/main/java"),
            file("src/main/kotlin"),
            file("src/test/java"),
            file("src/test/kotlin"),
            file("src/androidTest/java"),
            file("src/androidTest/kotlin"),
            file("src/debug/java"),
            file("src/staging/java"),
            file("src/release/java"),
            file("src/releaseSmoke/java")
    ].findAll { sourceDirectory -> sourceDirectory.isDirectory() }

    def prepareDetektConfig = tasks.register("prepareDetektConfig") {
        group = "verification"
        description = "Materializes the deterministic AquaLight Detekt policy."
        outputs.file(detektConfigFile)

        doLast {
            def target = detektConfigFile.get().asFile
            target.parentFile.mkdirs()
            [detektXmlReport, detektHtmlReport, detektSarifReport].each { report ->
                report.parentFile.mkdirs()
            }
            target.setText('''build:
  maxIssues: 0
  excludeCorrectable: false
  weights:
    comments: 0
    complexity: 0
    coroutines: 0
    empty-blocks: 0
    exceptions: 0
    naming: 0
    performance: 0
    potential-bugs: 0
    style: 0
    ExplicitGarbageCollectionCall: 1
    InvalidRange: 1
    NotImplementedDeclaration: 1
    UnreachableCode: 1

config:
  validation: true
  warningsAsErrors: true

exceptions:
  NotImplementedDeclaration:
    active: true

potential-bugs:
  ExplicitGarbageCollectionCall:
    active: true
  InvalidRange:
    active: true
  UnreachableCode:
    active: true
''', "UTF-8")
        }
    }

    def detektGate = tasks.register("detekt", JavaExec) {
        group = "verification"
        description = "Runs the deterministic AquaLight Kotlin static-analysis gate."
        dependsOn(prepareDetektConfig)
        classpath = detektCli
        mainClass.set("io.gitlab.arturbosch.detekt.cli.Main")

        inputs.files(detektSourceDirectories)
                .withPropertyName("detektSources")
                .withPathSensitivity(PathSensitivity.RELATIVE)
        inputs.file(detektConfigFile)
                .withPropertyName("detektConfig")
                .withPathSensitivity(PathSensitivity.RELATIVE)
        outputs.files(detektXmlReport, detektHtmlReport, detektSarifReport)

        args(
                "--input", detektSourceDirectories.collect { it.absolutePath }.join(","),
                "--config", detektConfigFile.get().asFile.absolutePath,
                "--build-upon-default-config",
                "--parallel",
                "--base-path", rootProject.projectDir.absolutePath,
                "--report", "xml:${detektXmlReport.absolutePath}",
                "--report", "html:${detektHtmlReport.absolutePath}",
                "--report", "sarif:${detektSarifReport.absolutePath}"
        )
    }

    tasks.matching { task ->
        task.name in ["lintDebug", "lintStaging", "lintRelease", "lintReleaseSmoke"]
    }.configureEach {
        dependsOn(detektGate)
    }

    plugins.withId("com.android.application") {
        def baseApplicationId = "com.aqua.aqualight"
        def appDirectoryPath = projectDir.absolutePath
        def legacyFirebaseConfigPath = new File(appDirectoryPath, "google-services.json").absolutePath
        def repositoryRootPath = rootProject.projectDir.absolutePath

        android {
            testCoverage {
                jacocoVersion = "0.8.15"
            }

            buildTypes {
                debug {
                    applicationIdSuffix ".debug"
                    versionNameSuffix "-debug"
                    enableUnitTestCoverage true
                    buildConfigField "String", "AQL_ENVIRONMENT", '"debug"'
                    buildConfigField "boolean", "AQL_IS_PRODUCTION", "false"
                }

                release {
                    buildConfigField "String", "AQL_ENVIRONMENT", '"production"'
                    buildConfigField "boolean", "AQL_IS_PRODUCTION", "true"
                }

                staging {
                    initWith release
                    applicationIdSuffix ".staging"
                    versionNameSuffix "-staging"
                    signingConfig signingConfigs.debug
                    matchingFallbacks = ['release']
                    buildConfigField "String", "AQL_ENVIRONMENT", '"staging"'
                    buildConfigField "boolean", "AQL_IS_PRODUCTION", "false"
                }

                releaseSmoke {
                    buildConfigField "String", "AQL_ENVIRONMENT", '"releaseSmoke"'
                    buildConfigField "boolean", "AQL_IS_PRODUCTION", "false"
                }
            }
        }

        def verifyNoLegacyFirebaseConfig = tasks.register("verifyNoLegacyFirebaseConfig") {
            group = "verification"
            description = "Rejects repository or source-set Firebase configuration files."

            doLast {
                def legacyFirebaseConfig = new File(legacyFirebaseConfigPath)
                if (legacyFirebaseConfig.exists()) {
                    throw new GradleException(
                            "Legacy Firebase config is forbidden: ${legacyFirebaseConfig}. " +
                                    "Use environment-scoped base64 secrets."
                    )
                }

                def trackedConfigProcess = new ProcessBuilder([
                        "git",
                        "ls-files",
                        "--",
                        "app/google-services.json",
                        ":(glob)app/src/**/google-services.json"
                ])
                        .directory(new File(repositoryRootPath))
                        .redirectErrorStream(true)
                        .start()
                def trackedConfigs = trackedConfigProcess.inputStream.getText("UTF-8").trim()
                def exitCode = trackedConfigProcess.waitFor()
                if (exitCode != 0) {
                    throw new GradleException(
                            "Unable to verify tracked Firebase files (git exit ${exitCode}): " +
                                    trackedConfigs
                    )
                }
                if (!trackedConfigs.isEmpty()) {
                    throw new GradleException(
                            "Firebase configuration files must not be tracked: ${trackedConfigs}."
                    )
                }
            }
        }

        def registerFirebaseConfigTask = { String environment,
                                           String expectedPackage,
                                           String secretName,
                                           List<String> targetBuildTypes,
                                           boolean allowCiPlaceholder ->
            def capitalizedEnvironment = environment.capitalize()
            def outputFiles = targetBuildTypes.collect { buildType ->
                new File(appDirectoryPath, "src/${buildType}/google-services.json")
            }

            tasks.register("prepare${capitalizedEnvironment}FirebaseConfig") {
                group = "firebase"
                description = "Materializes and validates ${environment} Firebase configuration."
                dependsOn(verifyNoLegacyFirebaseConfig)
                doNotTrackState("Firebase configuration is provided through environment variables at execution time.")
                outputs.files(outputFiles)

                doLast { task ->
                    def validated = FirebaseConfigSupport.prepare(
                            appDirectoryPath,
                            environment,
                            expectedPackage,
                            secretName,
                            targetBuildTypes,
                            allowCiPlaceholder
                    )
                    task.logger.lifecycle(
                            "Firebase ${environment} config prepared for ${expectedPackage} " +
                                    "(project ${validated.projectId})."
                    )
                }
            }
        }

        def prepareDebugFirebaseConfig = registerFirebaseConfigTask(
                "debug",
                "${baseApplicationId}.debug",
                "AQL_FIREBASE_DEBUG_CONFIG_BASE64",
                ["debug"],
                true
        )
        def prepareStagingFirebaseConfig = registerFirebaseConfigTask(
                "staging",
                "${baseApplicationId}.staging",
                "AQL_FIREBASE_STAGING_CONFIG_BASE64",
                ["staging"],
                true
        )
        def prepareReleaseSmokeFirebaseConfig = registerFirebaseConfigTask(
                "releaseSmoke",
                baseApplicationId,
                "AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64",
                ["releaseSmoke"],
                true
        )
        def prepareProductionFirebaseConfig = registerFirebaseConfigTask(
                "production",
                baseApplicationId,
                "AQL_FIREBASE_PRODUCTION_CONFIG_BASE64",
                ["release"],
                false
        )

        def verifyFirebaseNonProductionEnvironmentIsolation =
                tasks.register("verifyFirebaseNonProductionEnvironmentIsolation") {
            group = "verification"
            description = "Verifies distinct debug, staging and release-smoke Firebase projects."
            dependsOn(
                    prepareDebugFirebaseConfig,
                    prepareStagingFirebaseConfig,
                    prepareReleaseSmokeFirebaseConfig
            )
            doNotTrackState("Firebase project identities are generated from execution-time environment inputs.")

            doLast { task ->
                def projectIds = FirebaseConfigSupport.readProjectIds(
                        appDirectoryPath,
                        [
                                debug       : "debug",
                                staging     : "staging",
                                releaseSmoke: "releaseSmoke"
                        ]
                )
                FirebaseConfigSupport.requireDistinctProjectIds(projectIds, "non-production")
                task.logger.lifecycle(
                        "Firebase non-production environment isolation verified: ${projectIds}."
                )
            }
        }

        def verifyFirebaseProductionEnvironmentIsolation =
                tasks.register("verifyFirebaseProductionEnvironmentIsolation") {
            group = "verification"
            description = "Verifies real debug, staging and production Firebase projects are distinct."
            dependsOn(
                    prepareDebugFirebaseConfig,
                    prepareStagingFirebaseConfig,
                    prepareProductionFirebaseConfig
            )
            doNotTrackState("Firebase project identities are generated from protected environment inputs.")

            doFirst {
                def requiredSecrets = [
                        "AQL_FIREBASE_DEBUG_CONFIG_BASE64",
                        "AQL_FIREBASE_STAGING_CONFIG_BASE64",
                        "AQL_FIREBASE_PRODUCTION_CONFIG_BASE64"
                ]
                def missingSecrets = requiredSecrets.findAll { secretName ->
                    def value = System.getenv(secretName)
                    value == null || value.trim().isEmpty()
                }
                if (!missingSecrets.isEmpty()) {
                    throw new GradleException(
                            "Production Firebase isolation requires protected configs: ${missingSecrets}."
                    )
                }
            }

            doLast { task ->
                def projectIds = FirebaseConfigSupport.readProjectIds(
                        appDirectoryPath,
                        [
                                debug     : "debug",
                                staging   : "staging",
                                production: "release"
                        ]
                )
                FirebaseConfigSupport.requireDistinctProjectIds(projectIds, "production")
                task.logger.lifecycle(
                        "Firebase production environment isolation verified: ${projectIds}."
                )
            }
        }

        tasks.configureEach { task ->
            switch (task.name) {
                case "processDebugGoogleServices":
                    task.dependsOn(prepareDebugFirebaseConfig)
                    break
                case "processStagingGoogleServices":
                    task.dependsOn(prepareStagingFirebaseConfig)
                    break
                case "processReleaseSmokeGoogleServices":
                    task.dependsOn(prepareReleaseSmokeFirebaseConfig)
                    break
                case "processReleaseGoogleServices":
                    task.dependsOn(prepareProductionFirebaseConfig)
                    break
                case "verifyFirebaseRuntimePolicy":
                    task.inputs.files(
                            configurations.named("stagingRuntimeClasspath"),
                            configurations.named("releaseSmokeRuntimeClasspath")
                    )
                            .withPropertyName("nonProductionFirebaseRuntimeClasspaths")
                            .withPathSensitivity(PathSensitivity.NONE)
                    task.dependsOn(verifyFirebaseNonProductionEnvironmentIsolation)
                    break
            }
        }
    }
}
