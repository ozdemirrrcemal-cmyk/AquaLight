build:
  maxIssues: 0
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: true

# AquaLight has a versioned advisory debt inventory for the rules below. They
# remain enabled in detektAdvisory and any new fingerprint is a blocker. The
# primary gate keeps every other default Detekt rule at zero findings.
complexity:
  ComplexCondition:
    active: false
  CyclomaticComplexMethod:
    active: false
  LargeClass:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  LoopWithTooManyJumpStatements:
    active: false
  NestedBlockDepth:
    active: false
  TooManyFunctions:
    active: false

exceptions:
  InstanceOfCheckForException:
    active: false
  PrintStackTrace:
    active: false
  RethrowCaughtException:
    active: false
  SwallowedException:
    active: false
  ThrowsCount:
    active: false
  TooGenericExceptionCaught:
    active: false

naming:
  MatchingDeclarationName:
    active: false

performance:
  SpreadOperator:
    active: false

potential-bugs:
  active: true

style:
  MagicNumber:
    active: false
  MaxLineLength:
    active: false
  NewLineAtEndOfFile:
    active: false
  ReturnCount:
    active: false
  UnusedParameter:
    active: false
  UnusedPrivateProperty:
    active: false
  UseCheckOrError:
    active: false
  UseRequire:
    active: false
  WildcardImport:
    active: false
