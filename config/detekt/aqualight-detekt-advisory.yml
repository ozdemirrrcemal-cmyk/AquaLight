build:
  maxIssues: 100000
  excludeCorrectable: false

config:
  validation: true
  warningsAsErrors: true

# The runtime-contract migration deliberately keeps exact protocol parsing and
# generation-scoped state reduction explicit. These narrowly scoped advisory
# exceptions document that design without weakening blocker Detekt rules or
# suppressing the same rules elsewhere in the codebase.
complexity:
  CyclomaticComplexMethod:
    excludes:
      - '**/com/aqua/aqualight/data/devices/discovery/udp/AqlDiscoveryParser.kt'
      - '**/com/aqua/aqualight/data/devices/discovery/udp/AqlDiscoveryUdpScanner.kt'
      - '**/com/aqua/aqualight/data/devices/repository/DeviceRuntimeRepository.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/security/DeviceSecurityParsers.kt'
  LargeClass:
    excludes:
      - '**/com/aqua/aqualight/data/devices/repository/DeviceRuntimeRepository.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/dosing/DeviceDosingStatusParser.kt'
  LongMethod:
    excludes:
      - '**/com/aqua/aqualight/data/devices/discovery/udp/AqlDiscoveryParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/core/DeviceRuntimeCommandExecutor.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/security/DeviceSecurityParsers.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/ws/AqlWsWireCodec.kt'
      - '**/com/aqua/aqualight/data/devices/monitor/DeviceAuthenticatedLivenessProbeCoordinatorTest.kt'
  LongParameterList:
    excludes:
      - '**/com/aqua/aqualight/data/devices/monitor/DeviceAuthenticatedLivenessProbeCoordinator.kt'
      - '**/com/aqua/aqualight/data/devices/repository/DeviceRuntimeRepository.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/time/DeviceTimeModels.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/state/DeviceRuntimeStateReducer.kt'
  TooManyFunctions:
    excludes:
      - '**/com/aqua/aqualight/data/devices/runtime/modules/cooling/DeviceCoolingStatusParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/dosing/DeviceDosingRuntimeRepository.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/dosing/DeviceDosingStatusParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/light/DeviceLightStatusParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/network/DeviceNetworkStatusParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/security/DeviceSecurityParsers.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/time/DeviceTimeStatusParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/timer/DeviceTimerStatusParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/ws/AqlWsClient.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/ws/AqlWsWireCodec.kt'

exceptions:
  TooGenericExceptionCaught:
    excludes:
      - '**/com/aqua/aqualight/data/devices/runtime/modules/security/DeviceSecurityRuntimeRepository.kt'

style:
  MagicNumber:
    excludes:
      - '**/com/aqua/aqualight/data/devices/discovery/udp/AqlDiscoveryParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/device/DeviceNameRuntime.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/dosing/DeviceDosingStatusParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/light/DeviceLightRuntimeRepository.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/light/DeviceLightStatusParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/light/DeviceLightTemperatureProtectionRuntimeRepository.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/network/DeviceNetworkModels.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/network/DeviceNetworkRuntimeRepository.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/network/DeviceNetworkStatusParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/time/DeviceTimeModels.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/time/DeviceTimeStatusParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/modules/timer/DeviceTimerStatusParser.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/state/DeviceRuntimeStateReducer.kt'
  MaxLineLength:
    excludes:
      - '**/com/aqua/aqualight/data/devices/runtime/modules/firmware/DeviceOtaCoordinator.kt'
  ReturnCount:
    excludes:
      - '**/com/aqua/aqualight/data/devices/discovery/udp/AqlDiscoveryParser.kt'
      - '**/com/aqua/aqualight/data/devices/discovery/udp/AqlDiscoveryUdpScanner.kt'
      - '**/com/aqua/aqualight/data/devices/monitor/DeviceAuthenticatedLivenessProbeCoordinator.kt'
      - '**/com/aqua/aqualight/data/devices/repository/DeviceRuntimeRepository.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/core/DeviceRuntimeCommandExecutor.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/state/DeviceRuntimeRefreshCoordinator.kt'
      - '**/com/aqua/aqualight/data/devices/runtime/state/DeviceRuntimeStateReducer.kt'
