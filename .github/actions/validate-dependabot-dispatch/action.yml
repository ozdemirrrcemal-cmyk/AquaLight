name: Validate trusted Dependabot dispatch
description: Validate an exact-SHA Gradle Dependabot workflow dispatch before executing repository code.
inputs:
  expected-sha:
    description: Exact final Dependabot head SHA.
    required: true
  expected-base-sha:
    description: Exact main SHA used for the trusted validation.
    required: true
  pull-request:
    description: Dependabot pull request number.
    required: true
  trust-run-id:
    description: Successful Dependabot Gradle Trust Refresh run ID.
    required: true
  validation-id:
    description: Unique Apply-run correlation identifier.
    required: true
  github-token:
    description: Token used only for read-only GitHub validation.
    required: true
runs:
  using: composite
  steps:
    - name: Validate immutable dispatch context
      shell: bash
      env:
        AQL_EXPECTED_SHA: ${{ inputs.expected-sha }}
        AQL_EXPECTED_BASE_SHA: ${{ inputs.expected-base-sha }}
        AQL_DEPENDABOT_PR: ${{ inputs.pull-request }}
        AQL_TRUST_RUN_ID: ${{ inputs.trust-run-id }}
        AQL_VALIDATION_ID: ${{ inputs.validation-id }}
        AQL_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: python3 "${GITHUB_ACTION_PATH}/validate.py"
