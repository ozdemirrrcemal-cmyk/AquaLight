name: AquaLight Android toolchain
description: Sets up the pinned JDK, Android SDK, and Gradle build environment.
inputs:
  java-version:
    description: JDK version
    required: false
    default: "17"
runs:
  using: composite
  steps:
    - name: Install JDK
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    - name: Set up Android SDK
      uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      with:
        cache-provider: basic

    - name: Install pinned Android SDK packages
      shell: bash
      run: |
        set -Eeuo pipefail
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager "platform-tools" "platforms;android-36" "cmdline-tools;latest"
        sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
        chmod +x ./gradlew
