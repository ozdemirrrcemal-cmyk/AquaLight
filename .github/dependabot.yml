# Dependabot reads this configuration from the default branch. Keeping target-branch
# unset ensures both version and security update pull requests continue to target main
# after this staged supply-chain change is merged.
version: 2

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      test-libraries:
        patterns:
          - "androidx.arch.core:core-testing"
          - "androidx.test.espresso:espresso-core"
          - "androidx.test.ext:junit"
          - "androidx.test:core-ktx"
          - "junit:junit"
          - "org.jetbrains.kotlinx:kotlinx-coroutines-test"
        update-types:
          - "minor"
          - "patch"
      firebase:
        patterns:
          - "com.google.firebase:*"
          - "com.google.gms.google-services"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Firebase Auth selected by BoM 34.16.0 is built with Kotlin metadata 2.3.
      # Keep BoM minor/major updates pinned until Kotlin and AGP are upgraded
      # together in a separately reviewed toolchain change.
      - dependency-name: "com.google.firebase:firebase-bom"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Istanbul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(deps)"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
