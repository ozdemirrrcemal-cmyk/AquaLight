version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      android-build:
        patterns:
          - com.android.*
          - org.jetbrains.kotlin.*
          - com.google.*
          - androidx.*
      quality-tooling:
        patterns:
          - io.gitlab.arturbosch.detekt
          - org.cyclonedx.*
          - org.jacoco.*
    labels:
      - dependencies
      - android

  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: /firebase
    target-branch: main
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
    groups:
      firebase-test-tooling:
        patterns:
          - '*'
    labels:
      - dependencies
      - firebase
