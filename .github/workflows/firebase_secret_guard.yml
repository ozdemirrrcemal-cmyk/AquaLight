name: Firebase Repository Configuration Guard

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "commercial/**"
    paths:
      - "**/google-services.json"
      - ".gitignore"
      - ".github/workflows/firebase_secret_guard.yml"
      - ".github/workflows/android_release.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/android_emulator_tests.yml"
      - ".github/workflows/dependency_integrity.yml"
      - "build.gradle"
      - "gradle/aqualight-firebase.gradle"
      - "tools/release_pipeline/**"
  pull_request:
    paths:
      - "**/google-services.json"
      - ".gitignore"
      - ".github/workflows/firebase_secret_guard.yml"
      - ".github/workflows/android_release.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/android_emulator_tests.yml"
      - ".github/workflows/dependency_integrity.yml"
      - "build.gradle"
      - "gradle/aqualight-firebase.gradle"
      - "tools/release_pipeline/**"

permissions:
  contents: read

jobs:
  firebase-repository-guard:
    name: Reject tracked Firebase configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify repository Firebase policy
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t tracked_configs < <(
            git ls-files | awk 'tolower($0) ~ /(^|\/)google-services\.json$/'
          )
          if [[ "${#tracked_configs[@]}" -ne 0 ]]; then
            printf 'Tracked google-services.json files are forbidden:\n' >&2
            printf ' - %s\n' "${tracked_configs[@]}" >&2
            exit 1
          fi

          if ! grep -Fxq '**/google-services.json' .gitignore; then
            echo 'The repository must ignore every google-services.json file.' >&2
            exit 1
          fi

          echo 'No Firebase configuration file is tracked by Git.'
