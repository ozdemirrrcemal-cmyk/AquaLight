name: Firebase Repository Secret Guard

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "**/google-services.json"
      - ".github/workflows/firebase_secret_guard.yml"
      - "build.gradle"
      - "tools/release_pipeline/**"
  pull_request:
    paths:
      - "**/google-services.json"
      - ".github/workflows/firebase_secret_guard.yml"
      - "build.gradle"
      - "tools/release_pipeline/**"

permissions:
  contents: read

jobs:
  firebase-secret-guard:
    name: Reject tracked Firebase credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify repository Firebase material
        shell: bash
        run: |
          set -Eeuo pipefail

          mapfile -t tracked_configs < <(git ls-files -- '*google-services.json')
          if [[ "${#tracked_configs[@]}" -ne 1 || "${tracked_configs[0]}" != "app/google-services.json" ]]; then
            printf 'Only the reviewed CI placeholder may be tracked. Found:\n' >&2
            printf ' - %s\n' "${tracked_configs[@]}" >&2
            exit 1
          fi

          if grep -En 'AIza[0-9A-Za-z_-]{30,}' "${tracked_configs[@]}"; then
            echo 'A live-looking Google API key is forbidden in tracked Firebase configuration.' >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          config_path = Path("app/google-services.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          clients = config.get("client") or []
          if len(clients) != 1:
              raise SystemExit("CI Firebase placeholder must contain exactly one client.")

          client = clients[0]
          package_name = (
              client.get("client_info", {})
              .get("android_client_info", {})
              .get("package_name")
          )
          keys = [entry.get("current_key") for entry in client.get("api_key") or []]

          if config.get("project_info", {}).get("project_id") != "aqualight-ci-production-placeholder":
              raise SystemExit("Tracked Firebase config must use the CI placeholder project.")
          if package_name != "com.aqua.aqualight":
              raise SystemExit("Tracked Firebase placeholder has an unexpected Android package.")
          if keys != ["AQL_CI_ONLY_FIREBASE_PLACEHOLDER"]:
              raise SystemExit("Tracked Firebase config must not contain a real API key.")
          PY

          echo 'Tracked Firebase configuration contains only the reviewed CI placeholder.'
