name: Node 24 Actions Migration Runner

on:
  push:
    branches:
      - chore/node24-actions-migration

permissions:
  contents: write
  actions: write

concurrency:
  group: node24-actions-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: chore/node24-actions-migration
          fetch-depth: 0

      - name: Apply complete Node 24 migration
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch origin main
          git show origin/main:.github/workflows/firebase_secret_guard.yml \
            > .github/workflows/firebase_secret_guard.yml
          rm -f .github/workflows/node24_actions_migration.yml

          python3 - <<'PY'
          from pathlib import Path

          files = sorted(Path('.github/workflows').glob('*.yml')) + [
              Path('tools/architecture_guard.py')
          ]
          replacements = {
              'actions/checkout@11d5960a326750d5838078e36cf38b85af677262':
                  'actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd',
              'gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45':
                  'gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92',
              'android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407':
                  'android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699',
              'actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830':
                  'actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae',
              'actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0':
                  'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c',
          }
          comments = {
              'actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4':
                  'actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2',
              'gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v2':
                  'gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0',
              'android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v3':
                  'android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1',
              'actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4':
                  'actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5',
              'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v5':
                  'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1',
          }
          minimum = {
              'actions/checkout@11d5960a326750d5838078e36cf38b85af677262': 8,
              'gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45': 5,
              'android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407': 6,
              'actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830': 1,
              'actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0': 1,
          }
          totals = {key: 0 for key in replacements}

          for path in files:
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in replacements.items():
                  totals[old] += text.count(old)
                  text = text.replace(old, new)
              if path == Path('tools/architecture_guard.py'):
                  old_sha = '9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407'
                  new_sha = '40fd30fb8d7440372e1316f5d1809ec01dcd3699'
                  extra = text.count(old_sha)
                  totals['android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407'] += extra
                  text = text.replace(old_sha, new_sha)
              for old, new in comments.items():
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

          for old, minimum_count in minimum.items():
              found = totals[old]
              print(f'{old}: replaced {found}')
              if found < minimum_count:
                  raise SystemExit(
                      f'Expected at least {minimum_count} occurrences of {old}, found {found}'
                  )

          for old in replacements:
              leftovers = [
                  str(path) for path in files
                  if old in path.read_text(encoding='utf-8')
              ]
              if leftovers:
                  raise SystemExit(f'Old action pin remains for {old}: {leftovers}')

          guard = Path('tools/architecture_guard.py').read_text(encoding='utf-8')
          if '40fd30fb8d7440372e1316f5d1809ec01dcd3699' not in guard:
              raise SystemExit('architecture_guard.py was not migrated')
          if 'cmdline-tools-version: "15859902"' not in guard:
              raise SystemExit('Android command-line tools pin changed unexpectedly')
          PY

          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 tools/architecture_guard.py
          git diff --check

      - name: Commit only to migration branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows tools/architecture_guard.py
          git diff --cached --check
          git commit -m 'ci: migrate GitHub Actions to Node 24 runtimes'
          git push origin HEAD:chore/node24-actions-migration

      - name: Dispatch validation workflows on migration branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for workflow in \
            android.yml \
            codeql.yml \
            dependency_integrity.yml \
            android_emulator_tests.yml \
            firebase_secret_guard.yml; do
            gh workflow run "$workflow" --ref chore/node24-actions-migration
            echo "Dispatched $workflow"
          done
