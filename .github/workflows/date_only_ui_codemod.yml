name: Date-only UI boundary codemod

on:
  push:
    branches:
      - agent/localization-accessibility-commercial

permissions:
  contents: write

jobs:
  update-date-only-boundaries:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/localization-accessibility-commercial
          fetch-depth: 0

      - name: Apply verified date-only boundary replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def load(path):
              p = Path(path)
              return p, p.read_text(encoding='utf-8')

          def require_replace(text, old, new, label, expected=None):
              count = text.count(old)
              if count == 0 or (expected is not None and count != expected):
                  raise SystemExit(f'{label}: unexpected match count {count}')
              return text.replace(old, new)

          def require_sub(text, pattern, replacement, label):
              updated, count = re.subn(pattern, replacement, text, flags=re.MULTILINE)
              if count != 1:
                  raise SystemExit(f'{label}: expected one regex match, found {count}')
              return updated

          settings_path, text = load('app/src/main/java/com/aqua/aqualight/ui/tabs/aquarium/detail/settings/TankSettingsBasicFragment.kt')
          text = require_replace(text, 'setupDateMillis', 'setupDateEpochDay', 'settings field rename')
          text = require_replace(
              text,
              '            currentMillis = tank.setupDateEpochDay,',
              '            currentMillis = AquariumDatePolicy.pickerMillis(tank.setupDateEpochDay),',
              'settings picker conversion',
              1
          )
          text = require_replace(
              text,
              '            val millis = result.getLong(TankSettingsEditorBottomSheet.RESULT_MILLIS)',
              '            val epochDay = AquariumDatePolicy.epochDayFromPickerMillis(\n                result.getLong(TankSettingsEditorBottomSheet.RESULT_MILLIS)\n            )',
              'settings result conversion',
              1
          )
          text = require_replace(
              text,
              'aquariumTankViewModel.updateTankSetupDate(tankId, millis)',
              'aquariumTankViewModel.updateTankSetupDate(tankId, epochDay)',
              'settings update argument',
              1
          )
          text = require_replace(
              text,
              '            millis = setupDateEpochDay,',
              '            epochDay = setupDateEpochDay,',
              'settings formatter argument',
              1
          )
          settings_path.write_text(text, encoding='utf-8')

          form_path, text = load('app/src/main/java/com/aqua/aqualight/ui/tabs/aquarium/detail/TankDetailLivestockFormFragment.kt')
          text = require_replace(
              text,
              'import com.aqua.aqualight.i18n.LocaleFormatter',
              'import com.aqua.aqualight.i18n.DateOnly\nimport com.aqua.aqualight.i18n.LocaleFormatter',
              'livestock DateOnly import',
              1
          )
          text = require_replace(text, 'selectedAddedDateMillis', 'selectedAddedDateEpochDay', 'livestock selected field rename')
          text = require_replace(text, 'addedDateMillis', 'addedDateEpochDay', 'livestock model field rename')
          text = require_replace(
              text,
              'private var selectedAddedDateEpochDay: Long = System.currentTimeMillis()',
              'private var selectedAddedDateEpochDay: Long = DateOnly.todayEpochDay()',
              'livestock initial date',
              1
          )
          text = require_replace(
              text,
              'selectedAddedDateEpochDay = System.currentTimeMillis()',
              'selectedAddedDateEpochDay = DateOnly.todayEpochDay()',
              'livestock reset date',
              1
          )
          text = require_sub(
              text,
              r'selectedAddedDateEpochDay = result\.getLong\(AppDatePickerDialogFragment\.RESULT_MILLIS\)',
              'selectedAddedDateEpochDay = DateOnly.fromPickerMillis(\n                result.getLong(AppDatePickerDialogFragment.RESULT_MILLIS)\n            )',
              'livestock picker result'
          )
          text = require_sub(
              text,
              r'selectedAddedDateEpochDay = livestock\.addedDateEpochDay\s*\?\.takeIf \{\s*millis ->\s*millis > 0L\s*\} \?: System\.currentTimeMillis\(\)',
              'selectedAddedDateEpochDay = livestock.addedDateEpochDay\n            ?.takeIf { epochDay -> epochDay > 0L }\n            ?: DateOnly.todayEpochDay()',
              'livestock edit date'
          )
          text = require_replace(
              text,
              'LocaleFormatter.formatDate(\n            requireContext(),\n            selectedAddedDateEpochDay\n        )',
              'LocaleFormatter.formatDateEpochDay(\n            requireContext(),\n            selectedAddedDateEpochDay\n        )',
              'livestock date display',
              1
          )
          text = require_replace(
              text,
              'initialMillis = selectedAddedDateEpochDay,',
              'initialMillis = DateOnly.toPickerMillis(selectedAddedDateEpochDay),',
              'livestock picker initial value',
              1
          )
          form_path.write_text(text, encoding='utf-8')

          life_path, text = load('app/src/main/java/com/aqua/aqualight/ui/tabs/aquarium/detail/TankDetailLifeFragment.kt')
          text = require_replace(text, 'addedDateMillis', 'addedDateEpochDay', 'livestock list field rename')
          text = require_replace(
              text,
              'LocaleFormatter.formatDate(requireContext(), addedDateEpochDay)',
              'LocaleFormatter.formatDateEpochDay(requireContext(), addedDateEpochDay)',
              'livestock list date display',
              1
          )
          life_path.write_text(text, encoding='utf-8')

          pdf_path, text = load('app/src/main/java/com/aqua/aqualight/ui/tabs/aquarium/export/TankPdfExporter.kt')
          text = require_replace(text, 'setupDateMillis', 'setupDateEpochDay', 'PDF setup date rename')
          text = require_replace(
              text,
              'LocaleFormatter.formatDate(context, setupDateEpochDay)',
              'LocaleFormatter.formatDateEpochDay(context, setupDateEpochDay)',
              'PDF setup date display',
              1
          )
          pdf_path.write_text(text, encoding='utf-8')
          PY

      - name: Commit deterministic UI codemod
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aqua/aqualight/ui/tabs/aquarium
          git commit -m "Convert date-only UI boundaries to epoch days"
          git push origin HEAD:agent/localization-accessibility-commercial
