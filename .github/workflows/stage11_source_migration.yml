name: Stage 11 Source Migration

on:
  push:
    branches:
      - agent/stage-11-localization-accessibility
    paths:
      - tools/stage11_patch_remaining.py
      - .github/workflows/stage11_source_migration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-11-localization-accessibility
          fetch-depth: 0

      - name: Apply transparent source migration
        run: python tools/stage11_patch_remaining.py

      - name: Remove one-shot migration files
        run: git rm tools/stage11_patch_remaining.py .github/workflows/stage11_source_migration.yml

      - name: Commit production tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor: complete Stage 11 locale source migration"
          git push origin HEAD:agent/stage-11-localization-accessibility
