name: Date-only store codemod

on:
  push:
    branches:
      - agent/localization-accessibility-commercial

permissions:
  contents: write

jobs:
  update-store-field-names:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/localization-accessibility-commercial
          fetch-depth: 0

      - name: Apply exact date-only field replacements
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/aqua/aqualight/data/aquarium/store/AquariumTankDataStoreManager.kt')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'setupDateMillis': 'setupDateEpochDay',
              'addedDateMillis': 'addedDateEpochDay',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count == 0:
                  raise SystemExit(f'Expected {old} in {path}, found none')
              print(f'{old}: {count} exact replacements')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit deterministic codemod
        run: |
          if git diff --quiet; then
            echo "No codemod changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aqua/aqualight/data/aquarium/store/AquariumTankDataStoreManager.kt
          git commit -m "Convert tank store date fields to epoch days"
          git push origin HEAD:agent/localization-accessibility-commercial
