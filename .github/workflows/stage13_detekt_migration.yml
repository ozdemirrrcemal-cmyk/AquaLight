name: Stage 13 Detekt CLI Migration

on:
  push:
    branches:
      - agent/release-ci-supply-chain-gates
    paths:
      - tools/ci/apply_detekt_cli_migration.py
      - .github/workflows/stage13_detekt_migration.yml

permissions:
  contents: write

jobs:
  migrate:
    name: Apply verified Gradle migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: agent/release-ci-supply-chain-gates
          fetch-depth: 0

      - name: Apply Detekt CLI migration
        run: python3 tools/ci/apply_detekt_cli_migration.py

      - name: Validate and commit migration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- tools/ci/apply_detekt_cli_migration.py .github/workflows/stage13_detekt_migration.yml
          git diff -- app/build.gradle settings.gradle
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle settings.gradle
          git commit -m "build: replace conflicting Detekt plugin with CLI task"
          git push origin HEAD:agent/release-ci-supply-chain-gates
