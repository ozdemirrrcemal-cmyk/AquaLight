name: CodeQL Security Scan

on:
  workflow_dispatch:
  push:
    branches:
      - "main"
      - "release"
      - "commercial/14-final-validation"
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    # Dependabot Gradle PRs run this job only after trust refresh dispatch.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]' ||
      !startsWith(github.event.pull_request.head.ref, 'dependabot/gradle/')
    name: Analyze Kotlin/Java
    runs-on: ubuntu-latest
    env:
      CI: "true"
      AQL_FIREBASE_DEBUG_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_DEBUG_CONFIG_BASE64 }}
      AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64 }}

    strategy:
      fail-fast: false
      matrix:
        language: [ "java-kotlin" ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Provision Dependabot Firebase fixtures
        if: ${{ github.actor == 'dependabot[bot]' }}
        uses: ./.github/actions/provision-dependabot-firebase

      - name: Verify Stage 14 commercial policy
        run: |
          python3 tools/verify_stage14_policy.py \
            --policy config/commercial/stage14-validation-policy.json \
            --app-gradle app/build.gradle \
            --emulator-workflow .github/workflows/android_emulator_tests.yml \
            --release-workflow .github/workflows/android_release.yml \
            --summary build/reports/stage14/policy-validation.json

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "15859902"

      - name: Install SDK packages
        shell: bash
        run: |
          set -Eeu
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify non-production Firebase inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in \
            AQL_FIREBASE_DEBUG_CONFIG_BASE64 \
            AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "Required CodeQL Firebase input is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Run architecture and navigation guards
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/architecture_guard.py
            python3 tools/session_startup_guard.py
            python3 tools/composition_root_guard.py
            python3 tools/ui_dependency_construction_guard.py
            python3 tools/device_application_boundary_guard.py
            python3 tools/device_root_application_boundary_guard.py
            python3 tools/tank_device_assignment_boundary_guard.py
            python3 tools/aquarium_application_boundary_guard.py
            python3 tools/care_application_boundary_guard.py
            python3 tools/provisioning_discovery_boundary_guard.py
            python3 tools/provisioning_progress_boundary_guard.py
            python3 tools/provisioning_commit_recovery_guard.py
            python3 tools/navigation_guard.py
            python3 tools/firmware_interoperability_guard.py
            python3 tools/ws_v1_commercial_closure_guard.py
            python3 tools/permission_architecture_guard.py
            python3 tools/notification_reminder_architecture_guard.py
            python3 tools/process_safe_feedback_guard.py
            python3 tools/stage9_feedback_media_guard.py
            python3 tools/design_system_resource_guard.py
            python3 tools/localization_accessibility_guard.py
          } 2>&1 | tee architecture-guards.log

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build uncached Debug APK for CodeQL extraction
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            2>&1 | tee codeql-extraction-build.log

      - name: Run Debug unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-test.log

      - name: Run Debug lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-debug.log

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble-debug.log

      - name: Generate CI-only release-smoke keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore release-key.jks \
            -storepass aqualight-ci \
            -alias aqualight-ci \
            -keypass aqualight-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AquaLight CI CodeQL Smoke,O=AquaLight,C=TR"

      - name: Run Release Smoke unit tests
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew testReleaseSmokeUnitTest --no-daemon --stacktrace \
            2>&1 | tee unit-test-release-smoke.log

      - name: Run Release Smoke lint
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew lintReleaseSmoke --no-daemon --stacktrace \
            2>&1 | tee lint-release-smoke.log

      - name: Build minified Release Smoke APK with CI-only signing
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -Eeuo pipefail
          ./gradlew assembleReleaseSmoke --no-daemon --stacktrace \
            2>&1 | tee assemble-release-smoke.log
          smoke_apk="$(find app/build/outputs/apk/releaseSmoke -type f -name '*.apk' -print -quit)"
          test -n "$smoke_apk"
          test -s "$smoke_apk"
          test -s app/build/outputs/mapping/releaseSmoke/mapping.txt

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-validation-logs-${{ github.run_number }}
          path: |
            build/reports/stage14/policy-validation.json
            architecture-guards.log
            codeql-extraction-build.log
            unit-test.log
            unit-test-release-smoke.log
            lint-debug.log
            lint-release-smoke.log
            assemble-debug.log
            assemble-release-smoke.log
            app/build/outputs/mapping/releaseSmoke/mapping.txt
            app/build/reports/stage14/detekt-policy-summary.json
            app/build/reports/detekt/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/tests/testReleaseSmokeUnitTest/**
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-releaseSmoke.*
          if-no-files-found: ignore

      - name: Remove CI-only build material
        if: always()
        shell: bash
        run: |
          rm -f release-key.jks
          rm -f app/src/debug/google-services.json
          rm -f app/src/releaseSmoke/google-services.json

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          output: codeql-results
          upload-database: false
          wait-for-processing: true

      - name: Enforce zero critical and high CodeQL findings
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/verify_codeql_sarif.py \
            --sarif-dir codeql-results \
            --commit "${GITHUB_SHA}" \
            --summary codeql-results/codeql-summary.json

      - name: Upload CodeQL SARIF evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-sarif-${{ github.sha }}
          path: codeql-results/**
          if-no-files-found: error
          retention-days: 30

  production-release-variant:
    name: Production release variant validation
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/commercial/14-final-validation' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production-release
    env:
      CI: "true"
      AQL_FIREBASE_PRODUCTION_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_PRODUCTION_CONFIG_BASE64 }}

    steps:
      - name: Checkout Stage 14 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "15859902"

      - name: Install SDK packages
        shell: bash
        run: |
          set -Eeu
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          chmod +x ./gradlew

      - name: Verify production Firebase input
        shell: bash
        run: |
          set -Eeuo pipefail
          value="${AQL_FIREBASE_PRODUCTION_CONFIG_BASE64:-}"
          if [[ -z "${value//[[:space:]]/}" ]]; then
            echo "Required CodeQL production Firebase input is missing." >&2
            exit 1
          fi

      - name: Generate CI-only release keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore release-key.jks \
            -storepass aqualight-ci \
            -alias aqualight-ci \
            -keypass aqualight-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AquaLight CI CodeQL Release,O=AquaLight,C=TR"

      - name: Run Release unit tests
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace \
            2>&1 | tee unit-test-release.log

      - name: Run Release lint
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew lintRelease --no-daemon --stacktrace \
            2>&1 | tee lint-release.log

      - name: Build minified Release APK with CI-only signing
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -Eeuo pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace \
            2>&1 | tee assemble-release.log
          test -s app/build/outputs/apk/release/AquaLight.apk
          test -s app/build/outputs/mapping/release/mapping.txt

      - name: Upload protected release validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-production-release-${{ github.sha }}
          path: |
            unit-test-release.log
            lint-release.log
            assemble-release.log
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/tests/testReleaseUnitTest/**
            app/build/reports/lint-results-release.*
          if-no-files-found: error
          retention-days: 30

      - name: Remove CI-only build material
        if: always()
        shell: bash
        run: |
          rm -f release-key.jks
          rm -f app/src/release/google-services.json
