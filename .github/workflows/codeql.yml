name: CodeQL Security Scan

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Kotlin/Java
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run architecture and navigation guards
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/architecture_guard.py
            python3 tools/session_startup_guard.py
            python3 tools/composition_root_guard.py
            python3 tools/ui_dependency_construction_guard.py
            python3 tools/device_application_boundary_guard.py
            python3 tools/device_root_application_boundary_guard.py
            python3 tools/tank_device_assignment_boundary_guard.py
            python3 tools/aquarium_application_boundary_guard.py
            python3 tools/care_application_boundary_guard.py
            python3 tools/provisioning_discovery_boundary_guard.py
            python3 tools/provisioning_progress_boundary_guard.py
            python3 tools/provisioning_commit_recovery_guard.py
            python3 tools/navigation_guard.py
          } 2>&1 | tee architecture-guards.log

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build uncached Debug APK for CodeQL extraction
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            2>&1 | tee codeql-extraction-build.log

      - name: Run Debug unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-test.log

      - name: Run Debug lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-debug.log

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble-debug.log

      - name: Generate CI-only release keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore release-key.jks \
            -storepass aqualight-ci \
            -alias aqualight-ci \
            -keypass aqualight-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AquaLight CI,O=AquaLight,C=TR"

      - name: Run Release unit tests
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee unit-test-release.log

      - name: Run Release lint
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew lintRelease --no-daemon --stacktrace 2>&1 | tee lint-release.log

      - name: Build minified Release APK with CI-only signing
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee assemble-release.log
          test -s app/build/outputs/apk/release/AquaLight.apk
          test -s app/build/outputs/mapping/release/mapping.txt

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-validation-logs-${{ github.run_number }}
          path: |
            architecture-guards.log
            codeql-extraction-build.log
            unit-test.log
            unit-test-release.log
            lint-debug.log
            lint-release.log
            assemble-debug.log
            assemble-release.log
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/tests/testReleaseUnitTest/**
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      - name: Remove CI-only release keystore
        if: always()
        run: rm -f release-key.jks

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
          upload-database: false
          wait-for-processing: false

      - name: Collect CodeQL diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          {
            echo "Runner temp: ${RUNNER_TEMP}"
            echo "CodeQL result files:"
            find codeql-results -maxdepth 5 -type f -print 2>/dev/null
            echo "CodeQL diagnostic files:"
            find "${RUNNER_TEMP}" -maxdepth 8 -type f \
              \( -path '*/codeql_databases/*/log/*' -o -iname '*codeql*.log' \) \
              -print 2>/dev/null
            while IFS= read -r file; do
              echo "===== ${file} ====="
              tail -n 500 "${file}" 2>/dev/null
            done < <(
              find "${RUNNER_TEMP}" -maxdepth 8 -type f \
                \( -path '*/codeql_databases/*/log/*' -o -iname '*codeql*.log' \) \
                -print 2>/dev/null
            )
          } > codeql-diagnostics.log 2>&1
          cat codeql-diagnostics.log

      - name: Upload CodeQL result diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ github.run_number }}
          path: |
            codeql-results/**
            codeql-diagnostics.log
            ${{ runner.temp }}/codeql_databases/*/log/**
          if-no-files-found: ignore
