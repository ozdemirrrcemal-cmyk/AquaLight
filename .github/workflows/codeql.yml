name: CodeQL Security Scan

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Branch, tag, or commit to analyze
        required: false
        default: ""
        type: string
      release_tag:
        description: Canonical vMAJOR.MINOR.PATCH tag for a blocking release scan
        required: false
        default: ""
        type: string
      release_gate:
        description: Enforce exact-ref processing and block critical/high alerts
        required: false
        default: false
        type: boolean
    secrets:
      firebase_production_config_base64:
        required: false
    outputs:
      release-commit:
        description: Exact commit analyzed by CodeQL
        value: ${{ jobs.analyze.outputs.release-commit }}
      evidence-artifact:
        description: Blocking release CodeQL evidence artifact name
        value: ${{ jobs.analyze.outputs.evidence-artifact }}
  workflow_dispatch:
  push:
    branches: [ "main", "release" ]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Kotlin/Java
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      release-commit: ${{ steps.identity.outputs.release-commit }}
      evidence-artifact: ${{ steps.release-evidence.outputs.artifact-name }}
    env:
      CI: "true"
      AQL_RELEASE_GATE: ${{ inputs.release_gate || false }}
      AQL_RELEASE_TAG: ${{ inputs.release_tag || '' }}
      AQL_FIREBASE_PRODUCTION_CONFIG_BASE64: >-
        ${{ inputs.release_gate && secrets.firebase_production_config_base64 || '' }}

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}

      - name: Resolve exact CodeQL identity
        id: identity
        shell: bash
        run: |
          set -Eeuo pipefail
          checked_out_commit="$(git rev-parse HEAD)"
          codeql_ref="${GITHUB_REF}"

          if [[ "${AQL_RELEASE_GATE}" == "true" ]]; then
            if [[ ! "${AQL_RELEASE_TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Release CodeQL gate requires vMAJOR.MINOR.PATCH, got: ${AQL_RELEASE_TAG}" >&2
              exit 1
            fi

            git fetch --force --tags origin
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
            release_commit="$(git rev-list -n 1 "${AQL_RELEASE_TAG}")"
            test -n "${release_commit}"
            test "${checked_out_commit}" = "${release_commit}"
            git merge-base --is-ancestor "${release_commit}" origin/main
            codeql_ref="refs/tags/${AQL_RELEASE_TAG}"
          else
            release_commit="${checked_out_commit}"
          fi

          echo "release-commit=${release_commit}" >> "${GITHUB_OUTPUT}"
          echo "codeql-ref=${codeql_ref}" >> "${GITHUB_OUTPUT}"

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -Eeu
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36" "cmdline-tools;latest"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          chmod +x gradlew

      - name: Run architecture and navigation guards
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/architecture_guard.py
            python3 tools/session_startup_guard.py
            python3 tools/composition_root_guard.py
            python3 tools/ui_dependency_construction_guard.py
            python3 tools/device_application_boundary_guard.py
            python3 tools/device_root_application_boundary_guard.py
            python3 tools/tank_device_assignment_boundary_guard.py
            python3 tools/aquarium_application_boundary_guard.py
            python3 tools/care_application_boundary_guard.py
            python3 tools/provisioning_discovery_boundary_guard.py
            python3 tools/provisioning_progress_boundary_guard.py
            python3 tools/provisioning_commit_recovery_guard.py
            python3 tools/navigation_guard.py
            python3 tools/permission_architecture_guard.py
            python3 tools/notification_reminder_architecture_guard.py
            python3 tools/process_safe_feedback_guard.py
            python3 tools/stage9_feedback_media_guard.py
            python3 tools/design_system_resource_guard.py
            python3 tools/localization_accessibility_guard.py
          } 2>&1 | tee architecture-guards.log

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build uncached Debug APK for CodeQL extraction
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            2>&1 | tee codeql-extraction-build.log

      - name: Run Debug lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-debug.log

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble-debug.log

      - name: Generate CI-only release keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore release-key.jks \
            -storepass aqualight-ci \
            -alias aqualight-ci \
            -keypass aqualight-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AquaLight CI,O=AquaLight,C=TR"

      - name: Run all unit-test variants and verify JUnit evidence
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -Eeuo pipefail
          mkdir -p codeql-unit-tests

          if [[ "${AQL_RELEASE_GATE}" == "true" ]]; then
            commercial_task=":app:testReleaseUnitTest"
            commercial_variant="release=app/build/test-results/testReleaseUnitTest"
          else
            commercial_task=":app:testReleaseSmokeUnitTest"
            commercial_variant="releaseSmoke=app/build/test-results/testReleaseSmokeUnitTest"
          fi

          set +e
          ./gradlew \
            :app:testDebugUnitTest \
            :app:testStagingUnitTest \
            "${commercial_task}" \
            --continue \
            --no-daemon \
            --stacktrace \
            2>&1 | tee codeql-unit-tests/gradle-unit-tests.log
          unit_test_gradle_status=${PIPESTATUS[0]}
          set -e

          python3 tools/release_pipeline/verify_junit_reports.py \
            --variant debug=app/build/test-results/testDebugUnitTest \
            --variant staging=app/build/test-results/testStagingUnitTest \
            --variant "${commercial_variant}" \
            --allowlist config/testing/allowed-skipped-unit-tests.json \
            --output codeql-unit-tests

          if (( unit_test_gradle_status != 0 )); then
            echo "Gradle reported a unit-test task failure: ${unit_test_gradle_status}" >&2
            exit "${unit_test_gradle_status}"
          fi

      - name: Run commercial-variant lint
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -Eeuo pipefail
          if [[ "${AQL_RELEASE_GATE}" == "true" ]]; then
            lint_task="lintRelease"
            lint_log="lint-release.log"
          else
            lint_task="lintReleaseSmoke"
            lint_log="lint-release-smoke.log"
          fi
          ./gradlew "${lint_task}" --no-daemon --stacktrace 2>&1 | tee "${lint_log}"

      - name: Build minified commercial-validation APK
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -Eeuo pipefail
          if [[ "${AQL_RELEASE_GATE}" == "true" ]]; then
            build_task="assembleRelease"
            build_log="assemble-release.log"
            apk_path="app/build/outputs/apk/release/AquaLight.apk"
            mapping_path="app/build/outputs/mapping/release/mapping.txt"
          else
            build_task="assembleReleaseSmoke"
            build_log="assemble-release-smoke.log"
            apk_path="$(find app/build/outputs/apk/releaseSmoke -type f -name '*.apk' -print -quit 2>/dev/null || true)"
            mapping_path="app/build/outputs/mapping/releaseSmoke/mapping.txt"
          fi

          ./gradlew "${build_task}" --no-daemon --stacktrace 2>&1 | tee "${build_log}"

          if [[ "${AQL_RELEASE_GATE}" != "true" ]]; then
            apk_path="$(find app/build/outputs/apk/releaseSmoke -type f -name '*.apk' -print -quit)"
          fi
          test -n "${apk_path}"
          test -s "${apk_path}"
          test -s "${mapping_path}"

      - name: Perform CodeQL Analysis and wait for processing
        id: codeql
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          output: codeql-results
          post-processed-sarif-path: release-quality/security/sarif
          upload-database: false
          wait-for-processing: true
          category: ${{ inputs.release_gate && 'aqualight-release-java-kotlin' || 'aqualight-java-kotlin' }}
          ref: ${{ steps.identity.outputs.codeql-ref }}
          sha: ${{ steps.identity.outputs.release-commit }}

      - name: Enforce exact release CodeQL alert gate
        if: ${{ inputs.release_gate }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release_pipeline/verify_codeql_release_gate.py \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${{ steps.identity.outputs.release-commit }}" \
            --ref "${{ steps.identity.outputs.codeql-ref }}" \
            --category "aqualight-release-java-kotlin" \
            --sarif-directory release-quality/security/sarif \
            --analysis-output release-quality/security/codeql-analysis.json \
            --alerts-output release-quality/security/code-scanning-alerts.json \
            --summary-output release-quality/security/codeql-summary.json

      - name: Prepare blocking release security evidence
        id: release-evidence
        if: ${{ inputs.release_gate }}
        shell: bash
        run: |
          set -Eeuo pipefail
          artifact_name="AquaLight-CodeQL-${AQL_RELEASE_TAG}"
          test -s release-quality/security/codeql-analysis.json
          test -s release-quality/security/code-scanning-alerts.json
          test -s release-quality/security/codeql-summary.json
          find release-quality/security/sarif -type f -name '*.sarif' -size +0c -print -quit | grep -q .
          echo "artifact-name=${artifact_name}" >> "${GITHUB_OUTPUT}"

      - name: Upload blocking release security evidence
        if: ${{ inputs.release_gate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.release-evidence.outputs.artifact-name }}
          path: release-quality/security/
          if-no-files-found: error
          retention-days: 90

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-validation-logs-${{ github.run_number }}
          path: |
            architecture-guards.log
            codeql-extraction-build.log
            codeql-results/**
            codeql-unit-tests/**
            lint-debug.log
            lint-release.log
            lint-release-smoke.log
            assemble-debug.log
            assemble-release.log
            assemble-release-smoke.log
            app/build/outputs/mapping/release/mapping.txt
            app/build/outputs/mapping/releaseSmoke/mapping.txt
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/tests/testStagingUnitTest/**
            app/build/reports/tests/testReleaseUnitTest/**
            app/build/reports/tests/testReleaseSmokeUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/test-results/testStagingUnitTest/**
            app/build/test-results/testReleaseUnitTest/**
            app/build/test-results/testReleaseSmokeUnitTest/**
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-release.*
            app/build/reports/lint-results-releaseSmoke.*
          if-no-files-found: ignore

      - name: Remove CI-only material
        if: always()
        shell: bash
        run: |
          rm -f release-key.jks
          find app/src -type f -name google-services.json -delete
