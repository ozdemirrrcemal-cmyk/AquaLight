name: CodeQL Security Scan

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Kotlin/Java
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run architecture guard
        run: python3 tools/architecture_guard.py

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Run Debug unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-test.log

      - name: Run Debug lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-debug.log

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble-debug.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-validation-logs-${{ github.run_number }}
          path: |
            unit-test.log
            lint-debug.log
            assemble-debug.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
