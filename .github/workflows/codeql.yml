name: CodeQL Security Scan

on:
  push:
    branches: ["main", "release"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Kotlin/Java
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        language: ["java-kotlin"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"
          chmod +x gradlew

      - name: Run architecture and navigation guards
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          {
            python3 tools/architecture_guard.py
            python3 tools/session_startup_guard.py
            python3 tools/composition_root_guard.py
            python3 tools/ui_dependency_construction_guard.py
            python3 tools/device_application_boundary_guard.py
            python3 tools/device_root_application_boundary_guard.py
            python3 tools/tank_device_assignment_boundary_guard.py
            python3 tools/aquarium_application_boundary_guard.py
            python3 tools/care_application_boundary_guard.py
            python3 tools/provisioning_discovery_boundary_guard.py
            python3 tools/provisioning_progress_boundary_guard.py
            python3 tools/provisioning_commit_recovery_guard.py
            python3 tools/navigation_guard.py
            python3 tools/permission_architecture_guard.py
            python3 tools/notification_reminder_architecture_guard.py
            python3 tools/process_safe_feedback_guard.py
            python3 tools/stage9_feedback_media_guard.py
            python3 tools/firebase_telemetry_guard.py
            python3 tools/privacy_legal_guard.py
            python3 tools/design_system_resource_guard.py
            python3 tools/localization_accessibility_guard.py
          } 2>&1 | tee architecture-guards.log

      - name: Initialize CodeQL
        uses: github/codeql-action/init@0daab03d71ff584ef619d027a3fd9146679c5d84 # v3.35.3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build uncached Debug APK for CodeQL extraction
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew clean assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            2>&1 | tee codeql-extraction-build.log

      - name: Run Debug unit tests and coverage
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew testDebugUnitTest jacocoDebugUnitTestReport \
            --no-daemon --stacktrace 2>&1 | tee unit-test.log

      - name: Run Debug lint and Detekt
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew lintDebug detekt --no-daemon --stacktrace \
            2>&1 | tee static-analysis.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-validation-logs-${{ github.run_number }}
          path: |
            architecture-guards.log
            codeql-extraction-build.log
            unit-test.log
            static-analysis.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/jacoco/**
            app/build/reports/lint-results-debug.*
            app/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@0daab03d71ff584ef619d027a3fd9146679c5d84 # v3.35.3
        with:
          output: codeql-results
          upload-database: false
          wait-for-processing: false
