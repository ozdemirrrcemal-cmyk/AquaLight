name: CodeQL Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Kotlin and Java
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: 'true'
      FIREBASE_DEVELOPMENT_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_DEVELOPMENT_GOOGLE_SERVICES_JSON_BASE64 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install JDK 17
        uses: actions/setup-java@7a445ee88d4e23b52c33b6bd5c9534e3e3fa7393 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare development Firebase configuration
        run: python3 tools/ci/materialize_firebase_config.py --environment development --allow-ci-fixture

      - name: Run commercial guards
        run: bash tools/run_commercial_guards.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build development variant for extraction
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew clean assembleDevelopmentDebug \
            --no-daemon --no-build-cache --rerun-tasks --stacktrace \
            2>&1 | tee codeql-extraction-build.log

      - name: Run unit and lint validation
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDevelopmentDebugUnitTest lintDevelopmentDebug detektDevelopmentDebug \
            --no-daemon --stacktrace 2>&1 | tee codeql-validation.log

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4.36.0

      - name: Upload CodeQL build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-validation-${{ github.run_id }}
          path: |
            codeql-extraction-build.log
            codeql-validation.log
            app/build/reports/tests/testDevelopmentDebugUnitTest/**
            app/build/reports/lint-results-developmentDebug.*
            app/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove generated Firebase configuration
        if: always()
        run: rm -f app/src/development/google-services.json
