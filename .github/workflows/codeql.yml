name: CodeQL Security Scan

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Kotlin/Java
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run architecture and navigation guards
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/architecture_guard.py
            python3 tools/session_startup_guard.py
            python3 tools/composition_root_guard.py
            python3 tools/ui_dependency_construction_guard.py
            python3 tools/device_application_boundary_guard.py
            python3 tools/device_root_application_boundary_guard.py
            python3 tools/tank_device_assignment_boundary_guard.py
            python3 tools/aquarium_application_boundary_guard.py
            python3 tools/care_application_boundary_guard.py
            python3 tools/provisioning_discovery_boundary_guard.py
            python3 tools/provisioning_progress_boundary_guard.py
            python3 tools/provisioning_commit_recovery_guard.py
            python3 tools/navigation_guard.py
            python3 tools/permission_architecture_guard.py
            python3 tools/notification_reminder_architecture_guard.py
            python3 tools/process_safe_feedback_guard.py
            python3 tools/stage9_feedback_media_guard.py
            python3 tools/firebase_environment_guard.py
            python3 tools/firebase_telemetry_guard.py
            python3 tools/design_system_resource_guard.py
            python3 tools/localization_accessibility_guard.py
          } 2>&1 | tee architecture-guards.log

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build uncached Debug APK for CodeQL extraction
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDevelopmentDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            2>&1 | tee codeql-extraction-build.log

      - name: Run Debug unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDevelopmentDebugUnitTest --no-daemon --stacktrace \
            2>&1 | tee unit-test-development.log

      - name: Run Debug lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDevelopmentDebug --no-daemon --stacktrace \
            2>&1 | tee lint-development.log

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDevelopmentDebug --no-daemon --stacktrace \
            2>&1 | tee assemble-development.log

      - name: Generate CI-only release keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore release-key.jks \
            -storepass aqualight-ci \
            -alias aqualight-ci \
            -keypass aqualight-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AquaLight CI,O=AquaLight,C=TR"

      - name: Run Staging release-smoke unit tests
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew testStagingReleaseSmokeUnitTest --no-daemon --stacktrace \
            2>&1 | tee unit-test-staging.log

      - name: Run Staging release-smoke lint
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew lintStagingReleaseSmoke --no-daemon --stacktrace \
            2>&1 | tee lint-staging.log

      - name: Build minified Staging APK with CI-only signing
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew assembleStagingReleaseSmoke --no-daemon --stacktrace \
            2>&1 | tee assemble-staging.log
          test -n "$(find app/build/outputs/apk/staging/releaseSmoke -type f -name '*.apk' -print -quit)"
          test -s app/build/outputs/mapping/stagingReleaseSmoke/mapping.txt

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-validation-logs-${{ github.run_number }}
          path: |
            architecture-guards.log
            codeql-extraction-build.log
            unit-test-development.log
            unit-test-staging.log
            lint-development.log
            lint-staging.log
            assemble-development.log
            assemble-staging.log
            app/build/outputs/mapping/stagingReleaseSmoke/mapping.txt
            app/build/reports/tests/testDevelopmentDebugUnitTest/**
            app/build/reports/tests/testStagingReleaseSmokeUnitTest/**
            app/build/reports/lint-results-developmentDebug.*
            app/build/reports/lint-results-stagingReleaseSmoke.*
          if-no-files-found: ignore

      - name: Remove CI-only release keystore
        if: always()
        run: rm -f release-key.jks

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
          upload-database: false
          wait-for-processing: false
