name: CodeQL Security Scan

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze Kotlin/Java
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_PASSWORD: aqualight-ci
      RELEASE_KEY_ALIAS: aqualight-ci
      RELEASE_KEY_PASSWORD: aqualight-ci

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmdline-tools;latest"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run release-governance unit tests
        run: >-
          python3 -m unittest
          tools.release_metadata_test
          tools.github_actions_pin_guard_test

      - name: Run architecture and navigation guards
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/github_actions_pin_guard.py
            python3 tools/architecture_guard.py
            python3 tools/session_startup_guard.py
            python3 tools/composition_root_guard.py
            python3 tools/ui_dependency_construction_guard.py
            python3 tools/device_application_boundary_guard.py
            python3 tools/device_root_application_boundary_guard.py
            python3 tools/tank_device_assignment_boundary_guard.py
            python3 tools/aquarium_application_boundary_guard.py
            python3 tools/care_application_boundary_guard.py
            python3 tools/provisioning_discovery_boundary_guard.py
            python3 tools/provisioning_progress_boundary_guard.py
            python3 tools/provisioning_commit_recovery_guard.py
            python3 tools/navigation_guard.py
            python3 tools/permission_architecture_guard.py
            python3 tools/notification_reminder_architecture_guard.py
            python3 tools/process_safe_feedback_guard.py
            python3 tools/stage9_feedback_media_guard.py
            python3 tools/design_system_resource_guard.py
            python3 tools/localization_accessibility_guard.py
          } 2>&1 | tee architecture-guards.log

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build uncached Debug APK for CodeQL extraction
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            2>&1 | tee codeql-extraction-build.log

      - name: Run Debug unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-test.log

      - name: Run full Debug lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-debug.log

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble-debug.log

      - name: Generate CI-only release keystore
        shell: bash
        run: |
          set -euo pipefail
          AQL_RELEASE_KEYSTORE_PATH="$RUNNER_TEMP/aqualight-codeql-release.jks"
          echo "AQL_RELEASE_KEYSTORE_PATH=$AQL_RELEASE_KEYSTORE_PATH" >> "$GITHUB_ENV"
          keytool -genkeypair -noprompt \
            -keystore "$AQL_RELEASE_KEYSTORE_PATH" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            -keypass "$RELEASE_KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AquaLight CI,O=AquaLight,C=TR"
          chmod 600 "$AQL_RELEASE_KEYSTORE_PATH"

      - name: Run Release unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee unit-test-release.log

      - name: Run full Release lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintRelease --no-daemon --stacktrace 2>&1 | tee lint-release.log

      - name: Build minified Release APK with CI-only signing
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee assemble-release.log
          RELEASE_APK="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$RELEASE_APK"
          test -s "$RELEASE_APK"
          test -s app/build/outputs/mapping/release/mapping.txt

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codeql-validation-logs-${{ github.run_number }}
          path: |
            architecture-guards.log
            codeql-extraction-build.log
            unit-test.log
            unit-test-release.log
            lint-debug.log
            lint-release.log
            assemble-debug.log
            assemble-release.log
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/tests/testReleaseUnitTest/**
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      - name: Remove CI-only release keystore
        if: always()
        shell: bash
        run: |
          if [[ -n "${AQL_RELEASE_KEYSTORE_PATH:-}" ]]; then
            rm -f "$AQL_RELEASE_KEYSTORE_PATH"
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          output: codeql-results
          upload-database: false
          wait-for-processing: false
