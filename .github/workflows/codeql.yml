name: CodeQL Security Scan

on:
  push:
    branches: [main, release]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Kotlin and Java
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Android toolchain
        uses: ./.github/actions/android-setup

      - name: Validate immutable Action refs and architecture guards
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/verify_action_pins.py
          bash tools/run_architecture_guards.sh

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build and test extractable variants
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          ./gradlew \
            :app:assembleDebug \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:detekt \
            :app:assembleReleaseSmoke \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace 2>&1 | tee codeql-extraction-build.log

      - name: Upload CodeQL validation logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-validation-${{ github.run_number }}
          path: |
            codeql-extraction-build.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/lint-results-debug.*
            app/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          output: codeql-results
          upload-database: false
          wait-for-processing: false
