name: CodeQL Security Scan

on:
  push:
    branches: [ "main", "release" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  factory-callsite-hotfix:
    name: Patch injected Fragment ViewModel factories
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/stage-3-dependency-boundaries-v1'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Stage 3 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-3-dependency-boundaries-v1
          fetch-depth: 0

      - name: Patch callsites and guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("app/src/main/java/com/aqua/aqualight/ui")
          injected = {
              "SettingsViewModel",
              "DeviceStatusViewModel",
              "DevicesViewModel",
              "DeviceAddViewModel",
              "DeviceQrScanViewModel",
              "DeviceProvisioningProgressViewModel",
              "TankDetailDevicesViewModel",
              "TankDeviceSelectViewModel",
              "DeviceLightRootViewModel",
              "DeviceCoolingRootViewModel",
              "DeviceTimerRootViewModel",
              "DeviceDosingRootViewModel",
              "DeviceRootOverviewViewModel",
          }
          vm_union = "|".join(sorted(injected, key=len, reverse=True))
          pattern = re.compile(
              rf"(?P<indent>^[ \t]*)private val (?P<name>[A-Za-z_][A-Za-z0-9_]*): "
              rf"(?P<vm>{vm_union}) by viewModels\(\)",
              re.MULTILINE,
          )

          changed = []
          for path in sorted(root.rglob("*.kt")):
              text = path.read_text(encoding="utf-8")

              def replace(match: re.Match[str]) -> str:
                  indent = match.group("indent")
                  return (
                      f'{indent}private val {match.group("name")}: {match.group("vm")} by viewModels {{\n'
                      f'{indent}    requireContext().requireAppContainer().defaultViewModelFactory\n'
                      f'{indent}}}'
                  )

              updated, count = pattern.subn(replace, text)
              if count == 0:
                  continue

              import_line = "import com.aqua.aqualight.composition.requireAppContainer\n"
              if import_line not in updated:
                  marker = "import com.aqua.aqualight.R\n"
                  if marker not in updated:
                      raise SystemExit(f"Import marker missing in {path}")
                  updated = updated.replace(marker, marker + import_line, 1)

              path.write_text(updated, encoding="utf-8")
              changed.append((str(path), count))

          for path, count in changed:
              print(f"Patched {count} delegate(s): {path}")

          guard = Path("tools/ui_dependency_construction_guard.py")
          guard_text = guard.read_text(encoding="utf-8")
          marker = "VIEWMODEL_WORKFLOW_CONSTRUCTION = {\n"
          guard_block = '''INJECTED_FRAGMENT_VIEWMODELS = (
              "SettingsViewModel",
              "DeviceStatusViewModel",
              "DevicesViewModel",
              "DeviceAddViewModel",
              "DeviceQrScanViewModel",
              "DeviceProvisioningProgressViewModel",
              "TankDetailDevicesViewModel",
              "TankDeviceSelectViewModel",
              "DeviceLightRootViewModel",
              "DeviceCoolingRootViewModel",
              "DeviceTimerRootViewModel",
              "DeviceDosingRootViewModel",
              "DeviceRootOverviewViewModel",
          )

          '''
          if "INJECTED_FRAGMENT_VIEWMODELS = (" not in guard_text:
              if marker not in guard_text:
                  raise SystemExit("Guard insertion marker missing")
              guard_text = guard_text.replace(marker, guard_block + marker, 1)

          scan_marker = "    if FIREBASE_IMPORT.search(text):\n        errors.append(f\"{relative}: Firebase SDK imports are forbidden in UI\")\n\n"
          scan_block = '''    for injected_view_model in INJECTED_FRAGMENT_VIEWMODELS:
              plain_delegate = f": {injected_view_model} by viewModels()"
              if plain_delegate in text:
                  errors.append(
                      f"{relative}: injected Fragment ViewModel must use AppContainer factory: "
                      f"{plain_delegate}"
                  )
              typed_delegate = f": {injected_view_model} by viewModels"
              if typed_delegate in text and "defaultViewModelFactory" not in text:
                  errors.append(
                      f"{relative}: injected Fragment ViewModel is missing defaultViewModelFactory"
                  )

          '''
          if "plain_delegate = f\": {injected_view_model} by viewModels()\"" not in guard_text:
              if scan_marker not in guard_text:
                  raise SystemExit("Guard scan marker missing")
              guard_text = guard_text.replace(scan_marker, scan_marker + scan_block, 1)

          guard.write_text(guard_text, encoding="utf-8")
          PY

      - name: Verify UI factory guard
        run: python3 tools/ui_dependency_construction_guard.py

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hotfix changes remain."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/aqua/aqualight/ui tools/ui_dependency_construction_guard.py
          git commit -m "fix: wire injected fragment ViewModels [factory-callsite-hotfix]"
          git push origin HEAD:agent/stage-3-dependency-boundaries-v1

  analyze:
    name: Analyze Kotlin/Java
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run architecture and navigation guards
        shell: bash
        run: |
          set -o pipefail
          {
            python3 tools/architecture_guard.py
            python3 tools/session_startup_guard.py
            python3 tools/composition_root_guard.py
            python3 tools/ui_dependency_construction_guard.py
            python3 tools/navigation_guard.py
          } 2>&1 | tee architecture-guards.log

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Run Debug unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee unit-test.log

      - name: Run Debug lint
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-debug.log

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee assemble-debug.log

      - name: Generate CI-only release keystore
        run: |
          keytool -genkeypair -noprompt \
            -keystore release-key.jks \
            -storepass aqualight-ci \
            -alias aqualight-ci \
            -keypass aqualight-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AquaLight CI,O=AquaLight,C=TR"

      - name: Run Release unit tests
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew testReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee unit-test-release.log

      - name: Run Release lint
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew lintRelease --no-daemon --stacktrace 2>&1 | tee lint-release.log

      - name: Build minified Release APK with CI-only signing
        shell: bash
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        run: |
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee assemble-release.log
          test -s app/build/outputs/apk/release/AquaLight.apk
          test -s app/build/outputs/mapping/release/mapping.txt

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-validation-logs-${{ github.run_number }}
          path: |
            architecture-guards.log
            unit-test.log
            unit-test-release.log
            lint-debug.log
            lint-release.log
            assemble-debug.log
            assemble-release.log
            app/build/outputs/mapping/release/mapping.txt
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/tests/testReleaseUnitTest/**
            app/build/reports/lint-results-debug.*
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore

      - name: Remove CI-only release keystore
        if: always()
        run: rm -f release-key.jks

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
