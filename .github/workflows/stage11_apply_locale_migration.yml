name: Stage 11 Locale Migration

on:
  push:
    branches:
      - agent/stage-11-localization-accessibility-clean-v2
    paths:
      - "tools/stage11_apply_locale_migration.py"
      - ".github/workflows/stage11_apply_locale_migration.yml"

permissions:
  contents: write

concurrency:
  group: stage11-locale-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean Stage 11 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-11-localization-accessibility-clean-v2
          fetch-depth: 0

      - name: Apply verified locale migration
        run: python3 tools/stage11_apply_locale_migration.py

      - name: Remove one-time migration files
        run: |
          rm -f tools/stage11_apply_locale_migration.py
          rm -f .github/workflows/stage11_apply_locale_migration.yml

      - name: Commit atomic locale migration
        run: |
          git config user.name "AquaLight Stage 11 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: migrate user-facing formatting to application locale"
          git push origin HEAD:agent/stage-11-localization-accessibility-clean-v2
