name: Stage 11 Touch Target Fix

on:
  push:
    branches:
      - agent/stage-11-localization-accessibility
    paths:
      - tools/stage11_touch_target_fix.py
      - .github/workflows/stage11_touch_target_fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage-11-localization-accessibility
          fetch-depth: 0
      - run: python tools/stage11_touch_target_fix.py
      - run: git rm tools/stage11_touch_target_fix.py .github/workflows/stage11_touch_target_fix.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce 48dp targets across remaining layouts"
          git push origin HEAD:agent/stage-11-localization-accessibility
