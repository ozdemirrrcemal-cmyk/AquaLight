name: Firebase Environment Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/firebase_environment_contract.yml"
      - ".gitignore"
      - "app/build.gradle"
      - "app/google-services.json"
      - "build.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "tools/verify_firebase_environment_contract.sh"

concurrency:
  group: firebase-environment-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify fail-closed Firebase environments
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
        -Dorg.gradle.daemon=false

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeu
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36" "cmdline-tools;latest"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          chmod +x ./gradlew

      - name: Verify Firebase environment contract
        shell: bash
        run: bash tools/verify_firebase_environment_contract.sh

      - name: Upload Firebase contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firebase-environment-contract-${{ github.run_number }}
          path: build/reports/firebase-environment-contract/
          if-no-files-found: error
          retention-days: 90

      - name: Remove generated Firebase material
        if: always()
        shell: bash
        run: find app/src -type f -name google-services.json -delete
