name: Supply Chain Bootstrap

on:
  pull_request:
    paths:
      - build.gradle
      - settings.gradle
      - app/build.gradle
      - gradle/**
      - config/detekt/detekt.yml
      - .github/workflows/supply_chain_bootstrap.yml

permissions:
  contents: read

concurrency:
  group: supply-chain-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-state:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install JDK 17
        uses: actions/setup-java@7a445ee88d4e23b52c33b6bd5c9534e3e3fa7393 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Validate Gradle Wrapper and generate dependency state
        run: |
          chmod +x gradlew
          ./gradlew --version --no-daemon
          ./gradlew resolveAndLockAll \
            --write-locks \
            --write-verification-metadata sha256 \
            --no-daemon \
            --stacktrace
          test -s gradle/verification-metadata.xml
          test -s app/gradle.lockfile
          mkdir -p sealed-dependency-state/gradle sealed-dependency-state/app
          cp gradle/verification-metadata.xml sealed-dependency-state/gradle/
          cp app/gradle.lockfile sealed-dependency-state/app/

      - name: Upload reviewable dependency state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sealed-dependency-state-${{ github.event.pull_request.head.sha }}
          path: sealed-dependency-state/
          if-no-files-found: error
          retention-days: 1
