name: Supply Chain Bootstrap

on:
  pull_request:
    paths:
      - build.gradle
      - settings.gradle
      - app/build.gradle
      - gradle/**
      - config/detekt/detekt.yml
      - .github/workflows/supply_chain_bootstrap.yml

permissions:
  contents: write

concurrency:
  group: supply-chain-bootstrap-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  seal-state:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Install JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Generate verified lock and checksum state
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew resolveAndLockAll \
            --write-locks \
            --write-verification-metadata sha256 \
            --no-daemon \
            --stacktrace 2>&1 | tee supply-chain-bootstrap.log
          test -s gradle/verification-metadata.xml
          test -s app/gradle.lockfile

      - name: Seal generated state and remove bootstrap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -name gradle.lockfile -not -path './.gradle/*' -print -exec git add -- {} +
          git add gradle/verification-metadata.xml
          git rm .github/workflows/supply_chain_bootstrap.yml
          git diff --cached --check
          git commit -m "chore(supply-chain): seal dependency state"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"

      - name: Upload bootstrap diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supply-chain-bootstrap-log-${{ github.event.pull_request.head.sha }}
          path: supply-chain-bootstrap.log
          if-no-files-found: warn
          retention-days: 1
