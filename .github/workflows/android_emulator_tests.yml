name: Android Emulator Integration Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/actions/provision-dependabot-firebase/**"
      - ".github/workflows/android_emulator_tests.yml"
      - "app/**"
      - "build.gradle"
      - "config/commercial/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle"
      - "tools/**"

concurrency:
  group: android-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumentation:
    # Dependabot Gradle PRs run this job only after trust refresh dispatch.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]' ||
      !startsWith(github.event.pull_request.head.ref, 'dependabot/gradle/')
    name: Emulator API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      AQL_FIREBASE_DEBUG_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_DEBUG_CONFIG_BASE64 }}
      AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64 }}

    strategy:
      fail-fast: false
      matrix:
        api-level: [27, 36]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Provision Dependabot Firebase fixtures
        if: ${{ github.actor == 'dependabot[bot]' }}
        uses: ./.github/actions/provision-dependabot-firebase

      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "15859902"

      - name: Install pinned SDK packages
        shell: bash
        run: |
          set -Eeu
          sdkmanager_path="$(readlink -f "$(command -v sdkmanager)")"
          test -x "$sdkmanager_path"
          case "$sdkmanager_path" in
            "${ANDROID_SDK_ROOT}/cmdline-tools/"*/bin/sdkmanager) ;;
            *)
              echo "Untrusted sdkmanager path: $sdkmanager_path" >&2
              exit 1
              ;;
          esac
          if [[ "$sdkmanager_path" == \
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            echo "Mutable cmdline-tools/latest must not drive commercial CI" >&2
            exit 1
          fi
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          set +o pipefail
          yes 2>/dev/null | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" "platform-tools" "platforms;android-36"
          matrix_api="${{ matrix.api-level }}"
          case "$matrix_api" in
            27)
              platform_package="platforms;android-27"
              system_image_package="system-images;android-27;default;x86_64"
              installed_platform="${ANDROID_SDK_ROOT}/platforms/android-27/android.jar"
              installed_image="${ANDROID_SDK_ROOT}/system-images/android-27/default/x86_64/package.xml"
              "$sdkmanager_path" --install \
                "$platform_package" \
                "$system_image_package"
              ;;
            36)
              platform_package="platforms;android-36"
              system_image_package="system-images;android-36;default;x86_64"
              installed_platform="${ANDROID_SDK_ROOT}/platforms/android-36/android.jar"
              installed_image="${ANDROID_SDK_ROOT}/system-images/android-36/default/x86_64/package.xml"
              "$sdkmanager_path" --install \
                "$platform_package" \
                "$system_image_package"
              ;;
            *)
              echo "Unsupported commercial emulator API: $matrix_api" >&2
              exit 1
              ;;
          esac
          test -s "$installed_platform"
          test -s "$installed_image"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify Stage 14 commercial policy
        run: |
          python3 tools/verify_stage14_policy.py \
            --policy config/commercial/stage14-validation-policy.json \
            --app-gradle app/build.gradle \
            --emulator-workflow .github/workflows/android_emulator_tests.yml \
            --release-workflow .github/workflows/android_release.yml \
            --summary build/reports/stage14/policy-validation.json

      - name: Verify non-production Firebase inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in \
            AQL_FIREBASE_DEBUG_CONFIG_BASE64 \
            AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "Required emulator Firebase input is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Verify release-smoke runner contract
        run: |
          grep -Fq "connectedDebugAndroidTest" tools/run_release_smoke.sh
          grep -Fq "bash tools/verify_uninstall_clears_data.sh" tools/run_release_smoke.sh
          grep -Fq "RELEASE_SMOKE_PASS" tools/run_release_smoke.sh
          grep -Fq "ReleaseSmokeActivity" tools/run_release_smoke.sh
          grep -Fq "CleanInstallSmokeActivity" tools/run_release_smoke.sh
          grep -Fq "verify_clean_install_evidence.py" tools/run_release_smoke.sh
          grep -Fq "CLEAN_INSTALL_PASS" tools/run_release_smoke.sh
          grep -Fq "UpgradeInstallSmokeActivity" tools/run_release_smoke.sh
          grep -Fq "verify_upgrade_install_evidence.py" tools/run_release_smoke.sh
          grep -Fq "UPGRADE_INSTALL_CANDIDATE_PASS" tools/run_release_smoke.sh
          grep -Fq "adb install -r" tools/run_release_smoke.sh
          grep -Fq "verify_stage14_junit_evidence.py" tools/run_release_smoke.sh
          grep -Fq "accessibility-instrumentation" tools/run_release_smoke.sh
          grep -Fq "process-recreation-instrumentation" tools/run_release_smoke.sh
          grep -Fq "tank-care-corruption-instrumentation" tools/run_release_smoke.sh
          grep -Fq "verify_force_stop_evidence.py" tools/run_release_smoke.sh
          grep -Fq "verify_accessibility_evidence.py" tools/run_release_smoke.sh
          grep -Fq "AccountDeletionProcessDeathSmokeActivity" tools/run_release_smoke.sh
          grep -Fq "ACCOUNT_DELETION_PROCESS_DEATH_PASS" tools/run_release_smoke.sh
          grep -Fq "auth-confirmed-before-checkpoint" tools/run_release_smoke.sh
          grep -Fq "aqua_smoke_profile" tools/run_release_smoke.sh
          grep -Fq "large-font-light" tools/run_release_smoke.sh
          grep -Fq "rtl-light" tools/run_release_smoke.sh
          grep -Fq "hide_error_dialogs" tools/run_release_smoke.sh
          grep -Fq "CLOSE_SYSTEM_DIALOGS" tools/run_release_smoke.sh

      - name: Prepare lower-version baseline and minified candidate APKs
        shell: bash
        run: bash tools/release_pipeline/prepare_instrumentation.sh

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation and minified release smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          channel: stable
          target: default
          arch: x86_64
          profile: pixel_2
          ram-size: ${{ matrix.api-level == 36 && '4096M' || '1536M' }}
          disk-size: 8G
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot
            -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_release_smoke.sh "${{ matrix.api-level }}"

      - name: Upload instrumentation and smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumentation-api-${{ matrix.api-level }}-${{ github.run_number }}
          path: |
            build/reports/stage14/policy-validation.json
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            release-quality/**
            release-smoke-*.txt
            release-smoke-*.xml
            release-smoke-*.json
            release-smoke-screens/**
            stage14-evidence/**
          if-no-files-found: ignore

      - name: Remove CI-only build material
        if: always()
        shell: bash
        run: |
          rm -f release-key.jks
          rm -f app/src/debug/google-services.json
          rm -f app/src/releaseSmoke/google-services.json
