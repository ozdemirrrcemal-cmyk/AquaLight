name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "app/**"
      - "protocol/**"
      - "tools/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - ".github/dependabot.yml"
      - ".github/workflows/android.yml"
      - ".github/workflows/android_release.yml"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Guard, lint, unit tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Install required SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          chmod +x ./gradlew

      - name: Verify supply-chain workflow references
        run: python3 tools/ci/verify_supply_chain_state.py

      - name: Run architecture guards
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/architecture_guard.py
          python3 tools/session_startup_guard.py
          python3 tools/composition_root_guard.py
          python3 tools/ui_dependency_construction_guard.py
          python3 tools/device_application_boundary_guard.py
          python3 tools/device_root_application_boundary_guard.py
          python3 tools/tank_device_assignment_boundary_guard.py
          python3 tools/aquarium_application_boundary_guard.py
          python3 tools/care_application_boundary_guard.py
          python3 tools/provisioning_discovery_boundary_guard.py
          python3 tools/provisioning_progress_boundary_guard.py
          python3 tools/provisioning_commit_recovery_guard.py
          python3 tools/navigation_guard.py
          python3 tools/ws_protocol_guard.py
          python3 tools/permission_architecture_guard.py
          python3 tools/notification_reminder_architecture_guard.py
          python3 tools/process_safe_feedback_guard.py
          python3 tools/stage9_feedback_media_guard.py
          python3 tools/firebase_telemetry_guard.py
          python3 tools/privacy_legal_guard.py
          python3 tools/design_system_resource_guard.py
          python3 tools/localization_accessibility_guard.py

      - name: Verify resolved Firebase runtime policy
        run: ./gradlew :app:verifyFirebaseRuntimePolicy --no-daemon --stacktrace

      - name: Run standard Android lint and Detekt
        shell: bash
        run: |
          set -o pipefail
          ./gradlew lintDebug detekt --no-daemon --stacktrace 2>&1 | tee static-analysis.log

      - name: Run unit tests and enforce critical coverage
        run: >-
          ./gradlew testDebugUnitTest
          jacocoDebugUnitTestReport
          jacocoDebugCoverageVerification
          --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify merged manifest telemetry policy
        run: python3 tools/firebase_telemetry_guard.py --scan-build-output

      - name: Verify Debug APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-ci-evidence-${{ github.run_number }}
          path: |
            static-analysis.log
            **/build/reports/lint-results-*
            **/build/reports/detekt/**
            **/build/reports/tests/testDebugUnitTest/**
            **/build/reports/jacoco/**
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
          retention-days: 30
