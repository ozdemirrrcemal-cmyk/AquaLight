name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle   # gradle cache (hız)

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      env:
        SKIP_JDK_VERSION_CHECK: true

    - name: Install required SDK packages
      run: |
        sdkmanager --update
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

    # Optional: temiz build tetikleyici (commit mesajında 'clean' veya 'theme' veya 'xml' geçerse çalışır)
    - name: Optional: Clean Gradle cache if requested
      if: contains(github.event.head_commit.message, 'clean') || contains(github.event.head_commit.message, 'theme') || contains(github.event.head_commit.message, 'xml')
      run: |
        echo "⚠️ Manual clean requested. Clearing Gradle caches + build outputs..."
        rm -rf ~/.gradle/caches
        rm -rf ~/.gradle/daemon
        rm -rf ~/.gradle/native
        rm -rf ~/.gradle/wrapper
        rm -rf app/build

    - name: Grant execute permission to gradlew
      run: chmod +x ./gradlew

    # Optional: küçük cleanup (fast) - tavsiye: bırakın (gradle cache var zaten)
    - name: Clean project (light)
      run: ./gradlew clean --no-daemon

    - name: Generate debug keystore (if missing)
      run: |
        mkdir -p ~/.android
        if [ ! -f ~/.android/debug.keystore ]; then
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android,O=AquaLight,C=TR"
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Verify Debug APK
      run: |
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "✅ APK bulundu"
        else
          echo "❌ APK yok"
          ls -la app/build/outputs/apk/debug || true
          exit 1
        fi

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/*.apk