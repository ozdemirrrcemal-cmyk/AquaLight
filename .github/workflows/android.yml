name: Android CI

run-name: >-
  ${{ inputs.validation_id != '' &&
      format('{0} · {1}', github.workflow, inputs.validation_id) ||
      github.workflow }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact trusted Dependabot head SHA.
        required: false
        type: string
      expected_base_sha:
        description: Exact main SHA used by Trust Refresh.
        required: false
        type: string
      dependabot_pr:
        description: Trusted Dependabot pull request number.
        required: false
        type: string
      trust_run_id:
        description: Successful Trust Refresh workflow run ID.
        required: false
        type: string
      validation_id:
        description: Unique trusted Apply-run correlation identifier.
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    if: >-
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.user.login != 'dependabot[bot]' ||
        github.event.pull_request.head.repo.full_name != github.repository ||
        github.event.pull_request.base.ref != 'main' ||
        !startsWith(github.event.pull_request.head.ref, 'dependabot/gradle/')
      )
    runs-on: ubuntu-latest

    env:
      CI: "true"
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false
      AQL_FIREBASE_DEBUG_CONFIG_BASE64: ${{ github.event_name != 'workflow_dispatch' && secrets.AQL_FIREBASE_DEBUG_CONFIG_BASE64 }}
      AQL_FIREBASE_STAGING_CONFIG_BASE64: ${{ github.event_name != 'workflow_dispatch' && secrets.AQL_FIREBASE_STAGING_CONFIG_BASE64 }}
      AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64: ${{ github.event_name != 'workflow_dispatch' && secrets.AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64 }}
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ github.event_name != 'workflow_dispatch' && secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ github.event_name != 'workflow_dispatch' && secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: Validate workflow-dispatch input shape
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          DEPENDABOT_PR: ${{ inputs.dependabot_pr }}
          TRUST_RUN_ID: ${{ inputs.trust_run_id }}
          VALIDATION_ID: ${{ inputs.validation_id }}
        run: |
          set -Eeuo pipefail
          values=(
            "$EXPECTED_SHA"
            "$EXPECTED_BASE_SHA"
            "$DEPENDABOT_PR"
            "$TRUST_RUN_ID"
            "$VALIDATION_ID"
          )
          count=0
          for value in "${values[@]}"; do
            [[ -z "$value" ]] || count=$((count + 1))
          done
          if [[ "$count" -ne 0 && "$count" -ne 5 ]]; then
            echo "Trusted Dependabot dispatch inputs must be all present or all absent." >&2
            exit 1
          fi
          if [[ "$count" -eq 0 && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Input-free manual validation is restricted to main." >&2
            exit 1
          fi

      - name: Checkout trusted dispatch control
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_base_sha }}
          persist-credentials: false

      - name: Validate trusted Dependabot dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        uses: ./.github/actions/validate-dependabot-dispatch
        with:
          expected-sha: ${{ inputs.expected_sha }}
          expected-base-sha: ${{ inputs.expected_base_sha }}
          pull-request: ${{ inputs.dependabot_pr }}
          trust-run-id: ${{ inputs.trust_run_id }}
          validation-id: ${{ inputs.validation_id }}
          github-token: ${{ github.token }}

      - name: Provision trusted Dependabot Firebase fixtures
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        uses: ./.github/actions/provision-dependabot-firebase
        with:
          trusted-dispatch: "true"
          expected-sha: ${{ inputs.expected_sha }}
          pull-request: ${{ inputs.dependabot_pr }}
          trust-run-id: ${{ inputs.trust_run_id }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Provision main-dispatch Firebase fixtures
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha == ''
        uses: ./.github/actions/provision-dependabot-firebase
        with:
          trusted-main-dispatch: "true"

      - name: Provision Dependabot Firebase fixtures
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        uses: ./.github/actions/provision-dependabot-firebase

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "15859902"
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          echo "Installed packages (first 120 lines):"
          sdkmanager --list | sed -n '1,120p' || true

      - name: Cache Gradle build-cache
        if: ${{ !contains(github.event.head_commit.message, 'clean') && !contains(github.event.head_commit.message, 'clean-cache') }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-buildcache-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run commercial policy and architecture guards
        run: |
          python3 -m unittest discover \
            -s tools/tests \
            -p 'test_*.py'
          python3 tools/verify_stage14_policy.py \
            --policy config/commercial/stage14-validation-policy.json \
            --app-gradle app/build.gradle \
            --emulator-workflow .github/workflows/android_emulator_tests.yml \
            --release-workflow .github/workflows/android_release.yml \
            --summary build/reports/stage14/policy-validation.json
          python3 tools/architecture_guard.py
          python3 tools/navigation_guard.py
          python3 tools/ws_protocol_guard.py
          python3 tools/permission_architecture_guard.py
          python3 tools/notification_reminder_architecture_guard.py
          python3 tools/process_safe_feedback_guard.py
          python3 tools/stage9_feedback_media_guard.py
          python3 tools/firebase_telemetry_guard.py
          python3 tools/privacy_legal_guard.py
          python3 tools/design_system_resource_guard.py
          python3 tools/localization_accessibility_guard.py

      - name: Force refresh dependencies (optional)
        if: contains(github.event.head_commit.message, 'refresh-deps')
        run: |
          rm -rf ~/.gradle/caches/modules-2 ~/.gradle/caches/transforms-* ~/.gradle/caches/jars-* || true
          echo "Gradle module caches cleared."

      - name: Hard clean caches and outputs (on demand)
        if: ${{ contains(github.event.head_commit.message, 'clean') || contains(github.event.head_commit.message, 'clean-cache') }}
        run: |
          echo "Hard clean requested. Purging Gradle caches and build outputs..."
          rm -rf ~/.gradle/caches ~/.gradle/daemon ~/.gradle/native ~/.gradle/wrapper || true
          rm -rf **/build build app/build || true

      - name: Clean project
        run: ./gradlew clean --no-daemon

      - name: Validate Gradle configuration model
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew help --no-daemon --stacktrace \
            2>&1 | tee firebase-gradle-configuration.log

      - name: Verify non-production Firebase inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in \
            AQL_FIREBASE_DEBUG_CONFIG_BASE64 \
            AQL_FIREBASE_STAGING_CONFIG_BASE64 \
            AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "Required non-production Firebase input is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Validate non-production Firebase configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew \
            :app:verifyFirebaseRuntimePolicy \
            :app:processDebugGoogleServices \
            :app:processStagingGoogleServices \
            :app:processReleaseSmokeGoogleServices \
            --no-daemon \
            --stacktrace \
            2>&1 | tee firebase-non-production.log

          test -s app/src/debug/google-services.json
          test -s app/src/staging/google-services.json
          test -s app/src/releaseSmoke/google-services.json
          test ! -e app/src/release/google-services.json

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -dname "CN=Android,O=AquaLight,C=TR"
          fi

      - name: Run zero-new-debt Detekt and baseline-free Android Lint
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew -PAQL_FINAL_LINT=true \
            :app:verifyDetektPolicy \
            :app:lintDebug \
            :app:lintStaging \
            --continue \
            --no-daemon \
            --stacktrace \
            2>&1 | tee android-lint.log

      - name: Verify Android Lint blocker evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/verify_android_lint.py \
            --required-variant debug \
            --required-variant staging \
            --report app/build/reports/lint-results-debug.xml \
            --report app/build/reports/lint-results-staging.xml \
            --summary build/reports/stage14/android-lint-summary.json

      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-analysis-reports-${{ github.run_number }}
          path: |
            build/reports/stage14/policy-validation.json
            build/reports/stage14/android-lint-summary.json
            firebase-gradle-configuration.log
            firebase-non-production.log
            android-lint.log
            app/build/reports/stage14/detekt-policy-summary.json
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/detekt/**
          if-no-files-found: warn

      - name: Run non-production unit tests with JaCoCo coverage
        run: |
          ./gradlew \
            :app:createDebugUnitTestCoverageReport \
            :app:testStagingUnitTest \
            --no-daemon \
            --stacktrace

      - name: Create named Stage 14 unit evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          commit="$(git rev-parse HEAD)"
          reports=(
            --report "debug=app/build/test-results/testDebugUnitTest"
            --report "staging=app/build/test-results/testStagingUnitTest"
          )
          for evidence_set in \
            accessibility-unit \
            permission-permanent-denial-unit \
            process-recreation-unit \
            rapid-account-switch-unit \
            tank-care-corruption-unit \
            websocket-account-cleanup-unit; do
            python3 tools/verify_stage14_junit_evidence.py \
              --contract config/commercial/stage14-junit-evidence-contract.json \
              --evidence-set "$evidence_set" \
              "${reports[@]}" \
              --commit "$commit" \
              --summary "build/reports/stage14/junit/${evidence_set}.json"
          done

      - name: Verify JaCoCo coverage reports
        shell: bash
        run: |
          set -Eeuo pipefail
          coverage_dir="app/build/reports/coverage/test/debug"
          required_reports=(
            "${coverage_dir}/report.xml"
            "${coverage_dir}/index.html"
          )
          for report in "${required_reports[@]}"; do
            if [[ ! -s "$report" ]]; then
              echo "Required JaCoCo coverage report is missing or empty: $report" >&2
              exit 1
            fi
          done
          if ! grep -q '<report' "${coverage_dir}/report.xml"; then
            echo "JaCoCo XML report does not contain a report element." >&2
            exit 1
          fi
          echo "JaCoCo debug unit-test coverage reports verified."

      - name: Enforce critical package coverage thresholds
        run: |
          python3 tools/verify_jacoco_coverage.py \
            --report app/build/reports/coverage/test/debug/report.xml \
            --policy config/coverage/critical-packages.json \
            --summary app/build/reports/coverage/test/debug/critical-package-thresholds.json

      - name: Upload JaCoCo coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-debug-unit-test-coverage-${{ github.run_number }}
          path: |
            app/build/reports/coverage/test/debug/
            app/build/outputs/unit_test_code_coverage/debugUnitTest/*.exec
            app/build/test-results/testDebugUnitTest/**
            app/build/test-results/testStagingUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/tests/testStagingUnitTest/**
            build/reports/stage14/junit/**
          if-no-files-found: error

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --refresh-dependencies

      - name: Verify merged manifest telemetry policy
        run: python3 tools/firebase_telemetry_guard.py --scan-build-output

      - name: Dump debugRuntimeClasspath on failure
        if: failure()
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon

      - name: Verify Debug APK
        run: |
          set -e
          ls -la app/build/outputs/apk/debug || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "Debug APK found."
          else
            echo "Debug APK missing." >&2
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

      - name: Remove generated Firebase configurations
        if: always()
        shell: bash
        run: |
          rm -f app/src/debug/google-services.json
          rm -f app/src/staging/google-services.json
          rm -f app/src/releaseSmoke/google-services.json
          rm -f app/src/release/google-services.json

  required-merge-gate:
    name: Required Merge Gate
    needs: build
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Enforce full validation ordering
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RESULT: ${{ needs.build.result }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          is_gradle_dependabot=false
          if [[ "$EVENT_NAME" == "pull_request" \
            && "$PR_AUTHOR" == "dependabot[bot]" \
            && "$PR_HEAD_REPOSITORY" == "$GITHUB_REPOSITORY" \
            && "$PR_BASE_REF" == "main" \
            && "$PR_HEAD_REF" == dependabot/gradle/* ]]; then
            is_gradle_dependabot=true
          fi

          if [[ "$is_gradle_dependabot" != "true" ]]; then
            if [[ "$BUILD_RESULT" != "success" ]]; then
              echo "Android CI build did not succeed: $BUILD_RESULT" >&2
              exit 1
            fi
            echo "Required merge gate passed with the full Android CI build."
            exit 0
          fi

          echo "Holding the initial Dependabot head until Trust Refresh creates a final head."
          deadline=$((SECONDS + 10500))
          while (( SECONDS < deadline )); do
            pull="$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}"
            )"
            state="$(jq -r '.state' <<<"$pull")"
            live_head="$(jq -r '.head.sha' <<<"$pull")"
            if [[ "$state" != "open" ]]; then
              echo "Dependabot PR closed before final-head validation." >&2
              exit 1
            fi
            if [[ "$live_head" != "$PR_HEAD_SHA" ]]; then
              echo "Initial head was superseded; final-head dispatch must satisfy this gate."
              exit 0
            fi
            sleep 30
          done
          echo "Timed out waiting for Dependabot Trust Refresh." >&2
          exit 1
