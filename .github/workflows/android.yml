name: Android CI

on:
  push:
    branches:
      - main

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Gradle için bellek ve performans ayarları
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Gradle wrapper dosyalarının güvenlik/doğrulaması
      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Install JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --update
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"
          echo "Installed packages:"
          sdkmanager --list | sed -n '1,120p' || true

      # 🧹 Manuel temizleme: commit mesajında 'clean'/'theme'/'xml' varsa
      - name: Clean Gradle cache if requested
        if: ${{ contains(github.event.head_commit.message, 'clean') || contains(github.event.head_commit.message, 'theme') || contains(github.event.head_commit.message, 'xml') }}
        run: |
          echo "⚠️ Manual clean requested. Clearing Gradle caches + build outputs..."
          rm -rf ~/.gradle/caches ~/.gradle/daemon ~/.gradle/native ~/.gradle/wrapper app/build

      # Ek Gradle cache (setup-java zaten bağımlılık cache'ini yapar; bu, build-cache'i hızlandırır)
      - name: Cache Gradle build-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-buildcache-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Clean project (light)
        run: ./gradlew clean --no-daemon

      - name: Generate debug keystore (if missing)
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -dname "CN=Android,O=AquaLight,C=TR"
          fi

      # Kalite katmanı: lint (hata olursa iş kırılır; sadece uyarılar build'i bozmaz)
      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.run_number }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore

      # Unit testler
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            **/build/test-results/testDebugUnitTest/*.xml
            **/build/reports/tests/testDebugUnitTest/*
          if-no-files-found: ignore

      # Debug APK derle
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          set -e
          echo "Looking for debug APK..."
          ls -la app/build/outputs/apk/debug || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ APK bulundu"
          else
            echo "❌ APK yok"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk