name: Android CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🧩 Checkout repository
      uses: actions/checkout@v4

    - name: ☕ Install JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: 🧰 Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: 📦 Install SDK packages
      run: |
        sdkmanager --update
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

    - name: 🔑 Generate debug keystore if missing
      run: |
        mkdir -p ~/.android
        if [ ! -f ~/.android/debug.keystore ]; then
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias AndroidDebugKey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android,O=AquaLight,C=TR"
        fi

    - name: ⚙️ Grant permission for Gradle
      run: chmod +x ./gradlew

    - name: 🧹 Clean project
      run: ./gradlew clean --no-daemon

    - name: 🚀 Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: ✅ Verify output APK
      run: |
        if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
          echo "✅ APK başarıyla oluşturuldu!"
        else
          echo "❌ APK bulunamadı!"
          exit 1
        fi

    - name: 📤 Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: AquaLight-debug
        path: app/build/outputs/apk/debug/*.apk
