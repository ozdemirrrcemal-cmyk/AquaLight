name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "app/**"
      - "protocol/**"
      - "tools/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Correct pending migration transforms
        if: ${{ github.event_name == 'pull_request' && hashFiles('tools/stage11_apply_locale_migration.py') != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/stage11_apply_locale_migration.py")
          source = path.read_text(encoding="utf-8")

          old_feedback = '    ensure_import(relative, "import com.aqua.aqualight.localization.LocaleFormatters\\n")\n    replace_exact(\n        relative,\n        "private val localeTagProvider:'
          new_feedback = '    ensure_import(\n        relative,\n        "import com.aqua.aqualight.localization.LocaleFormatters\\n",\n        anchor="import com.aqua.aqualight.BuildConfig\\n"\n    )\n    replace_exact(\n        relative,\n        "private val localeTagProvider:'
          if source.count(old_feedback) != 1:
              raise SystemExit("Feedback migration transform anchor mismatch")
          source = source.replace(old_feedback, new_feedback, 1)

          old_template = '''      return LocaleFormatters.formatTemplate(\\n"
        "        locale = locale,\\n"
        "        template = pageFormat,\\n"
        "        pageNumber\\n"
        "      )\\n",'''
          new_template = '''      return LocaleFormatters.formatTemplate(\\n"
        "        locale,\\n"
        "        pageFormat,\\n"
        "        pageNumber\\n"
        "      )\\n",'''
          if source.count(old_template) != 1:
              raise SystemExit("PDF template migration transform mismatch")
          source = source.replace(old_template, new_template, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Apply pending atomic locale migration
        id: locale_migration
        if: ${{ github.event_name == 'pull_request' && hashFiles('tools/stage11_apply_locale_migration.py') != '' }}
        shell: bash
        run: |
          set -o pipefail
          python3 tools/stage11_apply_locale_migration.py 2>&1 | tee stage11-migration.log
          rm -f tools/stage11_apply_locale_migration.py
          rm -f .github/workflows/stage11_apply_locale_migration.yml
          rm -f .github/workflows/stage11_patch_locale_migration.yml

      - name: Commit verified locale migration
        if: ${{ steps.locale_migration.outcome == 'success' }}
        shell: bash
        run: |
          git config user.name "AquaLight Stage 11 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "feat: migrate user-facing formatting to application locale"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --update
          sdkmanager "platform-tools" "platforms;android-36" "cmdline-tools;latest"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1" || true
          echo "Installed packages (first 120 lines):"
          sdkmanager --list | sed -n '1,120p' || true

      - name: Cache Gradle build-cache
        if: ${{ !contains(github.event.head_commit.message, 'clean') && !contains(github.event.head_commit.message, 'clean-cache') }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-buildcache-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run Architecture Guard
        run: |
          python3 tools/architecture_guard.py
          python3 tools/navigation_guard.py
          python3 tools/ws_protocol_guard.py
          python3 tools/permission_architecture_guard.py
          python3 tools/notification_reminder_architecture_guard.py
          python3 tools/process_safe_feedback_guard.py
          python3 tools/stage9_feedback_media_guard.py
          python3 tools/design_system_resource_guard.py
          python3 tools/localization_placeholder_guard.py
          python3 tools/stage11_visual_diff_guard.py
          python3 tools/accessibility_semantics_guard.py
          python3 tools/ui_locale_boundary_guard.py

      - name: 🔄 Force refresh dependencies (optional)
        if: contains(github.event.head_commit.message, 'refresh-deps')
        run: |
          rm -rf ~/.gradle/caches/modules-2 ~/.gradle/caches/transforms-* ~/.gradle/caches/jars-* || true
          echo "Gradle module caches cleared."

      - name: 🧹 Hard clean caches & outputs (on demand)
        if: ${{ contains(github.event.head_commit.message, 'clean') || contains(github.event.head_commit.message, 'clean-cache') }}
        run: |
          echo "💥 Hard clean requested. Purging Gradle caches and build outputs..."
          rm -rf ~/.gradle/caches ~/.gradle/daemon ~/.gradle/native ~/.gradle/wrapper || true
          rm -rf **/build build app/build || true

      - name: Clean project (light)
        run: ./gradlew clean --no-daemon

      - name: Generate debug keystore (if missing)
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -dname "CN=Android,O=AquaLight,C=TR"
          fi

      - name: Run Android Lint
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-debug.log

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports-${{ github.run_number }}
          path: |
            stage11-migration.log
            lint-debug.log
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --refresh-dependencies

      - name: 📋 Dump debugRuntimeClasspath (on failure)
        if: failure()
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon

      - name: Verify Debug APK
        run: |
          set -e
          ls -la app/build/outputs/apk/debug || true
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "✅ APK bulundu"
          else
            echo "❌ APK yok"
            exit 1
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk
