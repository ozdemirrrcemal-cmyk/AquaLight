name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".editorconfig"
      - "app/**"
      - "protocol/**"
      - "tools/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle"
      - "build.gradle"
      - ".github/workflows/**"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmdline-tools;latest"

      - name: Cache Gradle build-cache
        if: ${{ !contains(github.event.head_commit.message, 'clean') && !contains(github.event.head_commit.message, 'clean-cache') }}
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-buildcache-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run release-governance unit tests
        run: >-
          python3 -m unittest
          tools.release_metadata_test
          tools.github_actions_pin_guard_test

      - name: Run architecture and supply-chain guards
        run: |
          python3 tools/github_actions_pin_guard.py
          python3 tools/architecture_guard.py
          python3 tools/navigation_guard.py
          python3 tools/ws_protocol_guard.py
          python3 tools/permission_architecture_guard.py
          python3 tools/notification_reminder_architecture_guard.py
          python3 tools/process_safe_feedback_guard.py
          python3 tools/stage9_feedback_media_guard.py
          python3 tools/firebase_telemetry_guard.py
          python3 tools/privacy_legal_guard.py
          python3 tools/design_system_resource_guard.py
          python3 tools/localization_accessibility_guard.py

      - name: Force refresh dependencies (optional)
        if: contains(github.event.head_commit.message, 'refresh-deps')
        run: |
          rm -rf ~/.gradle/caches/modules-2 ~/.gradle/caches/transforms-* ~/.gradle/caches/jars-* || true
          echo "Gradle module caches cleared."

      - name: Hard clean caches and outputs (on demand)
        if: ${{ contains(github.event.head_commit.message, 'clean') || contains(github.event.head_commit.message, 'clean-cache') }}
        run: |
          echo "Hard clean requested. Purging Gradle caches and build outputs."
          rm -rf ~/.gradle/caches ~/.gradle/daemon ~/.gradle/native ~/.gradle/wrapper || true
          rm -rf **/build build app/build || true

      - name: Clean project
        run: ./gradlew clean --no-daemon

      - name: Verify resolved Firebase runtime policy
        run: ./gradlew :app:verifyFirebaseRuntimePolicy --no-daemon --stacktrace

      - name: Generate debug keystore if missing
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -dname "CN=Android,O=AquaLight,C=TR"
          fi

      - name: Run full Android lint
        run: |
          set -o pipefail
          ./gradlew lintDebug --no-daemon --stacktrace 2>&1 | tee lint-debug.log

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-reports-${{ github.run_number }}
          path: |
            lint-debug.log
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
          if-no-files-found: ignore

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify merged manifest telemetry policy
        run: python3 tools/firebase_telemetry_guard.py --scan-build-output

      - name: Dump debugRuntimeClasspath on failure
        if: failure()
        run: ./gradlew :app:dependencies --configuration debugRuntimeClasspath --no-daemon

      - name: Verify Debug APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: app-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/*.apk

  quality-measurement:
    name: Ktlint and coverage baseline
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install JDK 17
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "cmdline-tools;latest"

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Generate brownfield ktlint baseline
        run: ./gradlew :app:ktlintGenerateBaseline --no-daemon --stacktrace

      - name: Run unit tests and generate coverage reports
        run: >-
          ./gradlew
          :app:koverXmlReportDebug
          :app:koverHtmlReportDebug
          :app:koverLogDebug
          --no-daemon
          --stacktrace

      - name: Upload quality measurement evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-measurement-${{ github.run_number }}
          path: |
            app/ktlint-baseline.xml
            app/build/reports/ktlint/**
            app/build/reports/kover/**
            app/build/test-results/testDebugUnitTest/**
          if-no-files-found: warn
