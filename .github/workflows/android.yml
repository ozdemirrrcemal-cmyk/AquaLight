name: Android Commercial CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "app/**"
      - "protocol/**"
      - "tools/**"
      - "config/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/actions/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/android_instrumentation.yml"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: android-commercial-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
    -Dorg.gradle.daemon=false

jobs:
  guard:
    name: 1 · Guard
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Android toolchain
        uses: ./.github/actions/android-setup

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Validate release tooling and immutable Action refs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/tests/test_release_version.py
          python3 tools/tests/test_configure_firebase.py
          python3 tools/verify_action_pins.py

      - name: Validate source-controlled Firebase environment fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/configure_firebase.py validate \
            --environment debug \
            --package com.aqua.aqualight.debug \
            --input app/src/debug/google-services.json
          python3 tools/configure_firebase.py validate \
            --environment staging \
            --package com.aqua.aqualight.staging \
            --input app/src/staging/google-services.json
          python3 tools/configure_firebase.py validate \
            --environment releaseSmoke \
            --package com.aqua.aqualight \
            --input app/src/releaseSmoke/google-services.json

      - name: Run architecture and policy guards
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          bash tools/run_architecture_guards.sh 2>&1 | tee architecture-guards.log

      - name: Upload guard diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: architecture-guards-${{ github.run_number }}
          path: architecture-guards.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify resolved Firebase runtime policy
        run: ./gradlew :app:verifyFirebaseRuntimePolicy --no-daemon --stacktrace

  lint:
    name: 2 · Lint and static analysis
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Android toolchain
        uses: ./.github/actions/android-setup

      - name: Run full Android lint and Detekt
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          ./gradlew :app:lintDebug :app:lintStaging :app:detekt \
            --no-daemon --stacktrace 2>&1 | tee static-analysis.log

      - name: Upload static-analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-analysis-${{ github.run_number }}
          path: |
            static-analysis.log
            app/build/reports/lint-results-*
            app/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 14

  unit_test:
    name: 3 · Unit tests and coverage
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Android toolchain
        uses: ./.github/actions/android-setup

      - name: Run unit tests, coverage report, and critical-package gates
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          ./gradlew \
            :app:testDebugUnitTest \
            :app:jacocoDebugUnitTestReport \
            :app:jacocoCriticalCoverageVerification \
            --no-daemon --stacktrace 2>&1 | tee unit-test-coverage.log

      - name: Upload unit-test and coverage reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-coverage-${{ github.run_number }}
          path: |
            unit-test-coverage.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/jacoco/jacocoDebugUnitTestReport/**
          if-no-files-found: ignore
          retention-days: 14

  instrumentation:
    name: 4 · Instrumentation
    needs: unit_test
    uses: ./.github/workflows/android_instrumentation.yml
    with:
      ref: ${{ github.sha }}

  build:
    name: 5 · Non-production build
    needs: instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Android toolchain
        uses: ./.github/actions/android-setup

      - name: Build isolated debug and staging APKs
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          ./gradlew :app:assembleDebug :app:assembleStaging \
            --no-daemon --stacktrace 2>&1 | tee non-production-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk
          find app/build/outputs/apk/staging -type f -name '*.apk' -size +0 -print -quit | grep -q .

      - name: Verify merged-manifest telemetry policy
        run: python3 tools/firebase_telemetry_guard.py --scan-build-output

      - name: Upload non-production APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: non-production-apks-${{ github.run_number }}
          path: |
            non-production-build.log
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/staging/*.apk
          if-no-files-found: error
          retention-days: 7
