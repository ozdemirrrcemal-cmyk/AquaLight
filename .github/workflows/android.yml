name: Android Commercial CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - app/**
      - protocol/**
      - tools/**
      - config/**
      - gradle/**
      - gradlew
      - gradle.properties
      - settings.gradle
      - build.gradle
      - .github/workflows/**
      - .github/dependabot.yml

concurrency:
  group: android-commercial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    name: 1 · Architecture and supply-chain guard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run commercial guards
        run: bash tools/run_commercial_guards.sh

  lint:
    name: 2 · Android lint and Detekt
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FIREBASE_DEVELOPMENT_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_DEVELOPMENT_GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare development Firebase configuration
        run: python3 tools/ci/materialize_firebase_config.py --environment development --allow-ci-fixture
      - name: Run standard Android lint and Detekt
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew lintDevelopmentDebug detektDevelopmentDebug --no-daemon --stacktrace \
            2>&1 | tee lint-and-detekt.log
      - name: Upload lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lint-detekt-${{ github.run_id }}
          path: |
            lint-and-detekt.log
            **/build/reports/lint-results-*
            **/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove generated Firebase configuration
        if: always()
        run: rm -f app/src/development/google-services.json

  unit-test:
    name: 3 · Unit tests and critical coverage
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      FIREBASE_DEVELOPMENT_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_DEVELOPMENT_GOOGLE_SERVICES_JSON_BASE64 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare development Firebase configuration
        run: python3 tools/ci/materialize_firebase_config.py --environment development --allow-ci-fixture
      - name: Run unit tests, Firebase dependency policy, and coverage gate
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew \
            :app:verifyFirebaseRuntimePolicy \
            testDevelopmentDebugUnitTest \
            jacocoCriticalCoverageReport \
            jacocoCriticalCoverageVerification \
            --no-daemon --stacktrace 2>&1 | tee unit-and-coverage.log
      - name: Upload test and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-coverage-${{ github.run_id }}
          path: |
            unit-and-coverage.log
            app/build/reports/tests/testDevelopmentDebugUnitTest/**
            app/build/reports/jacoco/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove generated Firebase configuration
        if: always()
        run: rm -f app/src/development/google-services.json

  instrumentation:
    name: 4 · Instrumentation matrix
    needs: unit-test
    uses: ./.github/workflows/android_instrumentation.yml

  release-validation:
    name: 5 · Minified staging release build
    needs: instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      FIREBASE_STAGING_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_STAGING_GOOGLE_SERVICES_JSON_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: aqualight-ci
      RELEASE_KEY_ALIAS: aqualight-ci
      RELEASE_KEY_PASSWORD: aqualight-ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare staging Firebase configuration
        run: python3 tools/ci/materialize_firebase_config.py --environment staging --allow-ci-fixture
      - name: Generate ephemeral staging signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/aqualight-ci.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            -keypass "$RELEASE_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=AquaLight CI,O=AquaLight,C=TR"
          chmod 600 "$KEYSTORE"
          printf 'AQL_RELEASE_KEYSTORE_PATH=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"
      - name: Build and inspect minified staging release
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleStagingRelease --no-daemon --stacktrace \
            2>&1 | tee staging-release.log
          test -n "$(find app/build/outputs/apk/staging/release -type f -name '*.apk' -size +0c -print -quit)"
          test -s app/build/outputs/mapping/stagingRelease/mapping.txt
          python3 tools/firebase_telemetry_guard.py --scan-build-output
      - name: Upload staging release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-release-${{ github.run_id }}
          path: |
            staging-release.log
            app/build/outputs/apk/staging/release/*.apk
            app/build/outputs/mapping/stagingRelease/mapping.txt
          if-no-files-found: error
          retention-days: 7
      - name: Remove ephemeral files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/aqualight-ci.jks"
          rm -f app/src/staging/google-services.json
