name: Dependency Integrity

on:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "tools/verify_dependency_integrity.py"
      - ".github/workflows/dependency_integrity.yml"
  pull_request:
    paths:
      - "app/build.gradle"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "tools/verify_dependency_integrity.py"
      - ".github/workflows/dependency_integrity.yml"

concurrency:
  group: dependency-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "cmdline-tools;latest"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1" || true

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -dname "CN=Android,O=AquaLight,C=TR"
          fi

      - name: Verify strict dependency locks and checksums
        env:
          CI: true
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s app/gradle.lockfile
          test -s gradle/verification-metadata.xml

          ./gradlew \
            :app:dependencies \
            :app:createDebugUnitTestCoverageReport \
            :app:assembleDebug \
            :app:lintDebug \
            --dependency-verification=strict \
            --no-daemon \
            --stacktrace \
            2>&1 | tee dependency-integrity.log

          python3 tools/verify_dependency_integrity.py \
            --lockfile app/gradle.lockfile \
            --metadata gradle/verification-metadata.xml \
            --summary build/reports/dependency-integrity-summary.json

          git diff --exit-code -- \
            app/gradle.lockfile \
            gradle/verification-metadata.xml

      - name: Upload dependency integrity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-integrity-${{ github.run_number }}
          path: |
            dependency-integrity.log
            build/reports/dependency-integrity-summary.json
            build/reports/dependency-verification/
          if-no-files-found: warn
