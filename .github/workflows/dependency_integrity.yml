name: Dependency Integrity

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/build.gradle"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "tools/verify_dependency_integrity.py"
      - ".github/workflows/dependency_integrity.yml"
  pull_request:
    paths:
      - "app/build.gradle"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "tools/verify_dependency_integrity.py"
      - ".github/workflows/dependency_integrity.yml"

concurrency:
  group: dependency-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CI: "true"
      AQL_FIREBASE_DEBUG_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_DEBUG_CONFIG_BASE64 }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify Node 24 action pins
        run: python3 tools/node24_action_guard.py

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "15859902"

      - name: Install compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Verify debug Firebase input
        shell: bash
        run: |
          set -Eeuo pipefail
          value="${AQL_FIREBASE_DEBUG_CONFIG_BASE64:-}"
          if [[ -z "${value//[[:space:]]/}" ]]; then
            echo "Required dependency-validation Firebase input is missing: AQL_FIREBASE_DEBUG_CONFIG_BASE64" >&2
            exit 1
          fi

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -dname "CN=Android,O=AquaLight,C=TR"
          fi

      - name: Verify strict dependency locks and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s app/gradle.lockfile
          test -s gradle/verification-metadata.xml

          ./gradlew \
            :app:dependencies \
            :app:createDebugUnitTestCoverageReport \
            :app:assembleDebug \
            :app:lintDebug \
            --dependency-verification=strict \
            --no-daemon \
            --stacktrace \
            2>&1 | tee dependency-integrity.log

          python3 tools/verify_dependency_integrity.py \
            --lockfile app/gradle.lockfile \
            --metadata gradle/verification-metadata.xml \
            --summary build/reports/dependency-integrity-summary.json

          git diff --exit-code -- \
            app/gradle.lockfile \
            gradle/verification-metadata.xml

      - name: Upload dependency integrity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-integrity-${{ github.run_number }}
          path: |
            dependency-integrity.log
            build/reports/dependency-integrity-summary.json
            build/reports/dependency-verification/
            app/build/reports/stage14/detekt-policy-summary.json
            app/build/reports/detekt/**
            app/build/reports/lint-results-detekt*.xml
          if-no-files-found: warn

      - name: Remove generated Firebase configuration
        if: always()
        run: rm -f app/src/debug/google-services.json
