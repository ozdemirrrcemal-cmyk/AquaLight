name: Dependency Integrity

run-name: >-
  ${{ inputs.validation_id != '' &&
      format('{0} · {1}', github.workflow, inputs.validation_id) ||
      github.workflow }}

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact trusted Dependabot head SHA.
        required: false
        type: string
      expected_base_sha:
        description: Exact main SHA used by Trust Refresh.
        required: false
        type: string
      dependabot_pr:
        description: Trusted Dependabot pull request number.
        required: false
        type: string
      trust_run_id:
        description: Successful Trust Refresh workflow run ID.
        required: false
        type: string
      validation_id:
        description: Unique trusted Apply-run correlation identifier.
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "app/build.gradle"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "tools/verify_dependency_integrity.py"
      - "tools/classify_dependabot_gradle_pr.py"
      - "tools/create_dependabot_trust_metadata.py"
      - "tools/tests/test_classify_dependabot_gradle_pr.py"
      - "tools/tests/test_create_dependabot_trust_metadata.py"
      - "tools/tests/test_validate_dependabot_dispatch.py"
      - "tools/tests/test_verify_dependency_integrity.py"
      - "config/dependency-integrity/**"
      - "config/dependabot/**"
      - ".github/actions/provision-dependabot-firebase/**"
      - ".github/actions/validate-dependabot-dispatch/**"
      - ".github/workflows/apply_dependabot_gradle_trust_refresh.yml"
      - ".github/workflows/dependabot_gradle_trust_refresh.yml"
      - ".github/workflows/dependency_integrity.yml"
  pull_request:

concurrency:
  group: dependency-integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.user.login != 'dependabot[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      github.event.pull_request.base.ref != 'main' ||
      !startsWith(github.event.pull_request.head.ref, 'dependabot/gradle/')
    runs-on: ubuntu-latest
    env:
      CI: "true"
      AQL_FIREBASE_DEBUG_CONFIG_BASE64: ${{ github.event_name != 'workflow_dispatch' && secrets.AQL_FIREBASE_DEBUG_CONFIG_BASE64 }}

    steps:
      - name: Validate workflow-dispatch input shape
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          EXPECTED_BASE_SHA: ${{ inputs.expected_base_sha }}
          DEPENDABOT_PR: ${{ inputs.dependabot_pr }}
          TRUST_RUN_ID: ${{ inputs.trust_run_id }}
          VALIDATION_ID: ${{ inputs.validation_id }}
        run: |
          set -Eeuo pipefail
          values=(
            "$EXPECTED_SHA"
            "$EXPECTED_BASE_SHA"
            "$DEPENDABOT_PR"
            "$TRUST_RUN_ID"
            "$VALIDATION_ID"
          )
          count=0
          for value in "${values[@]}"; do
            [[ -z "$value" ]] || count=$((count + 1))
          done
          if [[ "$count" -ne 0 && "$count" -ne 5 ]]; then
            echo "Trusted Dependabot dispatch inputs must be all present or all absent." >&2
            exit 1
          fi
          if [[ "$count" -eq 0 && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Input-free manual validation is restricted to main." >&2
            exit 1
          fi

      - name: Checkout trusted dispatch control
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_base_sha }}
          persist-credentials: false

      - name: Validate trusted Dependabot dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        uses: ./.github/actions/validate-dependabot-dispatch
        with:
          expected-sha: ${{ inputs.expected_sha }}
          expected-base-sha: ${{ inputs.expected_base_sha }}
          pull-request: ${{ inputs.dependabot_pr }}
          trust-run-id: ${{ inputs.trust_run_id }}
          validation-id: ${{ inputs.validation_id }}
          github-token: ${{ github.token }}

      - name: Provision trusted Dependabot Firebase fixtures
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        uses: ./.github/actions/provision-dependabot-firebase
        with:
          trusted-dispatch: "true"
          expected-sha: ${{ inputs.expected_sha }}
          pull-request: ${{ inputs.dependabot_pr }}
          trust-run-id: ${{ inputs.trust_run_id }}

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.expected_sha || github.sha }}
          persist-credentials: false

      - name: Provision main-dispatch Firebase fixtures
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha == ''
        uses: ./.github/actions/provision-dependabot-firebase
        with:
          trusted-main-dispatch: "true"

      - name: Provision Dependabot Firebase fixtures
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login == 'dependabot[bot]'
        uses: ./.github/actions/provision-dependabot-firebase

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "15859902"

      - name: Install compile SDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Verify debug Firebase input
        shell: bash
        run: |
          set -Eeuo pipefail
          value="${AQL_FIREBASE_DEBUG_CONFIG_BASE64:-}"
          if [[ -z "${value//[[:space:]]/}" ]]; then
            echo "Required dependency-validation Firebase input is missing: AQL_FIREBASE_DEBUG_CONFIG_BASE64" >&2
            exit 1
          fi

      - name: Generate debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -s ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -dname "CN=Android,O=AquaLight,C=TR"
          fi

      - name: Verify strict dependency locks and checksums
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s app/gradle.lockfile
          test -s gradle/verification-metadata.xml

          ./gradlew \
            :app:dependencies \
            :app:createDebugUnitTestCoverageReport \
            :app:assembleDebug \
            :app:lintDebug \
            --dependency-verification=strict \
            --no-daemon \
            --stacktrace \
            2>&1 | tee dependency-integrity.log

          python3 tools/verify_dependency_integrity.py \
            --settings settings.gradle \
            --build-tools-manifest config/dependency-integrity/resolved-build-tools.json \
            --lockfile app/gradle.lockfile \
            --metadata gradle/verification-metadata.xml \
            --summary build/reports/dependency-integrity-summary.json

          git diff --exit-code -- \
            app/gradle.lockfile \
            gradle/verification-metadata.xml

      - name: Upload dependency integrity report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-integrity-${{ github.run_number }}
          path: |
            dependency-integrity.log
            build/reports/dependency-integrity-summary.json
            build/reports/dependency-verification/
            app/build/reports/stage14/detekt-policy-summary.json
            app/build/reports/detekt/**
            app/build/reports/lint-results-detekt*.xml
          if-no-files-found: warn

      - name: Remove generated Firebase configuration
        if: always()
        run: rm -f app/src/debug/google-services.json
