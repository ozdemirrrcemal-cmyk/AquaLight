name: Stage 10 Design System

on:
  push:
    branches:
      - agent/stage-10-design-system-resource-cleanup
    paths:
      - "app/src/main/**"
      - "tools/stage10_design_system_guard.py"
      - "docs/stage10-design-system-contract.md"
      - ".github/workflows/stage10_design_system.yml"
  pull_request:
    paths:
      - "app/src/main/**"
      - "tools/stage10_design_system_guard.py"
      - "docs/stage10-design-system-contract.md"
      - ".github/workflows/stage10_design_system.yml"

permissions:
  contents: read

concurrency:
  group: stage10-design-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Run Stage 10 resource guard
        run: python3 tools/stage10_design_system_guard.py

      - name: Run Android lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage10-reports-${{ github.run_number }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            **/build/reports/tests/**
          if-no-files-found: ignore
