name: Temporary Runtime Trust Patch

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/temporary_runtime_trust_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/android-typed-device-metadata
          fetch-depth: 0
      - name: Apply scoped runtime trust fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(text.replace(old, new), encoding="utf-8")

          runtime = "app/src/main/java/com/aqua/aqualight/data/devices/repository/DeviceRuntimeRepository.kt"
          replace_once(
              runtime,
              '''            if (!RuntimeConnectionReusePolicy.shouldReconnect(currentState, deviceUid, endpointMatches)) {
                  return@synchronized Result.success(Unit)
              }
''',
              '''            if (!RuntimeConnectionReusePolicy.shouldReconnect(currentState, deviceUid, endpointMatches)) {
                  return@synchronized ensureCurrentMetadataBootstrap(
                      session = session,
                      snapshot = snapshot,
                      connectionState = currentState
                  )
              }
'''
          )
          replace_once(
              runtime,
              '''    fun currentConnectionState(deviceUid: DeviceUid): AqlWsConnectionState? =
          sessions[deviceUid]?.wsClient?.connectionState?.value

      internal fun processMetadataResponse(
''',
              '''    fun currentConnectionState(deviceUid: DeviceUid): AqlWsConnectionState? =
          sessions[deviceUid]?.wsClient?.connectionState?.value

      internal fun isCurrentValidatedMetadata(snapshot: DeviceSnapshot): Boolean {
          val ready = metadataBootstrapCoordinator.currentState(snapshot.deviceUid) as?
              DeviceRuntimeMetadataGenerationState.Ready
          return snapshot.hasValidatedRuntimeMetadata &&
              ready?.generation?.value == snapshot.runtimeMetadataGeneration
      }

      internal fun processMetadataResponse(
'''
          )
          replace_once(
              runtime,
              '''    fun disconnectForLocalNetworkLoss() {
''',
              '''    private fun ensureCurrentMetadataBootstrap(
          session: RuntimeSession,
          snapshot: DeviceSnapshot,
          connectionState: AqlWsConnectionState
      ): Result<Unit> {
          val metadataState = metadataBootstrapCoordinator.currentState(snapshot.deviceUid)
          return when {
              isCurrentValidatedMetadata(snapshot) -> Result.success(Unit)
              metadataState is DeviceRuntimeMetadataGenerationState.Collecting -> Result.success(Unit)
              connectionState !is AqlWsConnectionState.Authenticated -> Result.success(Unit)
              sendAuthenticatedBootstrap(session) -> Result.success(Unit)
              else -> Result.failure(
                  IllegalStateException("Authenticated metadata bootstrap could not be restarted.")
              )
          }
      }

      fun disconnectForLocalNetworkLoss() {
'''
          )

          devices = "app/src/main/java/com/aqua/aqualight/data/devices/repository/DevicesRepository.kt"
          replace_once(
              devices,
              '''    suspend fun commitProvisioningSnapshot(snapshot: DeviceSnapshot): DeviceSnapshot =
          persistThenRegister(snapshot)

      suspend fun registerSnapshot(snapshot: DeviceSnapshot): DeviceSnapshot =
          persistThenRegister(snapshot)
''',
              '''    suspend fun commitProvisioningSnapshot(snapshot: DeviceSnapshot): DeviceSnapshot =
          persistThenRegister(snapshot, preserveCurrentRuntimeTrust = true)

      suspend fun registerSnapshot(snapshot: DeviceSnapshot): DeviceSnapshot =
          persistThenRegister(snapshot, preserveCurrentRuntimeTrust = false)
'''
          )
          replace_once(
              devices,
              '''    private suspend fun persistThenRegister(snapshot: DeviceSnapshot): DeviceSnapshot {
          val merged = DeviceSnapshotMerger.merge(
              previous = registryStore.currentDevice(snapshot.deviceUid),
              incoming = snapshot
          )
          runtimeRepository?.activate(merged.deviceUid)
          knownStore?.saveSnapshot(merged)
          val registered = registerUntrustedSnapshot(merged)
          if (registered.endpoint.hasWebSocketEndpoint) runtimeRepository?.connect(registered)
          return registered
      }
''',
              '''    private suspend fun persistThenRegister(
          snapshot: DeviceSnapshot,
          preserveCurrentRuntimeTrust: Boolean
      ): DeviceSnapshot {
          val merged = DeviceSnapshotMerger.merge(
              previous = registryStore.currentDevice(snapshot.deviceUid),
              incoming = snapshot
          )
          runtimeRepository?.activate(merged.deviceUid)
          knownStore?.saveSnapshot(merged)
          val preserveTrust = preserveCurrentRuntimeTrust &&
              runtimeRepository?.isCurrentValidatedMetadata(merged) == true
          val registered = if (preserveTrust) {
              registryStore.updateSnapshot(merged.deviceUid) { merged }
                  ?: registryStore.upsert(merged)
          } else {
              registerUntrustedSnapshot(merged)
          }
          if (registered.endpoint.hasWebSocketEndpoint) runtimeRepository?.connect(registered)
          return registered
      }
'''
          )

          handoff = "app/src/main/java/com/aqua/aqualight/data/devices/provisioning/repository/AqlProvisioningHandoffSaver.kt"
          replace_once(
              handoff,
              '''                repository.stageProvisioningSnapshot(
                      DeviceSnapshotMerger.merge(
                          previous = previousSnapshot,
                          incoming = resolved
                      )
                  )
''',
              '''                resolved
'''
          )

          live_test = "app/src/test/java/com/aqua/aqualight/data/devices/repository/DeviceRuntimeMetadataLivePipelineTest.kt"
          replace_once(
              live_test,
              '''import com.aqua.aqualight.data.devices.runtime.ws.AqlWsTransport
  import com.aqua.aqualight.data.devices.toDeviceRootSnapshot
''',
              '''import com.aqua.aqualight.data.devices.runtime.ws.AqlWsTransport
  import com.aqua.aqualight.data.devices.store.DeviceRegistryStore
  import com.aqua.aqualight.data.devices.toDeviceRootSnapshot
'''
          )
          replace_once(
              live_test,
              '''import kotlinx.coroutines.flow.asStateFlow
  import org.json.JSONArray
''',
              '''import kotlinx.coroutines.flow.asStateFlow
  import kotlinx.coroutines.runBlocking
  import org.json.JSONArray
'''
          )
          replace_once(
              live_test,
              '''        assertFalse(DeviceRootRoute.TIMER_CHANNELS in root.allowedRoutes)
          assertFalse(DeviceRootRoute.TIMER_SCHEDULES in root.allowedRoutes)
          repository.close()
''',
              '''        assertFalse(DeviceRootRoute.TIMER_CHANNELS in root.allowedRoutes)
          assertFalse(DeviceRootRoute.TIMER_SCHEDULES in root.allowedRoutes)
          assertTrue(repository.isCurrentValidatedMetadata(projected))
          assertFalse(
              repository.isCurrentValidatedMetadata(
                  projected.copy(runtimeMetadataGeneration = 0L)
              )
          )

          val registry = DeviceRegistryStore().apply { upsert(projected) }
          val devicesRepository = DevicesRepository(
              registryStore = registry,
              runtimeRepository = repository
          )
          val committed = runBlocking {
              devicesRepository.commitProvisioningSnapshot(projected)
          }
          assertTrue(committed.hasValidatedRuntimeMetadata)
          assertEquals(
              projected.runtimeMetadataGeneration,
              committed.runtimeMetadataGeneration
          )
          repository.close()
'''
          )

          reconnect_test = Path(
              "app/src/test/java/com/aqua/aqualight/data/devices/repository/" \
              "DeviceRuntimeMetadataReconnectBootstrapTest.kt"
          )
          if reconnect_test.exists():
              raise SystemExit(f"{reconnect_test}: already exists")
          reconnect_test.write_text(
              '''package com.aqua.aqualight.data.devices.repository

  import com.aqua.aqualight.data.devices.model.DeviceIdentity
  import com.aqua.aqualight.data.devices.model.DeviceProduct
  import com.aqua.aqualight.data.devices.model.DeviceRuntimeEndpoint
  import com.aqua.aqualight.data.devices.model.DeviceSnapshot
  import com.aqua.aqualight.data.devices.model.DeviceUid
  import com.aqua.aqualight.data.devices.runtime.ws.AqlWsConnectionState
  import com.aqua.aqualight.data.devices.runtime.ws.AqlWsEvent
  import com.aqua.aqualight.data.devices.runtime.ws.AqlWsOutgoingMessage
  import com.aqua.aqualight.data.devices.runtime.ws.AqlWsTransport
  import java.util.concurrent.CopyOnWriteArrayList
  import kotlinx.coroutines.Dispatchers
  import kotlinx.coroutines.flow.MutableSharedFlow
  import kotlinx.coroutines.flow.MutableStateFlow
  import kotlinx.coroutines.flow.SharedFlow
  import kotlinx.coroutines.flow.StateFlow
  import kotlinx.coroutines.flow.asSharedFlow
  import kotlinx.coroutines.flow.asStateFlow
  import org.junit.Assert.assertEquals
  import org.junit.Test

  class DeviceRuntimeMetadataReconnectBootstrapTest {

      @Test
      fun `authenticated reused socket starts one bootstrap for an untrusted snapshot`() {
          val transport = AuthenticatedWsTransport()
          val repository = DeviceRuntimeRepository(
              wsClientFactory = { transport },
              dispatcher = Dispatchers.Unconfined
          )
          val snapshot = DeviceSnapshot(
              identity = DeviceIdentity(uid = DEVICE_UID),
              product = DeviceProduct(),
              endpoint = DeviceRuntimeEndpoint(ip = "192.168.1.20", wsPort = 80)
          )

          repository.connect(snapshot).getOrThrow()
          repository.connect(snapshot).getOrThrow()
          assertEquals(EXPECTED_BOOTSTRAP_COMMAND_COUNT, transport.commands.size)

          repository.connect(snapshot).getOrThrow()
          assertEquals(EXPECTED_BOOTSTRAP_COMMAND_COUNT, transport.commands.size)
          repository.close()
      }

      private class AuthenticatedWsTransport : AqlWsTransport {
          private val _connectionState = MutableStateFlow<AqlWsConnectionState>(
              AqlWsConnectionState.Disconnected
          )
          override val connectionState: StateFlow<AqlWsConnectionState> =
              _connectionState.asStateFlow()

          private val _events = MutableSharedFlow<AqlWsEvent>(extraBufferCapacity = 1)
          override val events: SharedFlow<AqlWsEvent> = _events.asSharedFlow()

          val commands = CopyOnWriteArrayList<AqlWsOutgoingMessage.Command>()

          override fun connect(
              deviceUid: DeviceUid,
              endpoint: DeviceRuntimeEndpoint
          ): Result<Unit> {
              _connectionState.value = AqlWsConnectionState.Authenticated(
                  deviceUid = deviceUid,
                  authenticatedAtMillis = 1L
              )
              return Result.success(Unit)
          }

          override fun send(message: AqlWsOutgoingMessage): Boolean {
              val command = message as? AqlWsOutgoingMessage.Command ?: return false
              commands += command
              return true
          }

          override fun disconnect(code: Int, reason: String) {
              _connectionState.value = AqlWsConnectionState.Disconnected
          }

          override fun close() {
              _connectionState.value = AqlWsConnectionState.Disconnected
          }
      }

      private companion object {
          val DEVICE_UID = DeviceUid("AQL-RUNTIME-TRUST")
          const val EXPECTED_BOOTSTRAP_COMMAND_COUNT = 3
      }
  }
  ''',
              encoding="utf-8"
          )
          PY
      - name: Verify patch shape
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git diff --name-only
      - name: Commit scoped patch
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/src/main/java/com/aqua/aqualight/data/devices/repository/DeviceRuntimeRepository.kt \
            app/src/main/java/com/aqua/aqualight/data/devices/repository/DevicesRepository.kt \
            app/src/main/java/com/aqua/aqualight/data/devices/provisioning/repository/AqlProvisioningHandoffSaver.kt \
            app/src/test/java/com/aqua/aqualight/data/devices/repository/DeviceRuntimeMetadataLivePipelineTest.kt \
            app/src/test/java/com/aqua/aqualight/data/devices/repository/DeviceRuntimeMetadataReconnectBootstrapTest.kt
          git commit -m "Preserve current provisioning metadata trust"
          git push origin HEAD:agent/android-typed-device-metadata
