name: Stage 9 Commercial Closure

on:
  push:
    branches:
      - agent/stage-9-feedback-media-cleanup
    paths:
      - .github/workflows/stage9_commercial_closure.yml

permissions:
  contents: write

concurrency:
  group: stage9-commercial-closure
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}
      STAGE9_PATCH_GZIP_BASE64: 

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-9-feedback-media-cleanup
          fetch-depth: 0

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "cmdline-tools;latest"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"

      - name: Apply commercial closure
        run: |
          printf '%s' "${STAGE9_PATCH_GZIP_BASE64}" | base64 --decode | gzip --decompress > /tmp/stage9_commercial_closure.py
          python3 /tmp/stage9_commercial_closure.py

      - name: Validate patch shape
        run: |
          git diff --check
          python3 tools/stage9_feedback_media_guard.py

      - name: Validate unit tests, lint and debug build
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace --no-daemon

      - name: Commit commercial closure
        run: |
          git config user.name "AquaLight Stage 9 Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 1
          git commit -m "Stage 9: close commercial media integrity gaps"
          git push origin HEAD:agent/stage-9-feedback-media-cleanup
