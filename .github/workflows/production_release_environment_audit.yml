name: Production Release Environment Audit

on:
  pull_request:
    paths:
      - ".github/workflows/production_release_environment_audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: Verify production-release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-release
    env:
      AQL_PRODUCTION_RELEASE_ENABLED: ${{ vars.AQL_PRODUCTION_RELEASE_ENABLED }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      RELEASE_SIGNING_CERT_SHA256: ${{ secrets.RELEASE_SIGNING_CERT_SHA256 }}

    steps:
      - name: Validate environment values without printing them
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${AQL_PRODUCTION_RELEASE_ENABLED}" == "true" ]] || {
            echo "AQL_PRODUCTION_RELEASE_ENABLED must equal true" >&2
            exit 1
          }
          for name in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_KEYSTORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD \
            RELEASE_SIGNING_CERT_SHA256
          do
            [[ -n "${!name:-}" ]] || {
              echo "Missing or empty environment secret: ${name}" >&2
              exit 1
            }
          done
          echo "production-release environment contract passed"
