name: Dispatch v0.14.0 Candidate Once

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == '_v0140-candidate-trigger-once' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Remove dispatcher, move tag and start candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.14.0
          WORKFLOW_PATH: .github/workflows/_dispatch_v0140_candidate_once.yml
          TRIGGER_BRANCH: _v0140-candidate-trigger-once
        run: |
          set -Eeuo pipefail

          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" == "$GITHUB_SHA" ]]

          workflow_blob_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}?ref=main" \
            --jq '.sha')"

          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW_PATH}" \
            -f message='ci: remove one-time v0.14.0 candidate dispatcher' \
            -f sha="$workflow_blob_sha" \
            -f branch=main \
            >/dev/null

          release_commit=""
          for _ in $(seq 1 60); do
            release_commit="$(gh api \
              "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
              --jq '.object.sha')"
            if [[ "$release_commit" != "$main_sha" ]]; then
              break
            fi
            sleep 2
          done
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$release_commit" != "$main_sha" ]]

          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
            -f sha="$release_commit" \
            -F force=true \
            >/dev/null

          tag_sha="$(gh api \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq '.object.sha')"
          [[ "$tag_sha" == "$release_commit" ]]

          before_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/android_release.yml/runs?event=workflow_dispatch&per_page=1" \
            --jq '.workflow_runs[0].id // 0')"

          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/android_release.yml/dispatches" \
            -f ref=main \
            -f "inputs[release_tag]=${RELEASE_TAG}" \
            -f 'inputs[phase]=candidate'

          run_id=""
          run_url=""
          for _ in $(seq 1 90); do
            row="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/android_release.yml/runs?event=workflow_dispatch&branch=main&per_page=30" \
              --jq ".workflow_runs[] | select(.id > ${before_id} and .head_sha == \"${release_commit}\" and .path == \".github/workflows/android_release.yml\") | [.id, .html_url] | @tsv" \
              | head -n 1)"
            if [[ -n "$row" ]]; then
              IFS=$'\t' read -r run_id run_url <<< "$row"
              break
            fi
            sleep 4
          done

          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$run_url" == https://github.com/* ]]

          body="v0.14.0 candidate başlatıldı.\n\n- Clean main commit: \`${release_commit}\`\n- Candidate run ID: \`${run_id}\`\n- Run: ${run_url}\n- Phase: \`candidate\`\n- APK + AAB: workflow tarafından zorunlu üretiliyor\n- Google Play upload: yok"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.pull_request.number }}/comments" \
            -f body="$body" \
            >/dev/null

          gh api --method PATCH \
            "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}" \
            -f state=closed \
            >/dev/null

          gh api --method DELETE \
            "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TRIGGER_BRANCH}" \
            >/dev/null
