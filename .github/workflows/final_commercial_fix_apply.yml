name: One-shot final commercial fix validation

on:
  pull_request:
    branches:
      - agent/localization-accessibility-commercial
    paths:
      - "tools/final_commercial_fix.py"
      - "tools/final_commercial_fix_followup.py"
      - ".github/workflows/final_commercial_fix_apply.yml"

permissions:
  contents: write

jobs:
  apply-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/final-commercial-fix-candidate-2
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Apply reviewed fixes
        run: |
          python3 tools/final_commercial_fix.py
          python3 tools/final_commercial_fix_followup.py

      - name: Static integrity checks
        run: |
          git diff --check
          grep -q 'AquariumTankTaxonomyText.canonicalTankType' app/src/main/java/com/aqua/aqualight/ui/tabs/aquarium/create/steps/TankInfoFragment.kt
          grep -q 'NumberFormat.getNumberInstance(Locale.US)' app/src/main/java/com/aqua/aqualight/i18n/LocaleFormatter.kt
          grep -q 'x = dp(49, density)' app/src/androidTest/java/com/aqua/aqualight/base/accessibility/MinimumTouchTargetInstrumentedTest.kt
          grep -q 'centimeters > AquariumMeasurementPolicy.MAX_DIMENSION_CM.toDouble()' app/src/main/java/com/aqua/aqualight/ui/tabs/aquarium/common/AquariumDimensionInputPolicy.kt
          ! grep -q 'private val allowedTankTypes = setOf' app/src/main/java/com/aqua/aqualight/data/aquarium/store/TankStoreRules.kt

      - name: Pre-commit unit, lint and debug build
        run: |
          chmod +x gradlew
          set +e
          ./gradlew --no-daemon --stacktrace \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug > /tmp/final-validation.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 240 /tmp/final-validation.log > .final-fix-error.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .final-fix-error.txt
            git commit -m "Record final validation failure"
            git push origin HEAD:agent/final-commercial-fix-candidate-2
            exit "$status"
          fi

      - name: Commit validated product changes
        run: |
          rm -f tools/final_commercial_fix.py tools/final_commercial_fix_followup.py \
            .github/workflows/final_commercial_fix_apply.yml .final-fix-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize language-neutral values and localized tank taxonomy"
          git push origin HEAD:agent/final-commercial-fix-candidate-2
