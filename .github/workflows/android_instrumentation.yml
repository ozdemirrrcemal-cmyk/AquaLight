name: Android Instrumentation Gate

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instrumentation:
    name: Staging emulator API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 55

    strategy:
      fail-fast: false
      matrix:
        api-level: [27, 35]

    env:
      CI: 'true'
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}
      RELEASE_KEYSTORE_PASSWORD: aqualight-ci
      RELEASE_KEY_ALIAS: aqualight-ci
      RELEASE_KEY_PASSWORD: aqualight-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install JDK 17
        uses: actions/setup-java@7a445ee88d4e23b52c33b6bd5c9534e3e3fa7393 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare staging Firebase configuration
        run: python3 tools/ci/materialize_firebase_config.py --environment staging --allow-ci-fixture

      - name: Verify release-smoke runner contract
        run: |
          grep -Fq "connectedStagingDebugAndroidTest" tools/run_release_smoke.sh
          grep -Fq "com.aqua.aqualight.staging" tools/run_release_smoke.sh
          grep -Fq "bash tools/verify_uninstall_clears_data.sh" tools/run_release_smoke.sh
          grep -Fq "RELEASE_SMOKE_PASS" tools/run_release_smoke.sh
          grep -Fq "AccountDeletionProcessDeathSmokeActivity" tools/run_release_smoke.sh
          grep -Fq "ACCOUNT_DELETION_PROCESS_DEATH_PASS" tools/run_release_smoke.sh
          grep -Fq "auth-confirmed-before-checkpoint" tools/run_release_smoke.sh
          grep -Fq "large-font-light" tools/run_release_smoke.sh
          grep -Fq "rtl-light" tools/run_release_smoke.sh

      - name: Generate CI-only staging signing key
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/aqualight-ci.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            -keypass "$RELEASE_KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AquaLight CI,O=AquaLight,C=TR"
          chmod 600 "$KEYSTORE"
          printf 'AQL_RELEASE_KEYSTORE_PATH=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"

      - name: Build minified staging smoke APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleStagingReleaseSmoke --no-daemon --stacktrace \
            2>&1 | tee assemble-release-smoke.log
          SMOKE_APK="$(find app/build/outputs/apk/staging/releaseSmoke -type f -name '*.apk' | head -n 1)"
          test -n "$SMOKE_APK"
          test -s "$SMOKE_APK"
          printf '%s\n' "$SMOKE_APK" > release-smoke-apk-path.txt

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run staging instrumentation and minified smoke matrix
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot-save
            -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_release_smoke.sh "${{ matrix.api-level }}"

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumentation-api-${{ matrix.api-level }}-${{ github.run_id }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            assemble-release-smoke.log
            release-smoke-*.txt
            release-smoke-*.xml
            release-smoke-screens/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove ephemeral signing and Firebase files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/aqualight-ci.jks"
          rm -f app/src/staging/google-services.json
