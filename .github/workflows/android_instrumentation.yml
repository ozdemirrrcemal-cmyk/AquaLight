name: Android Instrumentation Gate

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Optional Git ref to test
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: android-instrumentation-${{ inputs.ref || github.sha }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: Emulator API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        api-level: [27, 35]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Set up Android toolchain
        uses: ./.github/actions/android-setup

      - name: Verify release-smoke runner contract
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq "connectedDebugAndroidTest" tools/run_release_smoke.sh
          grep -Fq "bash tools/verify_uninstall_clears_data.sh" tools/run_release_smoke.sh
          grep -Fq "RELEASE_SMOKE_PASS" tools/run_release_smoke.sh
          grep -Fq "ReleaseSmokeActivity" tools/run_release_smoke.sh
          grep -Fq "AccountDeletionProcessDeathSmokeActivity" tools/run_release_smoke.sh
          grep -Fq "ACCOUNT_DELETION_PROCESS_DEATH_PASS" tools/run_release_smoke.sh
          grep -Fq "auth-confirmed-before-checkpoint" tools/run_release_smoke.sh
          grep -Fq "aqua_smoke_profile" tools/run_release_smoke.sh
          grep -Fq "large-font-light" tools/run_release_smoke.sh
          grep -Fq "rtl-light" tools/run_release_smoke.sh

      - name: Generate isolated CI debug keystore
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.android
          if [[ ! -s ~/.android/debug.keystore ]]; then
            keytool -genkeypair -noprompt \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 1 \
              -dname "CN=AquaLight CI,O=AquaLight,C=TR"
          fi

      - name: Build minified release-smoke APK
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          ./gradlew :app:assembleReleaseSmoke --no-daemon --stacktrace \
            2>&1 | tee assemble-release-smoke.log
          SMOKE_APK="$(find app/build/outputs/apk/releaseSmoke -type f -name '*.apk' | head -n 1)"
          test -n "${SMOKE_APK}"
          test -s "${SMOKE_APK}"
          printf '%s\n' "${SMOKE_APK}" > release-smoke-apk-path.txt

      - name: Enable KVM group permissions
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation and minified release smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot-save
            -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_release_smoke.sh "${{ matrix.api-level }}"

      - name: Upload instrumentation and smoke reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumentation-api-${{ matrix.api-level }}-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            assemble-release-smoke.log
            release-smoke-run.txt
            release-smoke-window.xml
            release-smoke-logcat.txt
            release-smoke-activities.txt
            release-smoke-package.txt
            release-smoke-install.txt
            release-smoke-package-path.txt
            release-smoke-start.txt
            release-smoke-*-start.txt
            release-smoke-*-window.xml
            release-smoke-screens/**
          if-no-files-found: ignore
          retention-days: 14
