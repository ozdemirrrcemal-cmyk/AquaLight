name: Android Emulator Integration Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/android_instrumentation.yml"
      - ".github/workflows/android_release.yml"
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle"
      - "build.gradle"
      - "tools/run_release_smoke.sh"

concurrency:
  group: android-emulator-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  instrumentation:
    name: Emulator API ${{ matrix.api-level }}
    runs-on: ubuntu-latest
    timeout-minutes: 55

    strategy:
      fail-fast: false
      matrix:
        api-level: [27, 35]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install compile SDK and prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36"
          chmod +x gradlew

      - name: Verify release-smoke runner contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "connectedDebugAndroidTest" tools/run_release_smoke.sh
          grep -Fq "bash tools/verify_uninstall_clears_data.sh" tools/run_release_smoke.sh
          grep -Fq "RELEASE_SMOKE_PASS" tools/run_release_smoke.sh
          grep -Fq "ReleaseSmokeActivity" tools/run_release_smoke.sh
          grep -Fq "AccountDeletionProcessDeathSmokeActivity" tools/run_release_smoke.sh
          grep -Fq "ACCOUNT_DELETION_PROCESS_DEATH_PASS" tools/run_release_smoke.sh
          grep -Fq "auth-confirmed-before-checkpoint" tools/run_release_smoke.sh
          grep -Fq "aqua_smoke_profile" tools/run_release_smoke.sh
          grep -Fq "large-font-light" tools/run_release_smoke.sh
          grep -Fq "rtl-light" tools/run_release_smoke.sh

      - name: Generate CI-only release keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore release-key.jks \
            -storepass aqualight-ci \
            -alias aqualight-ci \
            -keypass aqualight-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AquaLight CI,O=AquaLight,C=TR"

      - name: Build minified release-smoke APK
        env:
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew assembleReleaseSmoke --no-daemon --stacktrace \
            2>&1 | tee assemble-release-smoke.log
          SMOKE_APK="$(find app/build/outputs/apk/releaseSmoke -type f -name '*.apk' | head -n 1)"
          test -n "$SMOKE_APK"
          test -s "$SMOKE_APK"
          printf '%s\n' "$SMOKE_APK" > release-smoke-apk-path.txt

      - name: Enable KVM group permissions
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation and minified release smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot-save
            -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_release_smoke.sh "${{ matrix.api-level }}"

      - name: Upload instrumentation and smoke reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumentation-api-${{ matrix.api-level }}-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            assemble-release-smoke.log
            release-smoke-*.txt
            release-smoke-*.xml
            release-smoke-screens/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove CI-only release keystore
        if: always()
        run: rm -f release-key.jks
