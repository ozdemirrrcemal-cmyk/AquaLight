name: Diagnose Stage 14 Candidate Failure

on:
  pull_request:
    paths:
      - ".github/workflows/_diagnose_stage14_release.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report temporary tag diagnostic runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/_diagnose_stage14_release.yml/runs?per_page=30" \
            --jq '.workflow_runs[] | [.id, .status, (.conclusion // ""), .event, (.head_branch // ""), .head_sha, .html_url] | @tsv'
