name: Diagnose Stage 14 Candidate Failure

on:
  pull_request:
    paths:
      - ".github/workflows/_diagnose_stage14_release.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Extract failed candidate error
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_JOB_ID: "89806338575"
        run: |
          set -Eeuo pipefail
          log_file="${RUNNER_TEMP}/failed-candidate.log"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${FAILED_JOB_ID}/logs" > "${log_file}"
          test -s "${log_file}"
          python3 - "${log_file}" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          cleaned = [re.sub(r"^\ufeff?\d{4}-\d{2}-\d{2}T[^ ]+Z\s+", "", line) for line in lines]
          start = max((i for i, line in enumerate(cleaned) if "06 Build production-signed minified APK and AAB" in line), default=0)
          end = next((i for i in range(start + 1, len(cleaned)) if "Remove generated Firebase configurations" in cleaned[i]), len(cleaned))
          segment = cleaned[start:end]
          markers = ("##[error]", "FAILURE:", "What went wrong", "Execution failed for task", "BUILD FAILED", "Process completed with exit code", "Caused by:")
          hits = [i for i, line in enumerate(segment) if any(marker.lower() in line.lower() for marker in markers)]
          selected = set()
          for hit in hits[-12:]:
              selected.update(range(max(0, hit - 15), min(len(segment), hit + 18)))
          if not selected:
              selected.update(range(max(0, len(segment) - 160), len(segment)))
          output = "\n".join(segment[i] for i in sorted(selected))
          if len(output) > 12000:
              output = output[-12000:]
          print(output)
          PY
