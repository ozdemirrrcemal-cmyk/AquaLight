name: Diagnose Stage 14 Candidate Failure

on:
  pull_request:
    paths:
      - ".github/workflows/_diagnose_stage14_release.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Extract exact reproduced failure
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_JOB_ID: "89808496515"
        run: |
          set -Eeuo pipefail
          log_file="${RUNNER_TEMP}/diagnostic-release.log"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${DIAGNOSTIC_JOB_ID}/logs" > "${log_file}"
          test -s "${log_file}"
          python3 - "${log_file}" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          cleaned = [re.sub(r"^\ufeff?\d{4}-\d{2}-\d{2}T[^ ]+Z\s+", "", line) for line in lines]
          hits = [
              i for i, line in enumerate(cleaned)
              if "build_release.sh line" in line
              or "##[error]" in line
              or "Process completed with exit code" in line
          ]
          selected = set()
          for hit in hits[-10:]:
              selected.update(range(max(0, hit - 12), min(len(cleaned), hit + 14)))
          print("\n".join(cleaned[i] for i in sorted(selected)))
          PY
