name: Diagnose Stage 14 Candidate Failure

on:
  pull_request:
    paths:
      - ".github/workflows/_diagnose_stage14_release.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Print exact reproduced failure line
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DIAGNOSTIC_JOB_ID: "89808496515"
        run: |
          set -Eeuo pipefail
          log_file="${RUNNER_TEMP}/diagnostic-release.log"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${DIAGNOSTIC_JOB_ID}/logs" > "${log_file}"
          test -s "${log_file}"
          python3 - "${log_file}" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()
          cleaned = [re.sub(r"^\ufeff?\d{4}-\d{2}-\d{2}T[^ ]+Z\s+", "", line) for line in lines]
          exact = [line for line in cleaned if line.startswith("##[error]build_release.sh line")]
          if not exact:
              exact = [line for line in cleaned if line.startswith("##[error]")]
          for line in exact:
              print(line)
          PY
