name: Diagnose Stage 14 Candidate Failure

on:
  push:
    tags:
      - "diag-v0.14.0"

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-release
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
        -Dorg.gradle.daemon=false
      AQL_RELEASE_TAG: v0.14.0
      AQL_RELEASE_VERSION: 0.14.0
      AQL_RELEASE_COMMIT: a31eb4efaf4685aa03e5d0a27c2e335ecf8bf16c
      AQL_INCLUDE_APK: "true"
      AQL_RELEASE_ROOT: candidate-release
      AQL_PRODUCTION_RELEASE_ENABLED: "true"
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v0.14.0

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: "15859902"

      - name: Install release SDK packages
        shell: bash
        run: |
          set -Eeu
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          chmod +x ./gradlew

      - name: Run release build with failing command diagnostic
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          AQL_FIREBASE_DEBUG_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_DEBUG_CONFIG_BASE64 }}
          AQL_FIREBASE_STAGING_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_STAGING_CONFIG_BASE64 }}
          AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64 }}
          AQL_FIREBASE_PRODUCTION_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_PRODUCTION_CONFIG_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_SIGNING_CERT_SHA256: ${{ secrets.RELEASE_SIGNING_CERT_SHA256 }}
        run: |
          set -Eeuo pipefail
          cleanup() {
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/diag-v0.14.0" >/dev/null 2>&1 || true
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/_stage14-release-log-diagnostic" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          trap 'rc=$?; printf "::error::build_release.sh line %s failed while running: %s (exit %s)\n" "$LINENO" "$BASH_COMMAND" "$rc"; exit "$rc"' ERR
          source tools/release_pipeline/build_release.sh
