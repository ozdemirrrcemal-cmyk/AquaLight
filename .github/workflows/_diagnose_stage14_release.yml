name: Diagnose Stage 14 Candidate Failure

on:
  pull_request:
    paths:
      - ".github/workflows/_diagnose_stage14_release.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
        -Dorg.gradle.daemon=false
      AQL_RELEASE_TAG: v0.14.0
      AQL_RELEASE_VERSION: 0.14.0
      AQL_RELEASE_COMMIT: a31eb4efaf4685aa03e5d0a27c2e335ecf8bf16c
      AQL_INCLUDE_APK: "true"
      AQL_RELEASE_ROOT: candidate-release
      AQL_PRODUCTION_RELEASE_ENABLED: "true"
      AQL_OTA_MANIFEST_KEY_ID: diagnostic-key

    steps:
      - name: Checkout exact failed release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: v0.14.0

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          cmdline-tools-version: "15859902"

      - name: Install release SDK packages
        shell: bash
        run: |
          set -Eeu
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          chmod +x ./gradlew

      - name: Generate isolated diagnostic Firebase inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os

          rows = [
              ("AQL_FIREBASE_DEBUG_CONFIG_BASE64", "com.aqua.aqualight.debug", "100000000001", "aql-debug-00001", "a1"),
              ("AQL_FIREBASE_STAGING_CONFIG_BASE64", "com.aqua.aqualight.staging", "100000000002", "aql-staging-00002", "b2"),
              ("AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64", "com.aqua.aqualight.smoke", "100000000003", "aql-smoke-00003", "c3"),
              ("AQL_FIREBASE_PRODUCTION_CONFIG_BASE64", "com.aqua.aqualight", "100000000004", "aql-production-00004", "d4"),
          ]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for variable, package_name, number, project_id, suffix in rows:
                  document = {
                      "project_info": {
                          "project_number": number,
                          "project_id": project_id,
                          "storage_bucket": f"{project_id}.appspot.com",
                      },
                      "client": [
                          {
                              "client_info": {
                                  "mobilesdk_app_id": f"1:{number}:android:{suffix * 8}",
                                  "android_client_info": {"package_name": package_name},
                              },
                              "oauth_client": [
                                  {
                                      "client_id": f"{number}-diagnostic.apps.googleusercontent.com",
                                      "client_type": 3,
                                  }
                              ],
                              "api_key": [{"current_key": "AIza" + "A" * 35}],
                              "services": {},
                          }
                      ],
                      "configuration_version": "1",
                  }
                  encoded = base64.b64encode(
                      json.dumps(document, separators=(",", ":")).encode("utf-8")
                  ).decode("ascii")
                  output.write(f"{variable}={encoded}\n")
          PY

      - name: Generate diagnostic release keystore
        shell: bash
        run: |
          set -Eeuo pipefail
          keytool -genkeypair \
            -keystore diagnostic-release.jks \
            -storepass diagnostic-password \
            -alias diagnostic-release \
            -keypass diagnostic-password \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storetype JKS \
            -dname "CN=AquaLight Diagnostic,O=AquaLight,C=TR" \
            >/dev/null 2>&1
          cert_sha="$(keytool -list -v \
            -keystore diagnostic-release.jks \
            -storepass diagnostic-password \
            -alias diagnostic-release \
            | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' \
            | head -n 1)"
          {
            echo "RELEASE_KEYSTORE_BASE64=$(base64 -w 0 diagnostic-release.jks)"
            echo "RELEASE_KEYSTORE_PASSWORD=diagnostic-password"
            echo "RELEASE_KEY_ALIAS=diagnostic-release"
            echo "RELEASE_KEY_PASSWORD=diagnostic-password"
            echo "RELEASE_SIGNING_CERT_SHA256=${cert_sha}"
          } >> "$GITHUB_ENV"
          rm -f diagnostic-release.jks

      - name: Reproduce release build with exact failing-command report
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; printf "::error::build_release.sh line %s failed while running: %s (exit %s)\n" "$LINENO" "$BASH_COMMAND" "$rc"; exit "$rc"' ERR
          source tools/release_pipeline/build_release.sh
