name: One-shot Care UI Reference Cleanup

on:
  push:
    branches:
      - feature/stage-3-aquarium-care-boundaries

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/stage-3-aquarium-care-boundaries
          fetch-depth: 0

      - name: Clean care UI references
        run: python3 tools/care_ui_reference_cleanup.py

      - name: Commit cleaned sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No cleanup changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Clean care UI application references"
          git push origin HEAD:feature/stage-3-aquarium-care-boundaries
