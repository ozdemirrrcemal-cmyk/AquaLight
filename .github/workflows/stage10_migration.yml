name: Stage 10 Resource Migration

on:
  push:
    branches:
      - agent/stage-10-design-system-resource-cleanup
    paths:
      - "tools/stage10_xml_resource_migration.py"
      - "tools/stage10_kotlin_color_migration.py"
      - "tools/stage10_kotlin_text_migration.py"
      - ".github/workflows/stage10_migration.yml"
  pull_request:
    paths:
      - "app/src/main/**"
      - "tools/stage10_*.py"
      - ".github/workflows/stage10_migration.yml"

permissions:
  contents: write

concurrency:
  group: stage10-resource-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout transition branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-10-design-system-resource-cleanup
          fetch-depth: 0

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Run deterministic resource migrations
        run: |
          set -euo pipefail
          echo "Stage 10 migration schema: 4"
          python3 -m py_compile tools/stage10_xml_resource_migration.py
          python3 -m py_compile tools/stage10_kotlin_color_migration.py
          python3 -m py_compile tools/stage10_kotlin_text_migration.py
          python3 tools/stage10_xml_resource_migration.py | tee docs/stage10-migration-result.txt
          python3 tools/stage10_kotlin_color_migration.py | tee -a docs/stage10-migration-result.txt
          python3 tools/stage10_kotlin_text_migration.py | tee -a docs/stage10-migration-result.txt

      - name: Verify generated Android resources and Kotlin compilation
        id: build
        shell: bash
        run: |
          set +e
          chmod +x ./gradlew
          ./gradlew :app:processDebugResources :app:compileDebugKotlin --no-daemon --stacktrace \
            > docs/stage10-migration-build.txt 2>&1
          status=$?
          echo "BUILD_EXIT=${status}" >> docs/stage10-migration-build.txt
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Refresh Stage 10 audit
        shell: bash
        run: |
          set -o pipefail
          python3 tools/stage10_design_system_guard.py > docs/stage10-audit.txt 2>&1 || true
          {
            echo "# Stage 10 audit summary"
            echo
            echo "## Rule counts"
            grep -o '\[[A-Z0-9_]*\]' docs/stage10-audit.txt | sort | uniq -c | sort -nr || true
            echo
            echo "## Files by rule"
            for rule in RAW_XML_TEXT RAW_UI_MESSAGE RAW_COLOR RAW_DIMENSION LEGACY_STYLE MENU_STRING_RESOURCE NIGHT_SPLASH_TYPOGRAPHY SYSTEM_BAR_CONTRAST REQUIRED_RESOURCE; do
              echo
              echo "### ${rule}"
              grep "\[${rule}\]" docs/stage10-audit.txt | sed -E 's/^ - ([^:]+):.*/\1/' | sort -u || true
            done
            echo
            echo "BUILD_EXIT=${{ steps.build.outputs.status }}"
            echo "GENERATED_COMMIT=$(git rev-parse HEAD)"
            echo "GENERATED_AT_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > docs/stage10-audit-summary.txt

      - name: Commit migrated resources and verification reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main docs/stage10-*.txt
          if git diff --cached --quiet; then
            echo "Migration produced no changes."
          else
            git commit -m "Stage 10: centralize Kotlin colors and user text"
            git push origin HEAD:agent/stage-10-design-system-resource-cleanup
          fi

      - name: Enforce compilation result
        if: steps.build.outputs.status != '0'
        run: |
          echo "Generated resources did not compile. See docs/stage10-migration-build.txt."
          exit 1
