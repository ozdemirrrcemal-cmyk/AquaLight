name: Create Stage 14 Diagnostic Tag

on:
  push:
    branches:
      - _stage14-release-log-diagnostic

permissions:
  actions: read
  contents: write
  issues: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create temporary diagnostic tag and report run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/diag-v0.14.0" >/dev/null 2>&1 || true
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/diag-v0.14.0" \
            -f sha="${GITHUB_SHA}" \
            >/dev/null

          run_id=""
          run_url=""
          for _ in $(seq 1 60); do
            run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/_diagnose_stage14_release.yml/runs?event=push&per_page=30" \
              --jq ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\" and .head_branch == \"diag-v0.14.0\") | .id" \
              | head -n 1)"
            if [[ -n "${run_id}" ]]; then
              run_url="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.html_url')"
              break
            fi
            sleep 5
          done
          [[ "${run_id}" =~ ^[1-9][0-9]*$ ]]

          gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/104/comments" \
            -f body="Stage 14 diagnostic workflow run: ${run_url} (run ID: ${run_id})" \
            >/dev/null
