name: Stage 11 Patch Locale Migration

on:
  push:
    branches:
      - agent/stage-11-localization-accessibility-clean-v2
    paths:
      - ".github/workflows/stage11_patch_locale_migration.yml"

permissions:
  contents: write

concurrency:
  group: stage11-patch-locale-migration
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean Stage 11 branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-11-localization-accessibility-clean-v2
          fetch-depth: 0

      - name: Patch verified transforms
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/stage11_apply_locale_migration.py")
          source = path.read_text(encoding="utf-8")

          old_feedback = '    ensure_import(relative, "import com.aqua.aqualight.localization.LocaleFormatters\\n")\n    replace_exact(\n        relative,\n        "private val localeTagProvider:'
          new_feedback = '    ensure_import(\n        relative,\n        "import com.aqua.aqualight.localization.LocaleFormatters\\n",\n        anchor="import com.aqua.aqualight.BuildConfig\\n"\n    )\n    replace_exact(\n        relative,\n        "private val localeTagProvider:'
          if source.count(old_feedback) != 1:
              raise SystemExit("Feedback migration transform anchor mismatch")
          source = source.replace(old_feedback, new_feedback, 1)

          old_template = '''      return LocaleFormatters.formatTemplate(\\n"
        "        locale = locale,\\n"
        "        template = pageFormat,\\n"
        "        pageNumber\\n"
        "      )\\n",'''
          new_template = '''      return LocaleFormatters.formatTemplate(\\n"
        "        locale,\\n"
        "        pageFormat,\\n"
        "        pageNumber\\n"
        "      )\\n",'''
          if source.count(old_template) != 1:
              raise SystemExit("PDF template migration transform mismatch")
          source = source.replace(old_template, new_template, 1)

          path.write_text(source, encoding="utf-8")
          PY

      - name: Remove one-time patch workflow
        run: rm -f .github/workflows/stage11_patch_locale_migration.yml

      - name: Commit migration transform corrections
        run: |
          git config user.name "AquaLight Stage 11 Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "build: correct locale migration transforms"
          git push origin HEAD:agent/stage-11-localization-accessibility-clean-v2
