name: Apply One-time Gradle Trust Repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: apply-one-time-gradle-trust-repair
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 96 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-main-gradle-trust'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download verified repair artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: main-gradle-trust-repair-30134410833
          path: incoming
          repository: ${{ github.repository }}
          run-id: 30134410833
          github-token: ${{ github.token }}

      - name: Validate artifact and update repair branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: agent/fix-main-gradle-trust
          PR_NUMBER: '96'
          SOURCE_RUN_ID: '30134410833'
          SOURCE_HEAD_SHA: 8f6d929e62060684fc0abdac7ef487a371131c72
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          from pathlib import Path

          repository = os.environ['REPOSITORY']
          head_ref = os.environ['HEAD_REF']
          pr_number = int(os.environ['PR_NUMBER'])
          source_run_id = int(os.environ['SOURCE_RUN_ID'])
          source_head_sha = os.environ['SOURCE_HEAD_SHA']
          token = os.environ['GH_TOKEN']
          api_root = 'https://api.github.com'
          incoming = Path('incoming')

          def api(method: str, path: str, payload=None):
              data = None
              headers = {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'AquaLight-One-Time-Trust-Repair',
              }
              if payload is not None:
                  data = json.dumps(payload).encode('utf-8')
                  headers['Content-Type'] = 'application/json'
              request = urllib.request.Request(
                  api_root + path,
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read()
              except urllib.error.HTTPError as error:
                  detail = error.read().decode('utf-8', errors='replace')
                  raise SystemExit(
                      f'GitHub API {method} {path} failed: {error.code}: {detail}'
                  ) from error
              return json.loads(body) if body else None

          expected_files = {
              'app/build.gradle',
              'app/gradle.lockfile',
              'gradle/verification-metadata.xml',
              'build/reports/gradle-trust-repair.json',
          }
          actual_files = {
              path.relative_to(incoming).as_posix()
              for path in incoming.rglob('*')
              if path.is_file()
          }
          if actual_files != expected_files:
              raise SystemExit(
                  'Unexpected repair artifact files: ' + ', '.join(sorted(actual_files))
              )
          if any(path.is_symlink() for path in incoming.rglob('*')):
              raise SystemExit('Symlinks are forbidden in the repair artifact.')

          run = api('GET', f'/repos/{repository}/actions/runs/{source_run_id}')
          if run.get('conclusion') != 'success':
              raise SystemExit('Source repair run did not complete successfully.')
          if run.get('head_branch') != head_ref or run.get('head_sha') != source_head_sha:
              raise SystemExit('Source repair run identity does not match the expected branch and SHA.')

          pull = api('GET', f'/repos/{repository}/pulls/{pr_number}')
          if pull.get('state') != 'open':
              raise SystemExit('Repair pull request is not open.')
          if pull.get('base', {}).get('ref') != 'main':
              raise SystemExit('Repair pull request does not target main.')
          if pull.get('head', {}).get('ref') != head_ref:
              raise SystemExit('Repair pull request head branch changed.')
          if pull.get('head', {}).get('repo', {}).get('full_name') != repository:
              raise SystemExit('Repair pull request head is not in this repository.')

          build_path = incoming / 'app/build.gradle'
          lock_path = incoming / 'app/gradle.lockfile'
          metadata_path = incoming / 'gradle/verification-metadata.xml'
          report_path = incoming / 'build/reports/gradle-trust-repair.json'

          build_text = build_path.read_text(encoding='utf-8')
          if build_text.count("    id 'jacoco'\n") != 1:
              raise SystemExit('Gradle JaCoCo plugin alignment is missing or duplicated.')
          if build_text.count('jacoco {\n    toolVersion = "0.8.15"\n}\n') != 1:
              raise SystemExit('Gradle JaCoCo toolVersion 0.8.15 alignment is missing or duplicated.')

          lock_text = lock_path.read_text(encoding='utf-8')
          if not lock_text.startswith('# This is a Gradle generated file for dependency locking.'):
              raise SystemExit('Generated Gradle lockfile header is invalid.')
          jacoco_lines = [line for line in lock_text.splitlines() if line.startswith('org.jacoco:')]
          expected_jacoco = {
              'org.jacoco:org.jacoco.agent:0.8.15=androidJacocoAnt,jacocoAgent,jacocoAnt',
              'org.jacoco:org.jacoco.ant:0.8.15=androidJacocoAnt,jacocoAnt',
              'org.jacoco:org.jacoco.core:0.8.15=androidJacocoAnt,jacocoAnt',
              'org.jacoco:org.jacoco.report:0.8.15=androidJacocoAnt,jacocoAnt',
          }
          if set(jacoco_lines) != expected_jacoco:
              raise SystemExit('Generated JaCoCo lock entries are not fully aligned to 0.8.15.')
          if ':0.8.12=' in lock_text:
              raise SystemExit('Generated lockfile still contains a stale 0.8.12 entry.')

          verification_tree = ET.parse(metadata_path)
          if not verification_tree.getroot().tag.endswith('verification-metadata'):
              raise SystemExit('Generated verification metadata root is invalid.')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          if report.get('passed') is not True:
              raise SystemExit('Generated dependency-integrity report did not pass.')
          if report.get('verificationMetadata', {}).get('algorithm') != 'SHA-256':
              raise SystemExit('Generated verification metadata is not SHA-256 based.')

          encoded_ref = urllib.parse.quote(head_ref, safe='/')
          ref = api('GET', f'/repos/{repository}/git/ref/heads/{encoded_ref}')
          current_head_sha = ref['object']['sha']
          current_commit = api('GET', f'/repos/{repository}/git/commits/{current_head_sha}')
          current_tree_sha = current_commit['tree']['sha']

          tree_entries = []
          for repository_path, artifact_path in (
              ('app/build.gradle', build_path),
              ('app/gradle.lockfile', lock_path),
              ('gradle/verification-metadata.xml', metadata_path),
          ):
              blob = api(
                  'POST',
                  f'/repos/{repository}/git/blobs',
                  {'content': artifact_path.read_text(encoding='utf-8'), 'encoding': 'utf-8'},
              )
              tree_entries.append(
                  {
                      'path': repository_path,
                      'mode': '100644',
                      'type': 'blob',
                      'sha': blob['sha'],
                  }
              )

          new_tree = api(
              'POST',
              f'/repos/{repository}/git/trees',
              {'base_tree': current_tree_sha, 'tree': tree_entries},
          )
          if new_tree['sha'] == current_tree_sha:
              raise SystemExit('Verified repair artifact produced no repository changes.')

          commit = api(
              'POST',
              f'/repos/{repository}/git/commits',
              {
                  'message': 'fix(ci): align JaCoCo and refresh Gradle trust state [skip ci]',
                  'tree': new_tree['sha'],
                  'parents': [current_head_sha],
              },
          )
          api(
              'PATCH',
              f'/repos/{repository}/git/refs/heads/{encoded_ref}',
              {'sha': commit['sha'], 'force': False},
          )
          print(f'Applied verified Gradle trust repair at {commit["sha"]}.')
          PY
