name: Stage 14 v0.14.0 Final Archive Recovery

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/stage14_recovery_v014.yml

permissions:
  contents: read

jobs:
  recover-final-archive:
    name: Recover byte-identical v0.14.0 final archive
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-release
    permissions:
      actions: read
      contents: read
      issues: read
    env:
      AQL_RELEASE_TAG: v0.14.0
      AQL_RELEASE_VERSION: 0.14.0
      AQL_RELEASE_COMMIT: e95879cf01746e7dd31ea6796290d0f8032b011a
      AQL_CANDIDATE_RUN_ID: "30220331247"
      AQL_INCLUDE_APK: "true"

    steps:
      - name: Checkout recovery implementation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify controlled release tag remains unchanged
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --force --tags origin
          [[ "$(git rev-list -n 1 "$AQL_RELEASE_TAG")" == "$AQL_RELEASE_COMMIT" ]]

      - name: Download immutable signed candidate
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: AquaLight-Candidate-v0.14.0
          path: candidate-release
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 30220331247

      - name: Verify candidate identity and signed bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/release_candidate_manifest.py verify \
            --root candidate-release \
            --manifest candidate-release/CANDIDATE.json \
            --release-tag "$AQL_RELEASE_TAG" \
            --commit "$AQL_RELEASE_COMMIT" \
            --run-id "$AQL_CANDIDATE_RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --summary "${RUNNER_TEMP}/candidate-verification.json"
          (cd candidate-release/artifacts && sha256sum --check --strict SHA256SUMS)
          (cd candidate-release/supply-chain && sha256sum --check --strict SHA256SUMS)

      - name: Materialize final archive input and remove transient locks
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ ! -e final-release ]]
          mkdir final-release
          cp -a candidate-release/. final-release/
          find final-release/validation/instrumentation \
            -type f -name '*.lck' -print -delete
          test -z "$(find final-release/validation/instrumentation \
            -type f -name '*.lck' -print -quit)"
          cmp \
            candidate-release/artifacts/AquaLight-0.14.0.apk \
            final-release/artifacts/AquaLight-0.14.0.apk
          cmp \
            candidate-release/artifacts/AquaLight-0.14.0.aab \
            final-release/artifacts/AquaLight-0.14.0.aab
          cmp \
            candidate-release/artifacts/AquaLight-0.14.0-mapping.txt \
            final-release/artifacts/AquaLight-0.14.0-mapping.txt

      - name: Verify protected physical candidate acceptance
        shell: bash
        env:
          AQL_STAGE14_MANUAL_ACCEPTANCE_BASE64: ${{ secrets.AQL_STAGE14_MANUAL_ACCEPTANCE_BASE64 }}
        run: |
          set -Eeuo pipefail
          value="${AQL_STAGE14_MANUAL_ACCEPTANCE_BASE64:-}"
          [[ -n "${value//[[:space:]]/}" ]]
          umask 077
          acceptance="${RUNNER_TEMP}/stage14-manual-acceptance.json"
          trap 'rm -f "$acceptance"' EXIT
          printf '%s' "$value" | base64 --decode > "$acceptance"
          python3 tools/verify_manual_acceptance.py \
            --acceptance "$acceptance" \
            --release-tag "$AQL_RELEASE_TAG" \
            --commit "$AQL_RELEASE_COMMIT" \
            --candidate-manifest final-release/CANDIDATE.json \
            --summary final-release/validation/manual-acceptance.json

      - name: Recheck release blockers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            > final-release/validation/open-issues-pages.json
          python3 tools/verify_release_blockers.py \
            --issues final-release/validation/open-issues-pages.json \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$AQL_RELEASE_COMMIT" \
            --summary final-release/validation/release-blocker-inventory.json

      - name: Materialize final evidence without rebuilding
        shell: bash
        run: bash tools/release_pipeline/materialize_evidence.sh

      - name: Verify complete byte-identical final archive
        shell: bash
        run: bash tools/release_pipeline/verify_final_archive.sh

      - name: Archive recovered Stage 14 package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AquaLight-Final-v0.14.0
          path: final-release/
          if-no-files-found: error
          retention-days: 90

      - name: Write recovery summary
        shell: bash
        run: |
          {
            echo "## AquaLight Stage 14 recovery completed"
            echo
            echo "Release: \`$AQL_RELEASE_TAG\`"
            echo
            echo "Accepted candidate run: \`$AQL_CANDIDATE_RUN_ID\`"
            echo
            echo "The signed APK, AAB and mapping were finalized without rebuilding or re-signing."
            echo
            echo "Only transient instrumentation \`*.lck\` files were removed from the final evidence copy."
          } >> "$GITHUB_STEP_SUMMARY"
