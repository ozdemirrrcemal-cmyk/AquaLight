name: Repair notification guard constant

on:
  push:
    branches:
      - agent/stage7-notification-reminders

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[guard-constant-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage7-notification-reminders
          fetch-depth: 0

      - name: Add missing UserPreferencesManager path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("tools/notification_reminder_architecture_guard.py")
          text = path.read_text(encoding="utf-8")
          anchor = 'USER_CLEANER = "app/src/main/java/com/aqua/aqualight/data/user/UserDataCleaner.kt"\n'
          insertion = anchor + 'USER_MANAGER = "app/src/main/java/com/aqua/aqualight/data/user/UserPreferencesManager.kt"\n'
          if text.count(anchor) != 1:
              raise SystemExit("Expected exactly one USER_CLEANER constant")
          if "USER_MANAGER =" in text:
              raise SystemExit("USER_MANAGER already exists")
          path.write_text(text.replace(anchor, insertion, 1), encoding="utf-8")
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/agent_guard_constant_patch.yml
          git config user.name "AquaLight CI"
          git config user.email "actions@users.noreply.github.com"
          git add tools/notification_reminder_architecture_guard.py
          git add .github/workflows/agent_guard_constant_patch.yml
          git diff --cached --check
          git commit -m "Repair notification guard constant [guard-constant-patch]"
          git push origin HEAD:agent/stage7-notification-reminders
