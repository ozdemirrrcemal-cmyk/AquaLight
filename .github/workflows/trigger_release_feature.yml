name: Trigger release build for system bar fix

on:
  push:
    branches:
      - fix/system-bar-insets
    paths:
      - .github/workflows/trigger_release_feature.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch-release:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android Release CI/CD
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/workflows/android_release.yml/dispatches" \
            --data "{\"ref\":\"${TARGET_REF}\"}"
