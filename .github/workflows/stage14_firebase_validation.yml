name: Stage 14 Firebase Configuration Validation

on:
  workflow_dispatch:
  push:
    branches:
      - "commercial/14-final-validation"
    paths:
      - "build.gradle"
      - "app/build.gradle"
      - "gradle/aqualight-firebase.gradle"
      - "**/google-services.json"
      - ".gitignore"
      - ".github/workflows/firebase_secret_guard.yml"
      - ".github/workflows/stage14_firebase_validation.yml"
      - ".github/workflows/android_release.yml"
      - ".github/workflows/codeql.yml"
      - "tools/release_pipeline/guard_quality.sh"
      - "tools/run_release_smoke.sh"
      - "docs/commercial/firebase-environment-contract.md"
      - "docs/commercial/stage-14-final-validation.md"
  pull_request:
    paths:
      - "build.gradle"
      - "app/build.gradle"
      - "gradle/aqualight-firebase.gradle"
      - "**/google-services.json"
      - ".gitignore"
      - ".github/workflows/firebase_secret_guard.yml"
      - ".github/workflows/stage14_firebase_validation.yml"
      - ".github/workflows/android_release.yml"
      - ".github/workflows/codeql.yml"
      - "tools/release_pipeline/guard_quality.sh"
      - "tools/run_release_smoke.sh"
      - "docs/commercial/firebase-environment-contract.md"
      - "docs/commercial/stage-14-final-validation.md"

concurrency:
  group: stage14-firebase-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: "true"
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
    -Dorg.gradle.daemon=false

jobs:
  firebase-non-production:
    name: Firebase non-production contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AQL_FIREBASE_DEBUG_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_DEBUG_CONFIG_BASE64 }}
      AQL_FIREBASE_STAGING_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_STAGING_CONFIG_BASE64 }}
      AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64 }}

    steps:
      - name: Checkout Stage 14 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeu
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          chmod +x ./gradlew

      - name: Validate Gradle configuration model
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew help --no-daemon --stacktrace \
            2>&1 | tee gradle-configuration.log

      - name: Verify non-production Firebase inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in \
            AQL_FIREBASE_DEBUG_CONFIG_BASE64 \
            AQL_FIREBASE_STAGING_CONFIG_BASE64 \
            AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "Required non-production Firebase input is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Reject tracked Firebase configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t tracked_configs < <(
            git ls-files | awk 'tolower($0) ~ /(^|\/)google-services\.json$/'
          )
          if [[ "${#tracked_configs[@]}" -ne 0 ]]; then
            printf 'Tracked google-services.json files are forbidden:\n' >&2
            printf ' - %s\n' "${tracked_configs[@]}" >&2
            exit 1
          fi

      - name: Validate non-production Firebase Gradle tasks
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew \
            :app:verifyFirebaseRuntimePolicy \
            :app:processDebugGoogleServices \
            :app:processStagingGoogleServices \
            :app:processReleaseSmokeGoogleServices \
            --no-daemon \
            --stacktrace \
            2>&1 | tee firebase-stage14-non-production.log

          test -s app/src/debug/google-services.json
          test -s app/src/staging/google-services.json
          test -s app/src/releaseSmoke/google-services.json
          test ! -e app/src/release/google-services.json

      - name: Upload non-production Firebase evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AquaLight-Stage14-Firebase-NonProduction-${{ github.event_name }}-${{ github.sha }}
          path: |
            gradle-configuration.log
            firebase-stage14-non-production.log
          if-no-files-found: error
          retention-days: 30

      - name: Remove generated Firebase configurations
        if: always()
        shell: bash
        run: |
          rm -f app/src/debug/google-services.json
          rm -f app/src/staging/google-services.json
          rm -f app/src/releaseSmoke/google-services.json
          rm -f app/src/release/google-services.json

  firebase-production:
    name: Firebase protected production contract
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/commercial/14-final-validation') }}
    needs: firebase-non-production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-release
    env:
      AQL_FIREBASE_DEBUG_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_DEBUG_CONFIG_BASE64 }}
      AQL_FIREBASE_STAGING_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_STAGING_CONFIG_BASE64 }}
      AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64 }}
      AQL_FIREBASE_PRODUCTION_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_PRODUCTION_CONFIG_BASE64 }}

    steps:
      - name: Checkout Stage 14 commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeu
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          chmod +x ./gradlew

      - name: Verify protected Firebase inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in \
            AQL_FIREBASE_DEBUG_CONFIG_BASE64 \
            AQL_FIREBASE_STAGING_CONFIG_BASE64 \
            AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64 \
            AQL_FIREBASE_PRODUCTION_CONFIG_BASE64; do
            value="${!name:-}"
            if [[ -z "${value//[[:space:]]/}" ]]; then
              echo "Required protected Firebase input is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Reject tracked Firebase configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t tracked_configs < <(
            git ls-files | awk 'tolower($0) ~ /(^|\/)google-services\.json$/'
          )
          if [[ "${#tracked_configs[@]}" -ne 0 ]]; then
            printf 'Tracked google-services.json files are forbidden:\n' >&2
            printf ' - %s\n' "${tracked_configs[@]}" >&2
            exit 1
          fi

      - name: Validate complete Firebase contract and isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          ./gradlew \
            :app:verifyFirebaseConfigurationContract \
            :app:verifyFirebaseEnvironmentIsolation \
            :app:verifyFirebaseRuntimePolicy \
            :app:processDebugGoogleServices \
            :app:processStagingGoogleServices \
            :app:processReleaseSmokeGoogleServices \
            :app:processReleaseGoogleServices \
            --no-daemon \
            --stacktrace \
            2>&1 | tee firebase-stage14-production.log

          test -s app/build/reports/firebase/configuration-contract.json
          test -s app/build/reports/firebase/environment-isolation.json
          test -s app/src/debug/google-services.json
          test -s app/src/staging/google-services.json
          test -s app/src/releaseSmoke/google-services.json
          test -s app/src/release/google-services.json

      - name: Upload protected Firebase evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AquaLight-Stage14-Firebase-Production-${{ github.sha }}
          path: |
            firebase-stage14-production.log
            app/build/reports/firebase/configuration-contract.json
            app/build/reports/firebase/environment-isolation.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove generated Firebase configurations
        if: always()
        shell: bash
        run: |
          rm -f app/src/debug/google-services.json
          rm -f app/src/staging/google-services.json
          rm -f app/src/releaseSmoke/google-services.json
          rm -f app/src/release/google-services.json
