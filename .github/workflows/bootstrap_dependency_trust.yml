name: Temporary Commercial Trust Bootstrap

on:
  pull_request:
    paths:
      - "app/**"
      - "config/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - ".github/workflows/bootstrap_dependency_trust.yml"

permissions:
  contents: read

jobs:
  generate:
    if: github.head_ref == 'agent/commercial-release-supply-chain'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout transition branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Android toolchain
        uses: ./.github/actions/android-setup

      - name: Generate Gradle trust state and static-analysis baselines
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          {
            ./gradlew help \
              --write-locks \
              --write-verification-metadata sha256 \
              --no-daemon --stacktrace

            ./gradlew :app:dependencies \
              --write-locks \
              --write-verification-metadata sha256 \
              --no-daemon --stacktrace

            ./gradlew :app:updateLintBaseline :app:detektBaseline \
              --write-locks \
              --write-verification-metadata sha256 \
              --no-daemon --stacktrace

            ./gradlew \
              :app:lintDebug \
              :app:lintStaging \
              :app:detekt \
              :app:testDebugUnitTest \
              :app:jacocoDebugUnitTestReport \
              :app:assembleDebug \
              :app:assembleStaging \
              :app:assembleReleaseSmoke \
              cyclonedxBom \
              --write-locks \
              --write-verification-metadata sha256 \
              --no-daemon --stacktrace
          } 2>&1 | tee commercial-trust-bootstrap.log

      - name: Upload generated trust state
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: commercial-trust-bootstrap-${{ github.run_id }}
          path: |
            **/gradle.lockfile
            gradle/verification-metadata.xml
            app/lint-baseline.xml
            config/detekt/baseline.xml
            commercial-trust-bootstrap.log
          if-no-files-found: warn
          retention-days: 3
