name: One-shot Stage 5 measurement applicator

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stage5_measurement_apply.yml"
      - ".github/workflows/stage5_measurement_codemod.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/localization-accessibility-commercial
          fetch-depth: 0

      - name: Execute the reviewed Stage 5 codemod
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          workflow = Path('.github/workflows/stage5_measurement_codemod.yml').read_text(
              encoding='utf-8'
          )
          marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          if workflow.count(marker) != 1 or workflow.count(end_marker) != 1:
              raise SystemExit('Unable to isolate the reviewed Stage 5 codemod')
          script = workflow.split(marker, 1)[1].split(end_marker, 1)[0]
          exec(compile(dedent(script), '<stage5-measurement-codemod>', 'exec'))
          PY

      - name: Verify and commit the complete Stage 5 package
        run: |
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 12
          ! grep -n "toDoubleOrNull()\|DecimalFormat(" \
            app/src/main/java/com/aqua/aqualight/ui/common/bottomsheet/TankSettingsEditorBottomSheet.kt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main app/src/test
          git commit -m "Harden locale measurement input and volume calculations"
          git push origin HEAD:agent/localization-accessibility-commercial
