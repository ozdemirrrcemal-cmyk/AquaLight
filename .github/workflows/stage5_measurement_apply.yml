name: One-shot Stage 5 temporary cleanup

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/stage5_measurement_apply.yml"

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/localization-accessibility-commercial
          fetch-depth: 0

      - name: Remove every Stage 5 temporary artifact
        run: |
          git rm -f \
            .github/workflows/stage5_measurement_apply.yml \
            .github/workflows/stage5_measurement_codemod.yml \
            tools/stage5_measurement_codemod.py \
            .stage5-codemod-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove Stage 5 temporary automation"
          git push origin HEAD:agent/localization-accessibility-commercial
