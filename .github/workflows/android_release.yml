name: Android Release CI/CD

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string
      include_apk:
        description: Include the optional signed APK in the final release package
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-ci-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
    -Dorg.gradle.daemon=false

jobs:
  quality:
    name: 01-04 Guard, quality, coverage and instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      release-tag: ${{ steps.quality.outputs.release-tag }}
      release-version: ${{ steps.quality.outputs.release-version }}
      release-commit: ${{ steps.quality.outputs.release-commit }}
      include-apk: ${{ steps.quality.outputs.include-apk }}
    env:
      CI: "true"
      AQL_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      AQL_INCLUDE_APK: ${{ github.event_name == 'workflow_dispatch' && inputs.include_apk || false }}
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: 01 Guard - checkout controlled release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: 01 Guard - validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeu
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "cmdline-tools;latest"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          chmod +x ./gradlew

      - name: 01-03 Guard, Lint/Detekt and unit coverage
        id: quality
        shell: bash
        env:
          AQL_FIREBASE_PRODUCTION_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_PRODUCTION_CONFIG_BASE64 }}
        run: bash tools/release_pipeline/guard_quality.sh

      - name: 04 Instrumentation - prepare minified release smoke
        shell: bash
        env:
          AQL_FIREBASE_PRODUCTION_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_PRODUCTION_CONFIG_BASE64 }}
        run: bash tools/release_pipeline/prepare_instrumentation.sh

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 04 Instrumentation - API 27
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 27
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot-save
            -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_release_smoke.sh 27

      - name: 04 Instrumentation - API 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot-save
            -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_release_smoke.sh 35

      - name: Upload pre-signing quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AquaLight-Pre-Signing-Quality-${{ steps.quality.outputs.release-tag }}
          path: |
            release-quality/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/detekt/**
            app/build/reports/coverage/test/debug/**
            app/build/reports/tests/testReleaseUnitTest/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            release-smoke-*.txt
            release-smoke-*.xml
            release-smoke-screens/**
          if-no-files-found: warn

      - name: Remove CI-only signing material
        if: always()
        run: rm -f release-key.jks

  release:
    name: 05-09 Signing, build, checksum, attestation and publication
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-release
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      AQL_RELEASE_TAG: ${{ needs.quality.outputs.release-tag }}
      AQL_RELEASE_VERSION: ${{ needs.quality.outputs.release-version }}
      AQL_RELEASE_COMMIT: ${{ needs.quality.outputs.release-commit }}
      AQL_INCLUDE_APK: ${{ needs.quality.outputs.include-apk }}
      AQL_PRODUCTION_RELEASE_ENABLED: ${{ vars.AQL_PRODUCTION_RELEASE_ENABLED }}
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.quality.outputs.release-tag }}

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install release SDK packages
        shell: bash
        run: |
          set -Eeu
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "cmdline-tools;latest"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          chmod +x ./gradlew

      - name: 05-06 Signing and release build
        shell: bash
        env:
          AQL_FIREBASE_PRODUCTION_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_PRODUCTION_CONFIG_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_SIGNING_CERT_SHA256: ${{ secrets.RELEASE_SIGNING_CERT_SHA256 }}
        run: bash tools/release_pipeline/build_release.sh

      - name: 07 Checksum - generate and verify SHA-256 manifests
        shell: bash
        run: bash tools/release_pipeline/checksum.sh

      - name: 08 SBOM - generate AAB SPDX JSON
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: final-release/artifacts/AquaLight-${{ needs.quality.outputs.release-version }}.aab
          format: spdx-json
          output-file: final-release/supply-chain/AquaLight-${{ needs.quality.outputs.release-version }}.aab.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: 08 SBOM - generate APK SPDX JSON
        if: ${{ needs.quality.outputs.include-apk == 'true' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: final-release/artifacts/AquaLight-${{ needs.quality.outputs.release-version }}.apk
          format: spdx-json
          output-file: final-release/supply-chain/AquaLight-${{ needs.quality.outputs.release-version }}.apk.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: 08 Provenance - attest AAB
        id: aab-provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: final-release/artifacts/AquaLight-${{ needs.quality.outputs.release-version }}.aab

      - name: 08 Provenance - attest AAB SBOM
        id: aab-sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: final-release/artifacts/AquaLight-${{ needs.quality.outputs.release-version }}.aab
          sbom-path: final-release/supply-chain/AquaLight-${{ needs.quality.outputs.release-version }}.aab.spdx.json

      - name: 08 Provenance - attest APK
        if: ${{ needs.quality.outputs.include-apk == 'true' }}
        id: apk-provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: final-release/artifacts/AquaLight-${{ needs.quality.outputs.release-version }}.apk

      - name: 08 Provenance - attest APK SBOM
        if: ${{ needs.quality.outputs.include-apk == 'true' }}
        id: apk-sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: final-release/artifacts/AquaLight-${{ needs.quality.outputs.release-version }}.apk
          sbom-path: final-release/supply-chain/AquaLight-${{ needs.quality.outputs.release-version }}.apk.spdx.json

      - name: 08 Provenance - materialize and verify evidence
        shell: bash
        env:
          AAB_PROVENANCE_BUNDLE: ${{ steps.aab-provenance.outputs.bundle-path }}
          AAB_SBOM_BUNDLE: ${{ steps.aab-sbom.outputs.bundle-path }}
          APK_PROVENANCE_BUNDLE: ${{ steps.apk-provenance.outputs.bundle-path }}
          APK_SBOM_BUNDLE: ${{ steps.apk-sbom.outputs.bundle-path }}
        run: bash tools/release_pipeline/materialize_evidence.sh

      - name: 09 Publish - verify complete release package
        shell: bash
        run: bash tools/release_pipeline/verify_publication.sh

      - name: 09 Publish - upload final commercial release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AquaLight-Release-${{ needs.quality.outputs.release-tag }}
          path: final-release/
          if-no-files-found: error
          retention-days: 90

      - name: Write release pipeline summary
        shell: bash
        run: |
          {
            echo "## AquaLight commercial release"
            echo
            echo "Release: \`${{ needs.quality.outputs.release-tag }}\`"
            echo
            echo "Enforced order: guard → lint/Detekt → unit test/coverage → instrumentation → signing → release build → checksum → SBOM/provenance → publication"
            echo
            echo "Verify the AAB attestation with:"
            echo
            echo "\`gh attestation verify AquaLight-${AQL_RELEASE_VERSION}.aab --repo ${GITHUB_REPOSITORY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup production signing material
        if: always()
        run: |
          rm -f release-key.jks
          rm -rf "${RUNNER_TEMP}/aqualight-signing"
