name: Android Commercial Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: android-commercial-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  identity:
    name: Release identity and main ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Require tag commit on main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Derive immutable Android version identity
        id: version
        run: python3 tools/release_version.py --tag "$GITHUB_REF_NAME" --verify-git-tags

  guard:
    name: 1 · Architecture and supply-chain guard
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run commercial guards
        run: bash tools/run_commercial_guards.sh

  lint:
    name: 2 · Android lint and Detekt
    needs: [identity, guard]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      FIREBASE_DEVELOPMENT_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_DEVELOPMENT_GOOGLE_SERVICES_JSON_BASE64 }}
      AQL_VERSION_NAME: ${{ needs.identity.outputs.version_name }}
      AQL_VERSION_CODE: ${{ needs.identity.outputs.version_code }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare development Firebase configuration
        run: python3 tools/ci/materialize_firebase_config.py --environment development --allow-ci-fixture
      - name: Run standard lint and Detekt
        run: |
          chmod +x gradlew
          ./gradlew lintDevelopmentDebug detektDevelopmentDebug --no-daemon --stacktrace
      - name: Remove generated Firebase configuration
        if: always()
        run: rm -f app/src/development/google-services.json

  unit-test:
    name: 3 · Unit tests and critical coverage
    needs: [identity, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 'true'
      FIREBASE_DEVELOPMENT_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_DEVELOPMENT_GOOGLE_SERVICES_JSON_BASE64 }}
      AQL_VERSION_NAME: ${{ needs.identity.outputs.version_name }}
      AQL_VERSION_CODE: ${{ needs.identity.outputs.version_code }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare development Firebase configuration
        run: python3 tools/ci/materialize_firebase_config.py --environment development --allow-ci-fixture
      - name: Run unit, dependency, and coverage gates
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:verifyFirebaseRuntimePolicy \
            testDevelopmentDebugUnitTest \
            jacocoCriticalCoverageReport \
            jacocoCriticalCoverageVerification \
            --no-daemon --stacktrace
      - name: Remove generated Firebase configuration
        if: always()
        run: rm -f app/src/development/google-services.json

  instrumentation:
    name: 4 · Instrumentation matrix
    needs: unit-test
    uses: ./.github/workflows/android_instrumentation.yml

  release:
    name: 5 · Signed production AAB, APK and attestations
    needs: [identity, instrumentation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      AQL_VERSION_NAME: ${{ needs.identity.outputs.version_name }}
      AQL_VERSION_CODE: ${{ needs.identity.outputs.version_code }}
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}
      FIREBASE_PRODUCTION_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_PRODUCTION_GOOGLE_SERVICES_JSON_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_SHA256: ${{ secrets.RELEASE_KEYSTORE_SHA256 }}
      RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Validate OTA release configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AQL_OTA_MANIFEST_PUBLIC_KEY_PEM"
          test -n "$AQL_OTA_MANIFEST_KEY_ID"
          grep -q -- "-----BEGIN PUBLIC KEY-----" <<< "$AQL_OTA_MANIFEST_PUBLIC_KEY_PEM"
          grep -q -- "-----END PUBLIC KEY-----" <<< "$AQL_OTA_MANIFEST_PUBLIC_KEY_PEM"
      - name: Prepare production Firebase configuration
        run: python3 tools/ci/materialize_firebase_config.py --environment production
      - name: Validate and materialize production signing key
        run: bash tools/ci/prepare_release_signing.sh
      - name: Build signed production AAB, APK, mapping and SBOM
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew \
            bundleProductionRelease \
            assembleProductionRelease \
            cyclonedxBom \
            --no-daemon --stacktrace
          AAB="app/build/outputs/bundle/productionRelease/app-production-release.aab"
          APK="app/build/outputs/apk/production/release/AquaLight-${AQL_VERSION_NAME}.apk"
          MAPPING="app/build/outputs/mapping/productionRelease/mapping.txt"
          SBOM="build/reports/cyclonedx/AquaLight-sbom.json"
          test -s "$AAB"
          test -s "$APK"
          test -s "$MAPPING"
          test -s "$SBOM"
          jarsigner -verify -strict "$AAB"
          apksigner verify --verbose --print-certs "$APK"
          python3 tools/firebase_telemetry_guard.py --scan-build-output
          mkdir -p release-dist
          cp "$AAB" "release-dist/AquaLight-${AQL_VERSION_NAME}.aab"
          cp "$APK" "release-dist/AquaLight-${AQL_VERSION_NAME}.apk"
          cp "$MAPPING" "release-dist/AquaLight-${AQL_VERSION_NAME}-mapping.txt"
          cp "$SBOM" "release-dist/AquaLight-${AQL_VERSION_NAME}-sbom.cdx.json"
          (cd release-dist && sha256sum * > SHA256SUMS && sha256sum --check SHA256SUMS)
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: release-dist/*
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AquaLight-${{ needs.identity.outputs.release_tag }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 90
      - name: Publish or update GitHub release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.identity.outputs.release_tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-dist/* --clobber
          else
            gh release create "$TAG" release-dist/* \
              --verify-tag \
              --generate-notes \
              --title "AquaLight ${AQL_VERSION_NAME}"
          fi
      - name: Remove production secrets from runner
        if: always()
        run: |
          rm -f "${AQL_RELEASE_KEYSTORE_PATH:-}"
          rm -f app/src/production/google-services.json
