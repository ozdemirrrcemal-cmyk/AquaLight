name: Android Release CI/CD

on:
  push:
    branches: ["release"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 📁 Repo'yu al
    - name: 🧩 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ☕ JDK 17 kurulumu
    - name: ☕ Install JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 🧰 Android SDK kurulumu
    - name: 🧰 Set up Android SDK
      uses: android-actions/setup-android@v3

    # 📦 Gerekli SDK paketleri
    - name: 📦 Install SDK packages
      run: |
        sdkmanager --update
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

    # 🔑 Keystore oluştur (köke)
    - name: 🔑 Set up release keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-key.jks
        echo "✅ release-key.jks oluşturuldu (proje kökünde)"

    # ⚙️ Gradle izinleri
    - name: ⚙️ Grant permission for Gradle
      run: chmod +x ./gradlew

    # 🧹 Temizlik (proje + cache)
    - name: 🧹 Clean Gradle & project
      run: |
        rm -rf ~/.gradle/caches ~/.gradle/daemon ~/.gradle/native ~/.gradle/wrapper
        ./gradlew clean --no-daemon

    # 🔢 Versiyon artırma
    - name: 📈 Increment versionCode and versionName
      id: version
      run: |
        VERSION_FILE="app/build.gradle"
        OLD_VERSION_CODE=$(grep "versionCode" $VERSION_FILE | awk '{print $2}')
        OLD_VERSION_NAME=$(grep "versionName" $VERSION_FILE | awk -F\" '{print $2}')
        NEW_VERSION_CODE=$((OLD_VERSION_CODE + 1))
        IFS='.' read -r MAJOR MINOR PATCH <<< "${OLD_VERSION_NAME}"
        NEW_VERSION_NAME="${MAJOR}.${MINOR}.$((PATCH + 1))"
        sed -i "s/versionCode.*/versionCode ${NEW_VERSION_CODE}/" $VERSION_FILE
        sed -i "s/versionName \".*\"/versionName \"${NEW_VERSION_NAME}\"/" $VERSION_FILE
        echo "version_name=$NEW_VERSION_NAME" >> $GITHUB_OUTPUT
        echo "🔢 Yeni sürüm: $NEW_VERSION_NAME ($NEW_VERSION_CODE)"

    # 🚀 Release APK derle
    - name: 🚀 Build Signed Release APK
      run: ./gradlew assembleRelease --stacktrace --no-daemon

    # ✅ APK doğrula
    - name: ✅ Verify release output
      run: |
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          echo "✅ Release APK başarıyla oluşturuldu!"
        else
          echo "❌ APK bulunamadı!"
          exit 1
        fi

    # 🏷️ Tag oluştur
    - name: 🏷️ Create and push version tag
      run: |
        VERSION=${{ steps.version.outputs.version_name }}
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git tag -a "v${VERSION}" -m "Release ${VERSION}"
        git push origin "v${VERSION}"

    # 📤 APK’yı yükle
    - name: 📤 Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: AquaLight-${{ steps.version.outputs.version_name }}
        path: app/build/outputs/apk/release/app-release.apk