name: Android Release CI/CD

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string
      include_apk:
        description: Include the optional signed APK in the final release package
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-ci-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
    -Dorg.gradle.daemon=false

jobs:
  quality:
    name: 01-03 Guard, dependency, static quality and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production-release
    permissions:
      contents: read
      issues: read
    outputs:
      release-tag: ${{ steps.quality.outputs.release-tag }}
      release-version: ${{ steps.quality.outputs.release-version }}
      release-commit: ${{ steps.quality.outputs.release-commit }}
      include-apk: ${{ steps.quality.outputs.include-apk }}
    env:
      CI: "true"
      AQL_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      AQL_INCLUDE_APK: ${{ github.event_name == 'workflow_dispatch' && inputs.include_apk || false }}
      AQL_FIREBASE_DEBUG_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_DEBUG_CONFIG_BASE64 }}
      AQL_FIREBASE_STAGING_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_STAGING_CONFIG_BASE64 }}
      AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64 }}
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: 01 Guard - checkout controlled release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: 01 Guard - validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeu
          sdkmanager_path="$(readlink -f "$(command -v sdkmanager)")"
          test -x "$sdkmanager_path"
          case "$sdkmanager_path" in
            "${ANDROID_SDK_ROOT}/cmdline-tools/"*/bin/sdkmanager) ;;
            *)
              echo "Untrusted sdkmanager path: $sdkmanager_path" >&2
              exit 1
              ;;
          esac
          if [[ "$sdkmanager_path" == \
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            echo "Mutable cmdline-tools/latest must not drive commercial CI" >&2
            exit 1
          fi
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          set +o pipefail
          yes 2>/dev/null | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" "platform-tools" "platforms;android-36"
          "$sdkmanager_path" "build-tools;36.0.0" \
            || "$sdkmanager_path" "build-tools;36.0.1"
          for package in \
            "platforms;android-27" \
            "system-images;android-27;default;x86_64" \
            "platforms;android-37" \
            "system-images;android-37;default;x86_64"; do
            "$sdkmanager_path" --install "$package"
          done
          test -s "${ANDROID_SDK_ROOT}/platforms/android-27/android.jar"
          test -s "${ANDROID_SDK_ROOT}/platforms/android-37/android.jar"
          test -s \
            "${ANDROID_SDK_ROOT}/system-images/android-27/default/x86_64/package.xml"
          test -s \
            "${ANDROID_SDK_ROOT}/system-images/android-37/default/x86_64/package.xml"
          chmod +x ./gradlew

      - name: 01-03 Guard, Lint/Detekt and unit coverage
        id: quality
        shell: bash
        env:
          AQL_FIREBASE_PRODUCTION_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_PRODUCTION_CONFIG_BASE64 }}
        run: bash tools/release_pipeline/guard_quality.sh

      - name: Inventory open release blockers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            > release-quality/open-issues-pages.json
          python3 tools/verify_release_blockers.py \
            --issues release-quality/open-issues-pages.json \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${{ steps.quality.outputs.release-commit }}" \
            --summary release-quality/release-blocker-inventory.json

      - name: Upload pre-security quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AquaLight-Pre-Security-Quality-${{ steps.quality.outputs.release-tag }}
          path: |
            release-quality/**
            app/build/reports/stage14/detekt-policy-summary.json
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.xml
            app/build/reports/detekt/**
            app/build/reports/coverage/test/debug/**
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/tests/testStagingUnitTest/**
            app/build/reports/tests/testReleaseSmokeUnitTest/**
            app/build/reports/tests/testReleaseUnitTest/**
            app/build/test-results/testDebugUnitTest/**
            app/build/test-results/testStagingUnitTest/**
            app/build/test-results/testReleaseSmokeUnitTest/**
            app/build/test-results/testReleaseUnitTest/**
          if-no-files-found: warn

      - name: Remove CI-only quality material
        if: always()
        shell: bash
        run: |
          rm -f release-key.jks
          rm -f app/src/debug/google-services.json
          rm -f app/src/staging/google-services.json
          rm -f app/src/releaseSmoke/google-services.json
          rm -f app/src/release/google-services.json

  security:
    name: 04 Blocking CodeQL security gate
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production-release
    permissions:
      actions: read
      contents: read
      security-events: write
    env:
      CI: "true"
      AQL_RELEASE_TAG: ${{ needs.quality.outputs.release-tag }}
      AQL_RELEASE_COMMIT: ${{ needs.quality.outputs.release-commit }}
      AQL_FIREBASE_DEBUG_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_DEBUG_CONFIG_BASE64 }}
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.quality.outputs.release-tag }}

      - name: Verify security scan commit identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${AQL_RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${AQL_RELEASE_COMMIT}" ]]

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeu
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          chmod +x ./gradlew

      - name: Verify CodeQL Firebase input
        shell: bash
        run: |
          set -Eeuo pipefail
          value="${AQL_FIREBASE_DEBUG_CONFIG_BASE64:-}"
          [[ -n "${value//[[:space:]]/}" ]]

      - name: Initialize CodeQL
        uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Build uncached application for CodeQL extraction
        shell: bash
        run: |
          set -o pipefail
          ./gradlew clean assembleDebug \
            --no-daemon \
            --no-build-cache \
            --rerun-tasks \
            --stacktrace \
            2>&1 | tee codeql-extraction-build.log

      - name: Analyze and wait for CodeQL processing
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: /language:java-kotlin/commercial-release
          output: release-security/codeql-results
          upload-database: false
          wait-for-processing: true

      - name: Enforce zero critical and high findings
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/verify_codeql_sarif.py \
            --sarif-dir release-security/codeql-results \
            --commit "${AQL_RELEASE_COMMIT}" \
            --summary release-security/codeql-summary.json

      - name: Upload blocking CodeQL evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AquaLight-CodeQL-${{ needs.quality.outputs.release-tag }}
          path: |
            release-security/**
            codeql-extraction-build.log
          if-no-files-found: error
          retention-days: 90

      - name: Remove generated Firebase configuration
        if: always()
        run: rm -f app/src/debug/google-services.json

  instrumentation:
    name: 05 Instrumentation validation
    needs:
      - quality
      - security
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: production-release
    env:
      CI: "true"
      AQL_RELEASE_TAG: ${{ needs.quality.outputs.release-tag }}
      AQL_RELEASE_COMMIT: ${{ needs.quality.outputs.release-commit }}
      AQL_FIREBASE_DEBUG_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_DEBUG_CONFIG_BASE64 }}
      AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64 }}
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.quality.outputs.release-tag }}

      - name: Verify instrumentation commit identity
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "${AQL_RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "${AQL_RELEASE_COMMIT}" ]]

      - name: Validate Gradle Wrapper
        uses: gradle/wrapper-validation-action@b5418f5a58f5fd2eb486dd7efb368fe7be7eae45 # v2

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -Eeu
          sdkmanager_path="$(readlink -f "$(command -v sdkmanager)")"
          test -x "$sdkmanager_path"
          case "$sdkmanager_path" in
            "${ANDROID_SDK_ROOT}/cmdline-tools/"*/bin/sdkmanager) ;;
            *)
              echo "Untrusted sdkmanager path: $sdkmanager_path" >&2
              exit 1
              ;;
          esac
          if [[ "$sdkmanager_path" == \
            "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]]; then
            echo "Mutable cmdline-tools/latest must not drive commercial CI" >&2
            exit 1
          fi
          echo "$(dirname "$sdkmanager_path")" >> "$GITHUB_PATH"
          set +o pipefail
          yes 2>/dev/null | "$sdkmanager_path" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_path" "platform-tools" "platforms;android-36"
          "$sdkmanager_path" "build-tools;36.0.0" \
            || "$sdkmanager_path" "build-tools;36.0.1"
          for package in \
            "platforms;android-27" \
            "system-images;android-27;default;x86_64" \
            "platforms;android-37" \
            "system-images;android-37;default;x86_64"; do
            "$sdkmanager_path" --install "$package"
          done
          test -s "${ANDROID_SDK_ROOT}/platforms/android-27/android.jar"
          test -s "${ANDROID_SDK_ROOT}/platforms/android-37/android.jar"
          test -s \
            "${ANDROID_SDK_ROOT}/system-images/android-27/default/x86_64/package.xml"
          test -s \
            "${ANDROID_SDK_ROOT}/system-images/android-37/default/x86_64/package.xml"
          chmod +x ./gradlew

      - name: Prepare minified release smoke
        shell: bash
        run: bash tools/release_pipeline/prepare_instrumentation.sh

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation - API 27
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 27
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot-save
            -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_release_smoke.sh 27

      - name: Instrumentation - API 37
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 37
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot-save
            -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_release_smoke.sh 37

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AquaLight-Instrumentation-${{ needs.quality.outputs.release-tag }}
          path: |
            release-quality/**
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            release-smoke-*.txt
            release-smoke-*.xml
            release-smoke-*.json
            release-smoke-screens/**
            stage14-evidence/**
          if-no-files-found: warn

      - name: Remove CI-only material
        if: always()
        shell: bash
        run: |
          rm -f release-key.jks
          rm -f app/src/debug/google-services.json
          rm -f app/src/staging/google-services.json
          rm -f app/src/releaseSmoke/google-services.json
          rm -f app/src/release/google-services.json

  release:
    name: 06-10 Signing, build, checksum, attestation and publication
    needs:
      - quality
      - security
      - instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production-release
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      issues: read
    env:
      AQL_RELEASE_TAG: ${{ needs.quality.outputs.release-tag }}
      AQL_RELEASE_VERSION: ${{ needs.quality.outputs.release-version }}
      AQL_RELEASE_COMMIT: ${{ needs.quality.outputs.release-commit }}
      AQL_INCLUDE_APK: ${{ needs.quality.outputs.include-apk }}
      AQL_PRODUCTION_RELEASE_ENABLED: ${{ vars.AQL_PRODUCTION_RELEASE_ENABLED }}
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: Checkout verified release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.quality.outputs.release-tag }}

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "15859902"

      - name: Install release SDK packages
        shell: bash
        run: |
          set -Eeu
          set +o pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          chmod +x ./gradlew

      - name: Download verified CodeQL evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: AquaLight-CodeQL-${{ needs.quality.outputs.release-tag }}
          path: final-release/supply-chain/security/codeql

      - name: Download verified quality evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: AquaLight-Pre-Security-Quality-${{ needs.quality.outputs.release-tag }}
          path: final-release/validation/quality

      - name: Download verified instrumentation evidence
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: AquaLight-Instrumentation-${{ needs.quality.outputs.release-tag }}
          path: final-release/validation/instrumentation

      - name: Reverify CodeQL evidence identity
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/verify_codeql_sarif.py \
            --sarif-dir final-release/supply-chain/security/codeql \
            --commit "${AQL_RELEASE_COMMIT}" \
            --summary final-release/supply-chain/security/codeql/codeql-summary.json

      - name: Verify protected manual acceptance evidence
        shell: bash
        env:
          AQL_STAGE14_MANUAL_ACCEPTANCE_BASE64: ${{ secrets.AQL_STAGE14_MANUAL_ACCEPTANCE_BASE64 }}
        run: |
          set -Eeuo pipefail
          value="${AQL_STAGE14_MANUAL_ACCEPTANCE_BASE64:-}"
          [[ -n "${value//[[:space:]]/}" ]]
          umask 077
          acceptance="${RUNNER_TEMP}/stage14-manual-acceptance.json"
          printf '%s' "$value" | base64 --decode > "$acceptance"
          python3 tools/verify_manual_acceptance.py \
            --acceptance "$acceptance" \
            --release-tag "${AQL_RELEASE_TAG}" \
            --commit "${AQL_RELEASE_COMMIT}" \
            --summary final-release/validation/manual-acceptance.json
          rm -f "$acceptance"

      - name: 06-07 Signing and release build
        shell: bash
        env:
          AQL_FIREBASE_DEBUG_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_DEBUG_CONFIG_BASE64 }}
          AQL_FIREBASE_STAGING_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_STAGING_CONFIG_BASE64 }}
          AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_RELEASE_SMOKE_CONFIG_BASE64 }}
          AQL_FIREBASE_PRODUCTION_CONFIG_BASE64: ${{ secrets.AQL_FIREBASE_PRODUCTION_CONFIG_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_SIGNING_CERT_SHA256: ${{ secrets.RELEASE_SIGNING_CERT_SHA256 }}
        run: bash tools/release_pipeline/build_release.sh

      - name: Remove generated Firebase configurations after release build
        if: always()
        shell: bash
        run: |
          rm -f app/src/debug/google-services.json
          rm -f app/src/staging/google-services.json
          rm -f app/src/releaseSmoke/google-services.json
          rm -f app/src/release/google-services.json

      - name: 07 Checksum - generate and verify SHA-256 manifests
        shell: bash
        run: bash tools/release_pipeline/checksum.sh

      - name: 08 SBOM - generate AAB SPDX JSON
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: final-release/artifacts/AquaLight-${{ needs.quality.outputs.release-version }}.aab
          format: spdx-json
          output-file: final-release/supply-chain/AquaLight-${{ needs.quality.outputs.release-version }}.aab.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: 08 SBOM - generate APK SPDX JSON
        if: ${{ needs.quality.outputs.include-apk == 'true' }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: final-release/artifacts/AquaLight-${{ needs.quality.outputs.release-version }}.apk
          format: spdx-json
          output-file: final-release/supply-chain/AquaLight-${{ needs.quality.outputs.release-version }}.apk.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: 08 Provenance - attest AAB
        id: aab-provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: final-release/artifacts/AquaLight-${{ needs.quality.outputs.release-version }}.aab

      - name: 08 Provenance - attest AAB SBOM
        id: aab-sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: final-release/artifacts/AquaLight-${{ needs.quality.outputs.release-version }}.aab
          sbom-path: final-release/supply-chain/AquaLight-${{ needs.quality.outputs.release-version }}.aab.spdx.json

      - name: 08 Provenance - attest APK
        if: ${{ needs.quality.outputs.include-apk == 'true' }}
        id: apk-provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: final-release/artifacts/AquaLight-${{ needs.quality.outputs.release-version }}.apk

      - name: 08 Provenance - attest APK SBOM
        if: ${{ needs.quality.outputs.include-apk == 'true' }}
        id: apk-sbom
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: final-release/artifacts/AquaLight-${{ needs.quality.outputs.release-version }}.apk
          sbom-path: final-release/supply-chain/AquaLight-${{ needs.quality.outputs.release-version }}.apk.spdx.json

      - name: Recheck release blockers immediately before final evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p final-release/validation
          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
            > final-release/validation/open-issues-pages.json
          python3 tools/verify_release_blockers.py \
            --issues final-release/validation/open-issues-pages.json \
            --repository "${GITHUB_REPOSITORY}" \
            --commit "${AQL_RELEASE_COMMIT}" \
            --summary final-release/validation/release-blocker-inventory.json

      - name: 08 Provenance - materialize and verify evidence
        shell: bash
        env:
          AAB_PROVENANCE_BUNDLE: ${{ steps.aab-provenance.outputs.bundle-path }}
          AAB_SBOM_BUNDLE: ${{ steps.aab-sbom.outputs.bundle-path }}
          APK_PROVENANCE_BUNDLE: ${{ steps.apk-provenance.outputs.bundle-path }}
          APK_SBOM_BUNDLE: ${{ steps.apk-sbom.outputs.bundle-path }}
        run: bash tools/release_pipeline/materialize_evidence.sh

      - name: 09 Publish - verify complete release package
        shell: bash
        run: bash tools/release_pipeline/verify_publication.sh

      - name: 09 Publish - upload final commercial release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AquaLight-Release-${{ needs.quality.outputs.release-tag }}
          path: final-release/
          if-no-files-found: error
          retention-days: 90

      - name: Write release pipeline summary
        shell: bash
        run: |
          {
            echo "## AquaLight commercial release"
            echo
            echo "Release: \`${{ needs.quality.outputs.release-tag }}\`"
            echo
            echo "Stage 14 policy: \`config/commercial/stage14-validation-policy.json\` (embedded by SHA-256 in final evidence)"
            echo
            echo "Verify the AAB attestation with:"
            echo
            echo "\`gh attestation verify AquaLight-${AQL_RELEASE_VERSION}.aab --repo ${GITHUB_REPOSITORY}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup production signing and Firebase material
        if: always()
        shell: bash
        run: |
          rm -f release-key.jks
          rm -f app/src/debug/google-services.json
          rm -f app/src/staging/google-services.json
          rm -f app/src/releaseSmoke/google-services.json
          rm -f app/src/release/google-services.json
          rm -rf "${RUNNER_TEMP}/aqualight-signing"
