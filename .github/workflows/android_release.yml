name: Android Release CI/CD

on:
  push:
    branches: ["release"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 📁 Repo'yu al
    - name: 🧩 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # ☕ JDK 17 kurulumu
    - name: ☕ Install JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # 🧰 Android SDK kurulumu
    - name: 🧰 Set up Android SDK
      uses: android-actions/setup-android@v3

    # 📦 Gerekli SDK paketleri
    - name: 📦 Install SDK packages
      run: |
        sdkmanager --update
        sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

    # 🔑 Keystore oluştur (köke)
    - name: 🔑 Set up release keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-key.jks
        echo "✅ release-key.jks oluşturuldu (proje kökünde)"

    # ⚙️ Gradle izinleri
    - name: ⚙️ Grant permission for Gradle
      run: chmod +x ./gradlew

    # 🧹 Temizlik (proje + cache)
    - name: 🧹 Clean Gradle & project
      run: |
        rm -rf ~/.gradle/caches ~/.gradle/daemon ~/.gradle/native ~/.gradle/wrapper
        ./gradlew clean --no-daemon

    # 🚀 Release APK derle
    - name: 🚀 Build Signed Release APK
      env:
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: ./gradlew assembleRelease --stacktrace --no-daemon

    # ✅ APK doğrula
    - name: ✅ Verify release output
      run: |
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          echo "✅ Release APK başarıyla oluşturuldu!"
        else
          echo "❌ APK bulunamadı!"
          exit 1
        fi

    # 📤 APK’yı yükle
    - name: 📤 Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: AquaLight-ManualBuild
        path: app/build/outputs/apk/release/app-release.apk