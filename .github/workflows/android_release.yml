name: Android Controlled Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing annotated release tag (vMAJOR.MINOR.PATCH or prerelease form)"
        required: true
        type: string
      publish_release:
        description: "Create or update the GitHub Release after all gates pass"
        required: true
        default: false
        type: boolean
      include_apk:
        description: "Also build and publish the signed APK"
        required: true
        default: true
        type: boolean

concurrency:
  group: android-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: 1 · Guard and release contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish_release: ${{ steps.release_mode.outputs.publish_release }}
      include_apk: ${{ steps.release_mode.outputs.include_apk }}
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Resolve release mode
        id: release_mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUBLISH_RELEASE: ${{ inputs.publish_release }}
          INPUT_INCLUDE_APK: ${{ inputs.include_apk }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "push" ]]; then
            echo "publish_release=true" >> "$GITHUB_OUTPUT"
            echo "include_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish_release=${INPUT_PUBLISH_RELEASE:-false}" >> "$GITHUB_OUTPUT"
            echo "include_apk=${INPUT_INCLUDE_APK:-true}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate tag target and derive Android version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          VERSION_CODE_BASE: ${{ vars.AQL_VERSION_CODE_BASE }}
        run: |
          set -euo pipefail
          python3 -m unittest tools/release/test_versioning.py

          if [[ "$EVENT_NAME" == "push" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="$INPUT_RELEASE_TAG"
          fi

          if [[ ! "${VERSION_CODE_BASE:-}" =~ ^[0-9]+$ ]]; then
            echo "AQL_VERSION_CODE_BASE repository variable must be a non-negative integer." >&2
            exit 1
          fi

          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG" || {
            echo "Release tag does not exist: $RELEASE_TAG" >&2
            exit 1
          }
          if [[ "$(git cat-file -t "refs/tags/$RELEASE_TAG")" != "tag" ]]; then
            echo "Release tag must be annotated: $RELEASE_TAG" >&2
            exit 1
          fi

          git fetch --no-tags origin main:refs/remotes/origin/main
          TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main || {
            echo "Release tag must point to a commit reachable from main." >&2
            exit 1
          }

          python3 tools/release/versioning.py \
            --tag "$RELEASE_TAG" \
            --run-number "$GITHUB_RUN_NUMBER" \
            --version-code-base "$VERSION_CODE_BASE" \
            --github-output "$GITHUB_OUTPUT" \
            --json-output release-version.json

      - name: Run architecture and policy guards
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/architecture_guard.py
          python3 tools/session_startup_guard.py
          python3 tools/composition_root_guard.py
          python3 tools/ui_dependency_construction_guard.py
          python3 tools/device_application_boundary_guard.py
          python3 tools/device_root_application_boundary_guard.py
          python3 tools/tank_device_assignment_boundary_guard.py
          python3 tools/aquarium_application_boundary_guard.py
          python3 tools/care_application_boundary_guard.py
          python3 tools/provisioning_discovery_boundary_guard.py
          python3 tools/provisioning_progress_boundary_guard.py
          python3 tools/provisioning_commit_recovery_guard.py
          python3 tools/navigation_guard.py
          python3 tools/ws_protocol_guard.py
          python3 tools/permission_architecture_guard.py
          python3 tools/notification_reminder_architecture_guard.py
          python3 tools/process_safe_feedback_guard.py
          python3 tools/stage9_feedback_media_guard.py
          python3 tools/firebase_telemetry_guard.py
          python3 tools/privacy_legal_guard.py
          python3 tools/design_system_resource_guard.py
          python3 tools/localization_accessibility_guard.py

      - name: Verify immutable Actions and dependency trust state
        shell: bash
        env:
          PUBLISH_RELEASE: ${{ steps.release_mode.outputs.publish_release }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            args+=(--strict-dependency-state)
          fi
          python3 tools/ci/verify_supply_chain_state.py "${args[@]}"

      - name: Upload release contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-contract-${{ github.run_number }}
          path: release-version.json
          if-no-files-found: error
          retention-days: 30

  lint:
    name: 2 · Android lint and Detekt
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.guard.outputs.release_tag }}
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          chmod +x ./gradlew

      - name: Run standard Android lint and Detekt
        env:
          AQL_VERSION_NAME: ${{ needs.guard.outputs.version_name }}
          AQL_VERSION_CODE: ${{ needs.guard.outputs.version_code }}
        run: ./gradlew lintRelease detekt --no-daemon --stacktrace

      - name: Upload lint and Detekt reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-lint-detekt-${{ github.run_number }}
          path: |
            **/build/reports/lint-results-*
            **/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 30

  unit_test:
    name: 3 · Unit tests and critical coverage
    needs: [guard, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.guard.outputs.release_tag }}
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          chmod +x ./gradlew

      - name: Run unit tests and enforce critical coverage
        env:
          AQL_VERSION_NAME: ${{ needs.guard.outputs.version_name }}
          AQL_VERSION_CODE: ${{ needs.guard.outputs.version_code }}
        run: >-
          ./gradlew testDebugUnitTest
          jacocoDebugUnitTestReport
          jacocoDebugCoverageVerification
          --no-daemon --stacktrace

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-unit-coverage-${{ github.run_number }}
          path: |
            **/build/reports/tests/testDebugUnitTest/**
            **/build/reports/jacoco/**
          if-no-files-found: ignore
          retention-days: 30

  instrumentation:
    name: 4 · Instrumentation API ${{ matrix.api-level }}
    needs: [guard, unit_test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [27, 35]
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.guard.outputs.release_tag }}
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install compile SDK and prepare Gradle
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36"
          chmod +x ./gradlew

      - name: Verify release-smoke runner contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "connectedDebugAndroidTest" tools/run_release_smoke.sh
          grep -Fq "bash tools/verify_uninstall_clears_data.sh" tools/run_release_smoke.sh
          grep -Fq "RELEASE_SMOKE_PASS" tools/run_release_smoke.sh
          grep -Fq "ReleaseSmokeActivity" tools/run_release_smoke.sh
          grep -Fq "AccountDeletionProcessDeathSmokeActivity" tools/run_release_smoke.sh
          grep -Fq "ACCOUNT_DELETION_PROCESS_DEATH_PASS" tools/run_release_smoke.sh
          grep -Fq "auth-confirmed-before-checkpoint" tools/run_release_smoke.sh
          grep -Fq "aqua_smoke_profile" tools/run_release_smoke.sh
          grep -Fq "large-font-light" tools/run_release_smoke.sh
          grep -Fq "rtl-light" tools/run_release_smoke.sh

      - name: Generate CI-only release keystore
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -noprompt \
            -keystore release-key.jks \
            -storepass aqualight-ci \
            -alias aqualight-ci \
            -keypass aqualight-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=AquaLight CI,O=AquaLight,C=TR"

      - name: Build minified release-smoke APK
        env:
          AQL_VERSION_NAME: ${{ needs.guard.outputs.version_name }}
          AQL_VERSION_CODE: ${{ needs.guard.outputs.version_code }}
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          ./gradlew assembleReleaseSmoke --no-daemon --stacktrace \
            2>&1 | tee assemble-release-smoke.log
          SMOKE_APK="$(find app/build/outputs/apk/releaseSmoke -type f -name '*.apk' | head -n 1)"
          test -n "$SMOKE_APK"
          test -s "$SMOKE_APK"
          printf '%s\n' "$SMOKE_APK" > release-smoke-apk-path.txt

      - name: Enable KVM group permissions
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumentation and minified release smoke
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot-save
            -noaudio -no-boot-anim -camera-back none
          script: bash tools/run_release_smoke.sh "${{ matrix.api-level }}"

      - name: Upload instrumentation and smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-instrumentation-api-${{ matrix.api-level }}-${{ github.run_number }}
          path: |
            app/build/reports/androidTests/connected/**
            app/build/outputs/androidTest-results/connected/**
            assemble-release-smoke.log
            release-smoke-*.txt
            release-smoke-*.xml
            release-smoke-screens/**
          if-no-files-found: ignore
          retention-days: 30

      - name: Remove CI-only release keystore
        if: always()
        run: rm -f release-key.jks

  release_build:
    name: 5 · Signed commercial release
    needs: [guard, lint, unit_test, instrumentation]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ needs.guard.outputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          chmod +x ./gradlew

      - name: Validate and materialize release signing key
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_KEYSTORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required production secret is missing: $variable" >&2
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/aqualight-release.jks"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null

          echo "RELEASE_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Materialize production Firebase configuration
        env:
          FIREBASE_PRODUCTION_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_PRODUCTION_GOOGLE_SERVICES_JSON_BASE64 }}
        run: >-
          python3 tools/ci/materialize_firebase_config.py
          --environment production
          --expected-package com.aqua.aqualight
          --output app/google-services.json

      - name: Verify OTA manifest signature configuration
        shell: bash
        env:
          AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
          AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "${AQL_OTA_MANIFEST_PUBLIC_KEY_PEM:-}"
          test -n "${AQL_OTA_MANIFEST_KEY_ID:-}"
          [[ "$AQL_OTA_MANIFEST_KEY_ID" == "aql-ota-manifest-2026-01" ]]
          grep -q -- "-----BEGIN PUBLIC KEY-----" <<< "$AQL_OTA_MANIFEST_PUBLIC_KEY_PEM"
          grep -q -- "-----END PUBLIC KEY-----" <<< "$AQL_OTA_MANIFEST_PUBLIC_KEY_PEM"

      - name: Build signed AAB, optional APK, mapping and SBOM
        shell: bash
        env:
          AQL_VERSION_NAME: ${{ needs.guard.outputs.version_name }}
          AQL_VERSION_CODE: ${{ needs.guard.outputs.version_code }}
          AQL_ENFORCE_RELEASE_CONFIGURATION: "true"
          AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
          AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          INCLUDE_APK: ${{ needs.guard.outputs.include_apk }}
        run: |
          set -euo pipefail
          tasks=(bundleRelease cyclonedxBom)
          if [[ "$INCLUDE_APK" == "true" ]]; then
            tasks+=(assembleRelease)
          fi
          ./gradlew "${tasks[@]}" --no-daemon --stacktrace
          ./gradlew :app:verifyFirebaseRuntimePolicy --no-daemon --stacktrace
          python3 tools/firebase_telemetry_guard.py --scan-build-output

      - name: Verify signatures and package release evidence
        id: package
        shell: bash
        env:
          VERSION_NAME: ${{ needs.guard.outputs.version_name }}
          INCLUDE_APK: ${{ needs.guard.outputs.include_apk }}
        run: |
          set -euo pipefail
          AAB_SOURCE="app/build/outputs/bundle/release/app-release.aab"
          APK_SOURCE="app/build/outputs/apk/release/AquaLight.apk"
          MAPPING_SOURCE="app/build/outputs/mapping/release/mapping.txt"
          SBOM_SOURCE="build/reports/cyclonedx/bom.json"

          test -s "$AAB_SOURCE"
          test -s "$MAPPING_SOURCE"
          test -s "$SBOM_SOURCE"
          jarsigner -verify -verbose -certs "$AAB_SOURCE"

          DIST_DIR="dist/$VERSION_NAME"
          mkdir -p "$DIST_DIR"
          AAB_DEST="$DIST_DIR/AquaLight-$VERSION_NAME.aab"
          SBOM_DEST="$DIST_DIR/AquaLight-$VERSION_NAME.cdx.json"
          cp "$AAB_SOURCE" "$AAB_DEST"
          cp "$MAPPING_SOURCE" "$DIST_DIR/mapping-$VERSION_NAME.txt"
          cp "$SBOM_SOURCE" "$SBOM_DEST"

          if [[ "$INCLUDE_APK" == "true" ]]; then
            test -s "$APK_SOURCE"
            apksigner verify --verbose --print-certs "$APK_SOURCE"
            cp "$APK_SOURCE" "$DIST_DIR/AquaLight-$VERSION_NAME.apk"
          fi

          (
            cd "$DIST_DIR"
            sha256sum -- * > SHA256SUMS
          )

          echo "dist_dir=$DIST_DIR" >> "$GITHUB_OUTPUT"
          echo "aab_path=$AAB_DEST" >> "$GITHUB_OUTPUT"
          echo "sbom_path=$SBOM_DEST" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$DIST_DIR/SHA256SUMS" >> "$GITHUB_OUTPUT"

      - name: Generate build provenance attestation
        if: needs.guard.outputs.publish_release == 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: ${{ steps.package.outputs.checksum_path }}

      - name: Generate SBOM attestation for AAB
        if: needs.guard.outputs.publish_release == 'true'
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: ${{ steps.package.outputs.aab_path }}
          sbom-path: ${{ steps.package.outputs.sbom_path }}

      - name: Upload signed release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AquaLight-${{ needs.guard.outputs.version_name }}
          path: ${{ steps.package.outputs.dist_dir }}/**
          if-no-files-found: error
          retention-days: 90

      - name: Create or update GitHub Release
        if: needs.guard.outputs.publish_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.guard.outputs.release_tag }}
          VERSION_NAME: ${{ needs.guard.outputs.version_name }}
          PRERELEASE: ${{ needs.guard.outputs.prerelease }}
          DIST_DIR: ${{ steps.package.outputs.dist_dir }}
        run: |
          set -euo pipefail
          release_flags=(--verify-tag --title "AquaLight $VERSION_NAME" --generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            release_flags+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DIST_DIR"/* --clobber
          else
            gh release create "$RELEASE_TAG" "$DIST_DIR"/* "${release_flags[@]}"
          fi

      - name: Cleanup production material
        if: always()
        shell: bash
        run: |
          rm -f "${RELEASE_KEYSTORE_FILE:-}"
          rm -f app/google-services.json
