name: Android Release CI/CD

on:
  push:
    branches: ["release"]

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8" -Dorg.gradle.daemon=false

    steps:
      # 📁 Repo'yu al
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ☕ JDK 17 kurulumu
      - name: ☕ Install JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 🧰 Android SDK kurulumu
      - name: 🧰 Set up Android SDK
        uses: android-actions/setup-android@v3

      # 📦 SDK paketleri
      - name: 📦 Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --update
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "cmdline-tools;latest"

      # 🔒 Gradle build-cache
      - name: ⚡ Cache Gradle build-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-1
          key: ${{ runner.os }}-gradle-buildcache-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-buildcache-

      # 🔑 Release keystore oluştur
      - name: 🔑 Set up release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > release-key.jks
          echo "✅ release-key.jks oluşturuldu (proje kökünde)"

      # ⚙️ Gradle izinleri
      - name: ⚙️ Grant permission for Gradle
        run: chmod +x ./gradlew

      # 🧹 Manuel cache temizliği (isteğe bağlı)
      - name: 🧹 Optional cache cleanup
        if: contains(github.event.head_commit.message, 'clean')
        run: |
          echo "🧽 Commit mesajında 'clean' algılandı — build cache temizleniyor..."
          rm -rf ~/.gradle/caches ~/.gradle/daemon ~/.gradle/native ~/.gradle/wrapper app/build build

      # ⚡ Hızlı temizlik
      - name: ⚡ Quick project clean
        run: ./gradlew clean --no-daemon

      # 🚀 Release APK derle
      - name: 🚀 Build Signed Release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      # ✅ APK doğrula
      - name: ✅ Verify release output
        run: |
          echo "📂 Çıktı dizini:"
          ls -la app/build/outputs/apk/release || true
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "✅ Release APK başarıyla oluşturuldu!"
          else
            echo "❌ APK bulunamadı!"
            exit 1
          fi

      # 🧪 Lint ve Test (kalite kontrolü)
      - name: 🧪 Run Lint & Unit Tests
        run: ./gradlew lintRelease testReleaseUnitTest --no-daemon --stacktrace

      - name: 📊 Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QA-Reports-${{ github.run_number }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/testReleaseUnitTest/*
          if-no-files-found: ignore

      # 📤 APK’yı yükle (versiyonlu)
      - name: 📤 Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: AquaLight-Release-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-release.apk

      # 🧹 Güvenlik için keystore’u sil
      - name: 🧹 Cleanup keystore
        if: always()
        run: rm -f release-key.jks