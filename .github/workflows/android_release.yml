name: Android Release CI/CD

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*.*.*"
  pull_request:
    paths:
      - ".github/workflows/android_release.yml"
      - ".firebaserc"
      - "app/**"
      - "firebase.json"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
      - "settings.gradle"
      - "tools/release_version.py"
      - "tools/firebase_environment_guard.py"
      - "tools/tests/test_firebase_environment.py"
      - "tools/tests/test_release_version.py"

concurrency:
  group: release-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Release policy preflight
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      version_name: ${{ steps.release.outputs.version_name }}
      version_code: ${{ steps.release.outputs.version_code }}
      release_commit: ${{ steps.release.outputs.release_commit }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test release policy
        run: >-
          python3 -m unittest
          tools.tests.test_release_version
          tools.tests.test_firebase_environment
          -v

      - name: Validate production tag and main lineage
        id: release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          AQL_PRODUCTION_RELEASE_ENABLED: ${{ vars.AQL_PRODUCTION_RELEASE_ENABLED }}
        run: |
          set -euo pipefail

          if [[ "$AQL_PRODUCTION_RELEASE_ENABLED" != "true" ]]; then
            echo \
              "Production release is locked; set AQL_PRODUCTION_RELEASE_ENABLED=true first." \
              >&2
            exit 1
          fi

          git fetch --force --no-tags \
            origin +refs/heads/main:refs/remotes/origin/main

          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          checkout_commit="$(git rev-parse HEAD)"

          if [[ -z "$release_commit" || "$release_commit" != "$checkout_commit" ]]; then
            echo "Release tag must resolve to the checked-out commit." >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$release_commit" origin/main; then
            echo "Release tag must point to a commit in main history." >&2
            exit 1
          fi

          previous_args=()
          while IFS= read -r previous_tag; do
            [[ -z "$previous_tag" || "$previous_tag" == "$RELEASE_TAG" ]] && continue
            previous_args+=(--previous-tag "$previous_tag")
          done < <(git tag --merged origin/main --list "v*.*.*")

          python3 tools/release_version.py \
            "$RELEASE_TAG" \
            "${previous_args[@]}" \
            --github-output "$GITHUB_OUTPUT"
          printf 'release_commit=%s\n' "$release_commit" >> "$GITHUB_OUTPUT"

      - name: Require successful main verification
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
        run: |
          set -euo pipefail

          require_successful_push_run() {
            local workflow_file="$1"
            local response
            local successful_runs

            response="$(
              gh api --method GET \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_file}/runs" \
                -f branch=main \
                -f event=push \
                -f head_sha="$RELEASE_COMMIT" \
                -f status=success \
                -F per_page=1
            )"
            successful_runs="$(jq -r '.total_count' <<< "$response")"

            if [[ ! "$successful_runs" =~ ^[0-9]+$ || "$successful_runs" -lt 1 ]]; then
              echo \
                "No successful main push run found for ${workflow_file} at ${RELEASE_COMMIT}." \
                >&2
              exit 1
            fi
          }

          require_successful_push_run android.yml
          require_successful_push_run codeql.yml
          require_successful_push_run android_release.yml

  release-candidate:
    name: Minified release candidate
    needs: preflight
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
        -Dorg.gradle.daemon=false
      RELEASE_KEYSTORE_PASSWORD: aqualight-ci
      RELEASE_KEY_ALIAS: aqualight-ci
      RELEASE_KEY_PASSWORD: aqualight-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Generate CI-only OTA verification key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private_key="${RUNNER_TEMP}/aql-ota-ci-private.pem"
          public_key="${RUNNER_TEMP}/aql-ota-ci-public.pem"

          openssl genpkey \
            -algorithm RSA \
            -pkeyopt rsa_keygen_bits:2048 \
            -out "$private_key" >/dev/null 2>&1
          openssl pkey \
            -in "$private_key" \
            -pubout \
            -out "$public_key"
          rm -f "$private_key"

          {
            echo "AQL_OTA_MANIFEST_PUBLIC_KEY_PEM<<AQL_OTA_PEM"
            cat "$public_key"
            echo "AQL_OTA_PEM"
            echo "AQL_OTA_MANIFEST_KEY_ID=aql-ota-manifest-2026-01"
          } >> "$GITHUB_ENV"
          rm -f "$public_key"

      - name: Verify OTA manifest signature config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AQL_OTA_MANIFEST_PUBLIC_KEY_PEM:-}" ]]; then
            echo "AQL_OTA_MANIFEST_PUBLIC_KEY_PEM is missing or empty." >&2
            exit 1
          fi
          if [[ "$AQL_OTA_MANIFEST_KEY_ID" != "aql-ota-manifest-2026-01" ]]; then
            echo "AQL_OTA_MANIFEST_KEY_ID has an unexpected value." >&2
            exit 1
          fi
          if ! grep -q -- "-----BEGIN PUBLIC KEY-----" \
            <<< "$AQL_OTA_MANIFEST_PUBLIC_KEY_PEM"; then
            echo "OTA manifest public key must be PEM encoded." >&2
            exit 1
          fi
          if ! grep -q -- "-----END PUBLIC KEY-----" \
            <<< "$AQL_OTA_MANIFEST_PUBLIC_KEY_PEM"; then
            echo "OTA manifest public key PEM footer is missing." >&2
            exit 1
          fi

      - name: Run architecture guards
        run: |
          python3 tools/architecture_guard.py
          python3 tools/composition_root_guard.py
          python3 tools/ui_dependency_construction_guard.py
          python3 tools/session_startup_guard.py
          python3 tools/navigation_guard.py
          python3 tools/ws_protocol_guard.py
          python3 tools/permission_architecture_guard.py
          python3 tools/notification_reminder_architecture_guard.py
          python3 tools/process_safe_feedback_guard.py
          python3 tools/stage9_feedback_media_guard.py
          python3 tools/firebase_environment_guard.py
          python3 tools/firebase_telemetry_guard.py
          python3 tools/privacy_legal_guard.py
          python3 tools/design_system_resource_guard.py
          python3 tools/localization_accessibility_guard.py

      - name: Generate CI-only release keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair -noprompt \
            -keystore release-key.jks \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            -keypass "$RELEASE_KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storetype JKS \
            -dname "CN=AquaLight CI,O=AquaLight,C=TR"
          chmod 600 release-key.jks

      - name: Build and test minified release candidate
        run: |
          ./gradlew \
            :app:verifyFirebaseEnvironmentSeparation \
            :app:verifyFirebaseRuntimePolicy \
            lintStagingReleaseSmoke \
            testStagingReleaseSmokeUnitTest \
            assembleStagingReleaseSmoke \
            --no-daemon \
            --stacktrace
          python3 tools/firebase_telemetry_guard.py --scan-build-output

      - name: Verify release candidate APK
        shell: bash
        run: |
          set -euo pipefail
          candidate_apk="$(
            find app/build/outputs/apk/staging/releaseSmoke \
              -type f -name "*.apk" -print -quit
          )"
          test -n "$candidate_apk"
          test -s "$candidate_apk"
          printf '%s\n' "$candidate_apk" > release-candidate-apk-path.txt

      - name: Upload candidate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-reports-${{ github.run_number }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            **/build/reports/tests/testStagingReleaseSmokeUnitTest/**
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload release candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: AquaLight-release-candidate-${{ github.run_number }}
          path: app/build/outputs/apk/staging/releaseSmoke/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove CI-only release keystore
        if: always()
        run: rm -f release-key.jks

  production-release:
    name: Production release
    needs: preflight
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production-release

    env:
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
        -Dorg.gradle.daemon=false
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Verify OTA manifest signature config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${AQL_OTA_MANIFEST_PUBLIC_KEY_PEM:-}" ]]; then
            echo "AQL_OTA_MANIFEST_PUBLIC_KEY_PEM is missing or empty." >&2
            exit 1
          fi
          if [[ "$AQL_OTA_MANIFEST_KEY_ID" != "aql-ota-manifest-2026-01" ]]; then
            echo "AQL_OTA_MANIFEST_KEY_ID has an unexpected value." >&2
            exit 1
          fi
          if ! grep -q -- "-----BEGIN PUBLIC KEY-----" \
            <<< "$AQL_OTA_MANIFEST_PUBLIC_KEY_PEM"; then
            echo "OTA manifest public key must be PEM encoded." >&2
            exit 1
          fi
          if ! grep -q -- "-----END PUBLIC KEY-----" \
            <<< "$AQL_OTA_MANIFEST_PUBLIC_KEY_PEM"; then
            echo "OTA manifest public key PEM footer is missing." >&2
            exit 1
          fi

      - name: Decode production release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for secret_name in \
            RELEASE_KEYSTORE_BASE64 \
            RELEASE_KEYSTORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "${secret_name} is missing or empty." >&2
              exit 1
            fi
          done

          umask 077
          printf '%s' "$RELEASE_KEYSTORE_BASE64" \
            | base64 --decode > release-key.jks
          test -s release-key.jks
          chmod 600 release-key.jks

      - name: Build signed production release
        env:
          AQL_VERSION_NAME: ${{ needs.preflight.outputs.version_name }}
          AQL_VERSION_CODE: ${{ needs.preflight.outputs.version_code }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew \
            :app:verifyFirebaseEnvironmentSeparation \
            :app:verifyFirebaseRuntimePolicy \
            lintProductionRelease \
            testProductionReleaseUnitTest \
            assembleProductionRelease \
            -PAQL_VERSION_NAME="$AQL_VERSION_NAME" \
            -PAQL_VERSION_CODE="$AQL_VERSION_CODE" \
            --no-daemon \
            --stacktrace
          python3 tools/firebase_telemetry_guard.py --scan-build-output

      - name: Verify production APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/production/release/AquaLight.apk

      - name: Upload production reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-reports-${{ needs.preflight.outputs.release_tag }}
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            **/build/reports/tests/testProductionReleaseUnitTest/**
          if-no-files-found: ignore

      - name: Upload production APK
        uses: actions/upload-artifact@v4
        with:
          name: AquaLight-${{ needs.preflight.outputs.release_tag }}-APK
          path: app/build/outputs/apk/production/release/AquaLight.apk
          if-no-files-found: error

      - name: Remove production release keystore
        if: always()
        run: rm -f release-key.jks
