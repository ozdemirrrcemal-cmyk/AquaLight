name: Android Controlled Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to publish, for example v1.2.3
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
    -Dorg.gradle.daemon=false

jobs:
  guard:
    name: 1 · Release guard
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Set up Android toolchain
        uses: ./.github/actions/android-setup

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Validate tag and derive Android version metadata
        id: version
        shell: bash
        run: |
          set -Eeuo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          git show-ref --tags --verify --quiet "refs/tags/${TAG}"
          TAG_COMMIT="$(git rev-list -n 1 "${TAG}")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [[ "${TAG_COMMIT}" != "${HEAD_COMMIT}" ]]; then
            echo "Checked-out commit does not match release tag ${TAG}." >&2
            exit 1
          fi
          python3 tools/release_version.py \
            --tag "${TAG}" \
            --github-output "${GITHUB_OUTPUT}"

      - name: Validate release tooling and immutable Action refs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/tests/test_release_version.py
          python3 tools/tests/test_configure_firebase.py
          python3 tools/verify_action_pins.py

      - name: Validate source-controlled Firebase fixtures
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/configure_firebase.py validate \
            --environment debug \
            --package com.aqua.aqualight.debug \
            --input app/src/debug/google-services.json
          python3 tools/configure_firebase.py validate \
            --environment staging \
            --package com.aqua.aqualight.staging \
            --input app/src/staging/google-services.json
          python3 tools/configure_firebase.py validate \
            --environment releaseSmoke \
            --package com.aqua.aqualight \
            --input app/src/releaseSmoke/google-services.json

      - name: Run architecture and policy guards
        run: bash tools/run_architecture_guards.sh

      - name: Verify resolved Firebase runtime policy
        run: ./gradlew :app:verifyFirebaseRuntimePolicy --no-daemon --stacktrace

  lint:
    name: 2 · Release lint and static analysis
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.tag }}

      - name: Set up Android toolchain
        uses: ./.github/actions/android-setup

      - name: Run full lint and Detekt
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          ./gradlew :app:lintDebug :app:lintStaging :app:detekt \
            --no-daemon --stacktrace 2>&1 | tee release-static-analysis.log

      - name: Upload release static-analysis reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-static-analysis-${{ github.run_number }}
          path: |
            release-static-analysis.log
            app/build/reports/lint-results-*
            app/build/reports/detekt/**
          if-no-files-found: ignore
          retention-days: 30

  unit_test:
    name: 3 · Release unit tests and coverage
    needs: [guard, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.tag }}

      - name: Set up Android toolchain
        uses: ./.github/actions/android-setup

      - name: Run unit tests and coverage gates
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          ./gradlew \
            :app:testDebugUnitTest \
            :app:jacocoDebugUnitTestReport \
            :app:jacocoCriticalCoverageVerification \
            --no-daemon --stacktrace 2>&1 | tee release-unit-test-coverage.log

      - name: Upload release unit-test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-unit-test-coverage-${{ github.run_number }}
          path: |
            release-unit-test-coverage.log
            app/build/reports/tests/testDebugUnitTest/**
            app/build/reports/jacoco/jacocoDebugUnitTestReport/**
          if-no-files-found: ignore
          retention-days: 30

  instrumentation:
    name: 4 · Release instrumentation
    needs: [guard, unit_test]
    uses: ./.github/workflows/android_instrumentation.yml
    with:
      ref: ${{ needs.guard.outputs.tag }}

  release:
    name: 5 · Signed production artifacts
    needs: [guard, instrumentation]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: production
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      AQL_VERSION_NAME: ${{ needs.guard.outputs.version_name }}
      AQL_VERSION_CODE: ${{ needs.guard.outputs.version_code }}
      AQL_OTA_MANIFEST_PUBLIC_KEY_PEM: ${{ secrets.AQL_OTA_MANIFEST_PUBLIC_KEY_PEM }}
      AQL_OTA_MANIFEST_KEY_ID: ${{ secrets.AQL_OTA_MANIFEST_KEY_ID }}
      FIREBASE_CONFIG_PRODUCTION_BASE64: ${{ secrets.FIREBASE_CONFIG_PRODUCTION_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_SHA256: ${{ secrets.RELEASE_KEYSTORE_SHA256 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.tag }}
          fetch-depth: 0

      - name: Set up Android toolchain
        uses: ./.github/actions/android-setup

      - name: Validate protected release secrets and materialize keystore
        shell: bash
        run: |
          set -Eeuo pipefail
          required=(
            AQL_OTA_MANIFEST_PUBLIC_KEY_PEM
            AQL_OTA_MANIFEST_KEY_ID
            FIREBASE_CONFIG_PRODUCTION_BASE64
            RELEASE_KEYSTORE_BASE64
            RELEASE_KEYSTORE_SHA256
            RELEASE_KEYSTORE_PASSWORD
            RELEASE_KEY_ALIAS
            RELEASE_KEY_PASSWORD
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" ]]; then
              echo "Required protected release secret is missing or empty: ${variable}" >&2
              exit 1
            fi
          done

          if [[ "${AQL_OTA_MANIFEST_KEY_ID}" != "aql-ota-manifest-2026-01" ]]; then
            echo "AQL_OTA_MANIFEST_KEY_ID must be aql-ota-manifest-2026-01." >&2
            exit 1
          fi
          grep -q -- "-----BEGIN PUBLIC KEY-----" <<< "${AQL_OTA_MANIFEST_PUBLIC_KEY_PEM}"
          grep -q -- "-----END PUBLIC KEY-----" <<< "${AQL_OTA_MANIFEST_PUBLIC_KEY_PEM}"

          EXPECTED_SHA256="$(tr '[:upper:]' '[:lower:]' <<< "${RELEASE_KEYSTORE_SHA256}" | tr -d '[:space:]')"
          if [[ ! "${EXPECTED_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "RELEASE_KEYSTORE_SHA256 must be exactly 64 hexadecimal characters." >&2
            exit 1
          fi

          umask 077
          KEYSTORE_PATH="${RUNNER_TEMP}/aqualight-release.jks"
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_PATH}"
          test -s "${KEYSTORE_PATH}"
          ACTUAL_SHA256="$(sha256sum "${KEYSTORE_PATH}" | awk '{print $1}')"
          if [[ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]]; then
            echo "Decoded release keystore checksum does not match RELEASE_KEYSTORE_SHA256." >&2
            exit 1
          fi

          keytool -list \
            -keystore "${KEYSTORE_PATH}" \
            -storepass "${RELEASE_KEYSTORE_PASSWORD}" \
            -alias "${RELEASE_KEY_ALIAS}" >/dev/null
          printf 'RELEASE_KEYSTORE_PATH=%s\n' "${KEYSTORE_PATH}" >> "${GITHUB_ENV}"

      - name: Materialize and validate production Firebase configuration
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/configure_firebase.py materialize \
            --environment production \
            --package com.aqua.aqualight \
            --base64-env FIREBASE_CONFIG_PRODUCTION_BASE64 \
            --output app/src/release/google-services.json

      - name: Build signed AAB, signed APK, and CycloneDX SBOM
        shell: bash
        run: |
          set -Eeuo pipefail
          set -o pipefail
          ./gradlew \
            :app:bundleRelease \
            :app:assembleRelease \
            cyclonedxBom \
            --no-daemon --stacktrace 2>&1 | tee production-release-build.log
          ./gradlew :app:verifyFirebaseRuntimePolicy --no-daemon --stacktrace
          python3 tools/firebase_telemetry_guard.py --scan-build-output

      - name: Verify signatures and assemble release distribution
        id: distribution
        shell: bash
        run: |
          set -Eeuo pipefail
          AAB_SOURCE="$(find app/build/outputs/bundle/release -type f -name '*.aab' -size +0 | head -n 1)"
          APK_SOURCE="$(find app/build/outputs/apk/release -type f -name '*.apk' -size +0 | head -n 1)"
          SBOM_SOURCE="$(find build/reports/cyclonedx -type f -name '*.json' -size +0 | head -n 1)"
          test -n "${AAB_SOURCE}"
          test -n "${APK_SOURCE}"
          test -n "${SBOM_SOURCE}"

          jarsigner -verify -strict "${AAB_SOURCE}" >/dev/null
          APKSIGNER="$(find "${ANDROID_SDK_ROOT}/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "${APKSIGNER}"
          "${APKSIGNER}" verify --verbose --print-certs "${APK_SOURCE}" >/dev/null

          mkdir -p dist
          cp "${AAB_SOURCE}" "dist/AquaLight-${AQL_VERSION_NAME}.aab"
          cp "${APK_SOURCE}" "dist/AquaLight-${AQL_VERSION_NAME}.apk"
          cp "${SBOM_SOURCE}" "dist/AquaLight-${AQL_VERSION_NAME}-sbom.cdx.json"
          cp production-release-build.log dist/
          (
            cd dist
            sha256sum \
              "AquaLight-${AQL_VERSION_NAME}.aab" \
              "AquaLight-${AQL_VERSION_NAME}.apk" \
              "AquaLight-${AQL_VERSION_NAME}-sbom.cdx.json" \
              > SHA256SUMS
          )

      - name: Attest release provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/AquaLight-${{ env.AQL_VERSION_NAME }}.aab
            dist/AquaLight-${{ env.AQL_VERSION_NAME }}.apk
            dist/SHA256SUMS

      - name: Attest release SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            dist/AquaLight-${{ env.AQL_VERSION_NAME }}.aab
            dist/AquaLight-${{ env.AQL_VERSION_NAME }}.apk
          sbom-path: dist/AquaLight-${{ env.AQL_VERSION_NAME }}-sbom.cdx.json

      - name: Upload signed release distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AquaLight-${{ needs.guard.outputs.tag }}
          path: dist/**
          if-no-files-found: error
          retention-days: 90

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.guard.outputs.tag }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release ${RELEASE_TAG} already exists; replacing its artifacts."
          else
            gh release create "${RELEASE_TAG}" \
              --verify-tag \
              --title "AquaLight ${AQL_VERSION_NAME}" \
              --generate-notes
          fi
          gh release upload "${RELEASE_TAG}" dist/* --clobber

      - name: Remove release secrets from runner storage
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/aqualight-release.jks"
          rm -f app/src/release/google-services.json
