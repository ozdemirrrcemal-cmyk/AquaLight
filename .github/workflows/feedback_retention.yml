name: Feedback Retention Cleanup

on:
  schedule:
    - cron: "17 03 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run reports eligibility; execute permanently deletes eligible feedback."
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - execute

permissions:
  contents: read
  id-token: write

concurrency:
  group: feedback-retention
  cancel-in-progress: false

jobs:
  cleanup:
    if: >-
      ${{ vars.AQL_RETENTION_WIF_PROVIDER != '' &&
          vars.AQL_RETENTION_SERVICE_ACCOUNT != '' &&
          vars.AQL_FIREBASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AQL_FIREBASE_PROJECT_ID: ${{ vars.AQL_FIREBASE_PROJECT_ID }}
      AQL_RETENTION_BATCH_SIZE: "250"
      AQL_RETENTION_MAX_DOCUMENTS: "5000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Install pinned maintenance dependencies
        working-directory: firebase
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Authenticate to Google Cloud without a service-account key
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.AQL_RETENTION_WIF_PROVIDER }}
          service_account: ${{ vars.AQL_RETENTION_SERVICE_ACCOUNT }}

      - name: Run scheduled retention deletion
        if: ${{ github.event_name == 'schedule' }}
        working-directory: firebase
        run: node retention_cleanup.mjs --execute

      - name: Run manual retention check
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' }}
        working-directory: firebase
        run: node retention_cleanup.mjs

      - name: Run manually approved retention deletion
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'execute' }}
        working-directory: firebase
        run: node retention_cleanup.mjs --execute
