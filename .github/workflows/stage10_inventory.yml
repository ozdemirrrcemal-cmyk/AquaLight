name: Stage 10 Inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate source inventory and audit
        shell: bash
        run: |
          set -o pipefail
          mkdir -p docs
          find app/src/main -type f -print | sort > docs/stage10-file-inventory.txt
          python3 tools/stage10_design_system_guard.py > docs/stage10-audit.txt 2>&1 || true
          grep '\[RAW_XML_TEXT\]' docs/stage10-audit.txt > docs/stage10-audit-raw-xml-text.txt || true
          grep '\[RAW_UI_MESSAGE\]' docs/stage10-audit.txt > docs/stage10-audit-raw-ui-message.txt || true
          grep '\[RAW_COLOR\]' docs/stage10-audit.txt > docs/stage10-audit-raw-color.txt || true
          grep '\[RAW_DIMENSION\]' docs/stage10-audit.txt > docs/stage10-audit-raw-dimension.txt || true

      - name: Upload inventory
        uses: actions/upload-artifact@v4
        with:
          name: stage10-inventory-${{ github.run_number }}
          path: docs/stage10-*.txt
          if-no-files-found: error
