name: Compose Dependency Refresh

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "settings.gradle"
      - "build.gradle"
      - "gradle/aqualight-compose.gradle"
      - "app/gradle.lockfile"
      - "gradle/verification-metadata.xml"
      - ".github/workflows/compose_dependency_refresh.yml"

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "15859902"
        env:
          SKIP_JDK_VERSION_CHECK: true

      - name: Install required SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"

      - name: Refresh Gradle trust state
        run: |
          chmod +x ./gradlew
          ./gradlew :app:dependencies \
            --write-locks \
            --write-verification-metadata sha256 \
            --no-daemon \
            --stacktrace

      - name: Upload refreshed dependency state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-dependency-state-${{ github.run_id }}
          path: |
            app/gradle.lockfile
            gradle/verification-metadata.xml
          if-no-files-found: error
