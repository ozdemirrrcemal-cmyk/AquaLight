name: Dependabot Gradle Trust Refresh

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "app/build.gradle"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/libs.versions.toml"
      - "app/gradle.lockfile"
      - "gradle/verification-metadata.xml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: dependabot-gradle-trust-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Dfile.encoding=UTF-8"
    -Dorg.gradle.daemon=false

jobs:
  generate:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/gradle/')
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Validate Dependabot identity
        id: pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          pr_number = os.environ["PR_NUMBER"]
          head_ref = os.environ["HEAD_REF"]
          head_sha = os.environ["HEAD_SHA"]
          if not re.fullmatch(r"[1-9][0-9]*", pr_number):
              raise SystemExit("Dependabot PR number is invalid.")
          if not re.fullmatch(r"dependabot/gradle/[A-Za-z0-9._/-]+", head_ref):
              raise SystemExit("Dependabot branch name is invalid.")
          if ".." in head_ref or head_ref.endswith("/"):
              raise SystemExit("Dependabot branch name is unsafe.")
          if not re.fullmatch(r"[0-9a-f]{40}", head_sha):
              raise SystemExit("Dependabot head SHA is invalid.")

          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"number={pr_number}\n")
              handle.write(f"head-ref={head_ref}\n")
              handle.write(f"head-sha={head_sha}\n")
          PY

      - name: Checkout exact Dependabot head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.pr.outputs.head-sha }}
          persist-credentials: false

      - name: Provision Dependabot Firebase fixtures
        uses: ./.github/actions/provision-dependabot-firebase

      - name: Validate Dependabot PR scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            --jq '.[].filename' > pr-files.txt

          python3 - <<'PY'
          from pathlib import Path

          allowed = {
              "app/build.gradle",
              "build.gradle",
              "settings.gradle",
              "gradle.properties",
              "gradle/libs.versions.toml",
              "app/gradle.lockfile",
              "gradle/verification-metadata.xml",
          }
          manifests = allowed - {
              "app/gradle.lockfile",
              "gradle/verification-metadata.xml",
          }
          files = {
              line.strip()
              for line in Path("pr-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          unexpected = sorted(files - allowed)
          if unexpected:
              raise SystemExit("Unexpected Dependabot files: " + ", ".join(unexpected))
          if not files.intersection(manifests):
              raise SystemExit("No approved Gradle manifest changed.")
          PY

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Install JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: "15859902"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager "platform-tools" "platforms;android-36"
          sdkmanager "build-tools;36.0.0" || sdkmanager "build-tools;36.0.1"
          chmod +x ./gradlew

      - name: Generate CI-only signing keys
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p ~/.android
          if [[ ! -s ~/.android/debug.keystore ]]; then
            keytool -genkeypair -noprompt \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias AndroidDebugKey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS \
              -dname "CN=Android,O=AquaLight,C=TR"
          fi

          keytool -genkeypair -noprompt \
            -keystore release-key.jks \
            -storepass aqualight-ci \
            -alias aqualight-ci \
            -keypass aqualight-ci \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -storetype JKS \
            -dname "CN=AquaLight Dependabot CI,O=AquaLight,C=TR"

      - name: Regenerate Gradle trust state
        env:
          CI: "true"
          RELEASE_KEYSTORE_PASSWORD: aqualight-ci
          RELEASE_KEY_ALIAS: aqualight-ci
          RELEASE_KEY_PASSWORD: aqualight-ci
        shell: bash
        run: |
          set -Eeuo pipefail
          common=(--write-locks --write-verification-metadata sha256 --no-daemon --stacktrace)

          ./gradlew :app:dependencies "${common[@]}"
          ./gradlew :app:assembleDebug :app:assembleReleaseSmoke "${common[@]}"
          ./gradlew :app:createDebugUnitTestCoverageReport "${common[@]}"
          ./gradlew :app:lintDebug "${common[@]}"

          test -s app/gradle.lockfile
          test -s gradle/verification-metadata.xml
          python3 tools/verify_dependency_integrity.py \
            --lockfile app/gradle.lockfile \
            --metadata gradle/verification-metadata.xml \
            --summary build/reports/dependabot-trust-refresh.json

      - name: Report generated file scope
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --name-only > generated-files.txt
          python3 - <<'PY'
          from pathlib import Path

          changed = [
              line.strip()
              for line in Path("generated-files.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          print("Ephemeral Gradle changes: " + (", ".join(changed) or "none"))
          print("Only app/gradle.lockfile and gradle/verification-metadata.xml will be packaged.")
          PY

      - name: Prepare trust-state artifact
        env:
          HEAD_REF: ${{ steps.pr.outputs.head-ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p trust-refresh/app trust-refresh/gradle
          cp app/gradle.lockfile trust-refresh/app/gradle.lockfile
          cp gradle/verification-metadata.xml trust-refresh/gradle/verification-metadata.xml
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("trust-refresh/metadata.json").write_text(
              json.dumps(
                  {
                      "pull_request": int(os.environ["PR_NUMBER"]),
                      "head_ref": os.environ["HEAD_REF"],
                      "head_sha": os.environ["HEAD_SHA"],
                      "source_run_id": int(os.environ["SOURCE_RUN_ID"]),
                  },
                  sort_keys=True,
              ) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload generated Gradle trust state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependabot-gradle-trust-${{ github.run_id }}
          path: trust-refresh/
          if-no-files-found: error
          retention-days: 3

      - name: Remove CI-only release keystore
        if: always()
        shell: bash
        run: rm -f release-key.jks
