name: Temporary Bundletool Checksum

on:
  pull_request:
    paths:
      - ".github/workflows/temporary_bundletool_checksum.yml"

permissions:
  contents: read

jobs:
  checksum:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download official bundletool release
        shell: bash
        run: |
          set -Eeuo pipefail
          version="1.18.3"
          url="https://github.com/google/bundletool/releases/download/${version}/bundletool-all-${version}.jar"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            --output bundletool.jar \
            "$url"
          test -s bundletool.jar
          sha256sum bundletool.jar | tee bundletool.sha256
          java -jar bundletool.jar version | tee bundletool-version.txt
          grep -Fxq "$version" bundletool-version.txt

      - name: Upload checksum evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: temporary-bundletool-checksum-${{ github.run_number }}
          path: |
            bundletool.sha256
            bundletool-version.txt
          if-no-files-found: error
          retention-days: 1
