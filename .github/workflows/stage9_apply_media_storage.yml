name: Stage 9 Remove Completed Migration Helpers

on:
  push:
    branches:
      - agent/stage-9-feedback-media-cleanup
    paths:
      - ".github/workflows/stage9_apply_media_storage.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/stage-9-feedback-media-cleanup
          fetch-depth: 0

      - name: Remove completed migration helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/stage9_apply_media_storage_migration.py
          git rm .github/workflows/stage9_apply_media_storage.yml
          git commit -m "chore: remove completed Stage 9 migration helpers"
          git push origin HEAD:agent/stage-9-feedback-media-cleanup
