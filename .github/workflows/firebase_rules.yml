name: Firebase Rules Validation

on:
  push:
    branches: [main]
    paths:
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - firebase/**
      - .github/workflows/firebase_rules.yml
  pull_request:
    paths:
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - firebase/**
      - .github/workflows/firebase_rules.yml

permissions:
  contents: read

concurrency:
  group: firebase-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Set up JDK 21 for Firestore emulator
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Install pinned Firebase test dependencies
        working-directory: firebase
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate index JSON
        run: node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json', 'utf8'))"

      - name: Run Firestore rules tests
        run: >-
          npx --yes firebase-tools@15.24.0 emulators:exec
          --only firestore
          --project demo-aqualight-feedback
          "node firebase/rules.test.mjs"
