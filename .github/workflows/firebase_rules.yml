name: Firebase Rules Validation

on:
  push:
    branches:
      - main
    paths:
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - firebase/**
      - .github/workflows/firebase_rules.yml
  pull_request:
    paths:
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - firebase/**
      - .github/workflows/firebase_rules.yml
  issues:
    types: [reopened]

permissions:
  actions: write
  contents: write
  issues: write

concurrency:
  group: firebase-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-v0140-candidate:
    if: >-
      github.event_name == 'issues' &&
      github.event.issue.user.login == 'ozdemirrrcemal-cmyk' &&
      github.event.issue.title == 'AquaLight v0.14.0 candidate trigger 20260726-01'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore workflows, move tag and dispatch candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v0.14.0
          BOOTSTRAP_PATH: .github/workflows/firebase_rules.yml
          TEMP_PATH: .github/workflows/_dispatch_v0140_candidate_once.yml
        run: |
          set -Eeuo pipefail

          trigger_sha="$GITHUB_SHA"
          main_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq '.object.sha')"
          [[ "$main_sha" == "$trigger_sha" ]]

          parent_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/git/commits/${trigger_sha}" \
            --jq '.parents[0].sha')"
          [[ "$parent_sha" =~ ^[0-9a-f]{40}$ ]]

          original_content="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/contents/${BOOTSTRAP_PATH}?ref=${parent_sha}" \
            --jq '.content | gsub("\\n"; "")')"
          [[ -n "$original_content" ]]

          bootstrap_blob_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/contents/${BOOTSTRAP_PATH}?ref=main" \
            --jq '.sha')"

          gh api --method PUT \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/contents/${BOOTSTRAP_PATH}" \
            -f message='ci: restore Firebase rules workflow' \
            -f content="$original_content" \
            -f sha="$bootstrap_blob_sha" \
            -f branch=main \
            >/dev/null

          temp_blob_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/contents/${TEMP_PATH}?ref=main" \
            --jq '.sha')"

          gh api --method DELETE \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/contents/${TEMP_PATH}" \
            -f message='ci: remove one-time v0.14.0 dispatcher' \
            -f sha="$temp_blob_sha" \
            -f branch=main \
            >/dev/null

          release_commit="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq '.object.sha')"
          [[ "$release_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$release_commit" != "$trigger_sha" ]]

          gh api --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
            -f sha="$release_commit" \
            -F force=true \
            >/dev/null

          tag_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
            --jq '.object.sha')"
          [[ "$tag_sha" == "$release_commit" ]]

          before_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/android_release.yml/runs?event=workflow_dispatch&per_page=1" \
            --jq '.workflow_runs[0].id // 0')"

          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/android_release.yml/dispatches" \
            -f ref=main \
            -f "inputs[release_tag]=${RELEASE_TAG}" \
            -f 'inputs[phase]=candidate'

          run_id=""
          run_url=""
          for _ in $(seq 1 90); do
            row="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/android_release.yml/runs?event=workflow_dispatch&branch=main&per_page=30" \
              --jq ".workflow_runs[] | select(.id > ${before_id} and .head_sha == \"${release_commit}\" and .path == \".github/workflows/android_release.yml\") | [.id, .html_url] | @tsv" \
              | head -n 1)"
            if [[ -n "$row" ]]; then
              IFS=$'\t' read -r run_id run_url <<< "$row"
              break
            fi
            sleep 4
          done

          [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
          [[ "$run_url" == https://github.com/* ]]

          body="v0.14.0 candidate başlatıldı.\n\n- Clean main commit: \`${release_commit}\`\n- Candidate run ID: \`${run_id}\`\n- Run: ${run_url}\n- Phase: \`candidate\`\n- APK + AAB: zorunlu\n- Google Play upload: yok"
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}/comments" \
            -f body="$body" \
            >/dev/null

          gh api --method PATCH \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/${GITHUB_REPOSITORY}/issues/${{ github.event.issue.number }}" \
            -f state=closed \
            >/dev/null

  validate-rules:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up JDK 21 for Firestore emulator
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firebase test dependencies
        working-directory: firebase
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate index JSON
        run: node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json', 'utf8'))"

      - name: Run Firestore rules tests
        run: >-
          npx --yes firebase-tools@15.24.0 emulators:exec
          --only firestore
          --project demo-aqualight-feedback
          "node firebase/rules.test.mjs"
