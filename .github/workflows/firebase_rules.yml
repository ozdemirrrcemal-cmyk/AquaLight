name: Firebase Rules Validation

on:
  push:
    branches: [main]
    paths:
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - firebase/**
      - .github/workflows/firebase_rules.yml
  pull_request:
    paths:
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - firebase/**
      - .github/workflows/firebase_rules.yml

permissions:
  contents: read

concurrency:
  group: firebase-rules-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - name: Set up JDK 21 for Firestore emulator
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Firebase test dependencies
        working-directory: firebase
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate index JSON
        run: node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json', 'utf8'))"
      - name: Run Firestore rules tests
        run: >-
          npx --yes firebase-tools@15.24.0 emulators:exec
          --only firestore
          --project demo-aqualight-feedback
          "node firebase/rules.test.mjs"

  seal-commercial-state:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/commercial-13-release-supply-chain'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      CI: 'true'
      GRADLE_USER_HOME: /tmp/aqualight-cold-gradle-home-${{ github.run_id }}
      RELEASE_KEYSTORE_PASSWORD: aqualight-ci
      RELEASE_KEY_ALIAS: aqualight-ci
      RELEASE_KEY_PASSWORD: aqualight-ci
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Apply canonical variant selector and Detekt baseline contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/build.gradle')
          text = path.read_text(encoding='utf-8')

          old_selector = '''    beforeVariants(selector().all()) { variantBuilder ->
                  def environment = variantBuilder.productFlavors
                          .find { pair -> pair.first == "environment" }
                          ?.second
                  def buildType = variantBuilder.buildType
                  def variantIdentity = environment && buildType
                          ? "${environment}${buildType.capitalize()}"
                          : ""
                  variantBuilder.enable = allowedVariants.contains(variantIdentity)
              }
          '''
          new_selector = '''    beforeVariants(selector().all()) { variantBuilder ->
                  variantBuilder.enable = allowedVariants.contains(variantBuilder.name)
              }
          '''
          if old_selector not in text:
              raise SystemExit('legacy variant selector block was not found exactly')
          text = text.replace(old_selector, new_selector)

          baseline_anchor = '    basePath = rootDir.absolutePath\n'
          baseline_line = '    baseline = file("$rootDir/config/detekt/baseline.xml")\n'
          if baseline_line not in text:
              if baseline_anchor not in text:
                  raise SystemExit('Detekt baseline anchor was not found')
              text = text.replace(baseline_anchor, baseline_anchor + baseline_line)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Prepare non-production Firebase and signing inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/materialize_firebase_config.py --environment development --allow-ci-fixture
          python3 tools/ci/materialize_firebase_config.py --environment staging --allow-ci-fixture
          KEYSTORE="$RUNNER_TEMP/aqualight-ci.jks"
          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE" \
            -storepass "$RELEASE_KEYSTORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" \
            -keypass "$RELEASE_KEY_PASSWORD" \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=AquaLight CI,O=AquaLight,C=TR"
          chmod 600 "$KEYSTORE"
          printf 'AQL_RELEASE_KEYSTORE_PATH=%s\n' "$KEYSTORE" >> "$GITHUB_ENV"
      - name: Regenerate dependency state from commercial tasks
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          rm -rf "$GRADLE_USER_HOME"
          mkdir -p "$GRADLE_USER_HOME"
          rm -f gradle.lockfile app/gradle.lockfile gradle/verification-metadata.xml
          ./gradlew dependencies --configuration cyclonedxBom \
            --write-locks --write-verification-metadata sha256 \
            --no-daemon --stacktrace 2>&1 | tee dependency-state.log
          ./gradlew \
            assembleDevelopmentDebug \
            compileDevelopmentDebugUnitTestKotlin \
            assembleStagingDebugAndroidTest \
            assembleStagingReleaseSmoke \
            assembleStagingRelease \
            --write-locks --write-verification-metadata sha256 \
            --no-daemon --stacktrace 2>&1 | tee -a dependency-state.log
          ./gradlew :app:dependencies --configuration productionReleaseCompileClasspath \
            --write-locks --write-verification-metadata sha256 \
            --no-daemon --stacktrace 2>&1 | tee -a dependency-state.log
          ./gradlew :app:dependencies --configuration productionReleaseRuntimeClasspath \
            --write-locks --write-verification-metadata sha256 \
            --no-daemon --stacktrace 2>&1 | tee -a dependency-state.log
          test -s gradle.lockfile
          test -s app/gradle.lockfile
          test -s gradle/verification-metadata.xml
      - name: Verify commercial variant task graph and generate Detekt baseline
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew :app:tasks --all --no-daemon 2>&1 | tee app-tasks.log
          grep -Fq "lintDevelopmentDebug" app-tasks.log
          grep -Fq "testDevelopmentDebugUnitTest" app-tasks.log
          grep -Fq "assembleStagingReleaseSmoke" app-tasks.log
          grep -Fq "assembleStagingRelease" app-tasks.log
          grep -Fq "bundleProductionRelease" app-tasks.log
          grep -Fq "detektBaselineDevelopmentDebug" app-tasks.log
          if grep -Fq "assembleProductionDebug" app-tasks.log; then
            echo "Production debug variant must not exist." >&2
            exit 1
          fi
          mkdir -p config/detekt
          ./gradlew detektBaselineDevelopmentDebug --no-daemon --stacktrace \
            2>&1 | tee detekt-baseline.log
          test -s config/detekt/baseline.xml
          ./gradlew detektDevelopmentDebug --no-daemon --stacktrace \
            2>&1 | tee detekt-verification.log
      - name: Commit sealed state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle gradle.lockfile app/gradle.lockfile gradle/verification-metadata.xml config/detekt/baseline.xml
          if [[ -f .github/workflows/variant_selector_upgrade.yml ]]; then
            git rm .github/workflows/variant_selector_upgrade.yml
          fi
          git diff --cached --check
          git commit -m "build(android): seal explicit commercial variants"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
      - name: Upload sealing diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cold-cache-commercial-state-${{ github.run_id }}
          path: |
            dependency-state.log
            app-tasks.log
            detekt-baseline.log
            detekt-verification.log
          if-no-files-found: warn
          retention-days: 1
      - name: Remove ephemeral files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/aqualight-ci.jks"
          rm -f app/src/development/google-services.json
          rm -f app/src/staging/google-services.json
