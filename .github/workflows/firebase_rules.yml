name: Firebase Rules Validation

on:
  push:
    branches:
      - main
    paths:
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - firebase/**
      - .github/workflows/firebase_rules.yml
  pull_request:
    paths:
      - firebase.json
      - firestore.rules
      - firestore.indexes.json
      - firebase/**
      - .github/workflows/firebase_rules.yml

permissions:
  contents: read

concurrency:
  group: firebase-rules-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - name: Set up JDK 21 for Firestore emulator
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Install pinned Firebase test dependencies
        working-directory: firebase
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate index JSON
        run: node -e "JSON.parse(require('fs').readFileSync('firestore.indexes.json', 'utf8'))"

      - name: Run Firestore rules tests
        run: >-
          npx --yes firebase-tools@15.24.0 emulators:exec
          --only firestore
          --project demo-aqualight-feedback
          "node firebase/rules.test.mjs"
