name: Apply Dosing Compose Compile Fix

on:
  push:
    branches:
      - feature/dosing-pump-compose
    paths:
      - ".github/workflows/apply_dosing_compile_fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature/dosing-pump-compose
          fetch-depth: 0

      - name: Fix Compose scope resolution
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/src/main/java/com/aqua/aqualight/ui/tabs/devices/detail/dosing/DosingPumpDevice.kt")
          text = path.read_text(encoding="utf-8")

          text = text.replace(
              "import androidx.compose.foundation.layout.weight\n",
              "",
          )

          anchor = """    ) {
              Box(
                  modifier = Modifier
                      .fillMaxSize()
          """
          replacement = """    ) {
              val availableWidth = maxWidth

              Box(
                  modifier = Modifier
                      .fillMaxSize()
          """
          if anchor not in text:
              raise SystemExit("BoxWithConstraints body anchor not found")
          text = text.replace(anchor, replacement, 1)
          text = text.replace(
              "            val hubSize = maxWidth * HUB_SIZE_RATIO\n",
              "            val hubSize = availableWidth * HUB_SIZE_RATIO\n",
              1,
          )

          path.write_text(text, encoding="utf-8")
          Path(".github/workflows/apply_dosing_compile_fix.yml").unlink()
          PY

      - name: Commit compile fix
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(dosing): resolve Compose layout scopes"
          git push origin HEAD:feature/dosing-pump-compose
