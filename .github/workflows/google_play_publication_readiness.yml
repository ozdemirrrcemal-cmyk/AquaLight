name: Google Play Publication Readiness

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-publication-readiness:
    name: Verify production publication blockers
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Google Play publication readiness
        run: python3 tools/google_play_publication_guard.py
