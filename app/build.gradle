plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.protobuf'
    id 'androidx.navigation.safeargs.kotlin'
    id 'org.cyclonedx.bom'
    id 'org.jlleitschuh.gradle.ktlint'
    id 'org.jetbrains.kotlinx.kover'
}

def aqlBuildConfigString = { value ->
    def normalized = (value ?: "")
            .replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\r', '')
            .replace('\n', '\\n')
    return "\"${normalized}\""
}

def aqlPropertyOrEnvironment = { String name, String defaultValue ->
    providers.gradleProperty(name)
            .orElse(providers.environmentVariable(name))
            .getOrElse(defaultValue)
}

def otaManifestPublicKeyPem = aqlPropertyOrEnvironment(
        "AQL_OTA_MANIFEST_PUBLIC_KEY_PEM",
        ""
)

def otaManifestKeyId = aqlPropertyOrEnvironment(
        "AQL_OTA_MANIFEST_KEY_ID",
        "aql-ota-manifest-2026-01"
)

def releaseVersionName = aqlPropertyOrEnvironment("AQL_VERSION_NAME", "1.0.0")
def releaseVersionCodeText = aqlPropertyOrEnvironment("AQL_VERSION_CODE", "1")
def releaseVersionCode

try {
    releaseVersionCode = Integer.parseInt(releaseVersionCodeText)
} catch (NumberFormatException exception) {
    throw new GradleException(
            "AQL_VERSION_CODE must be a positive Android versionCode integer.",
            exception
    )
}

if (releaseVersionCode <= 0 || releaseVersionCode > 2_100_000_000) {
    throw new GradleException(
            "AQL_VERSION_CODE must be in the Android range 1..2100000000."
    )
}

if (!(releaseVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
    throw new GradleException(
            "AQL_VERSION_NAME must use the stable MAJOR.MINOR.PATCH format."
    )
}

def releaseKeystoreFile = file(aqlPropertyOrEnvironment(
        "AQL_RELEASE_KEYSTORE_PATH",
        rootProject.file("release-key.jks").absolutePath
))
def releaseKeystorePassword = providers
        .environmentVariable("RELEASE_KEYSTORE_PASSWORD")
        .getOrElse("")
def releaseKeyAlias = providers
        .environmentVariable("RELEASE_KEY_ALIAS")
        .getOrElse("")
def releaseKeyPassword = providers
        .environmentVariable("RELEASE_KEY_PASSWORD")
        .getOrElse("")

android {
    namespace "com.aqua.aqualight"
    compileSdk 36

    defaultConfig {
        applicationId "com.aqua.aqualight"
        minSdk 27
        targetSdk 36
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "AQL_OTA_MANIFEST_PUBLIC_KEY_PEM", aqlBuildConfigString(otaManifestPublicKeyPem)
        buildConfigField "String", "AQL_OTA_MANIFEST_KEY_ID", aqlBuildConfigString(otaManifestKeyId)
    }

    signingConfigs {
        release {
            storeFile releaseKeystoreFile
            storePassword releaseKeystorePassword
            keyAlias releaseKeyAlias
            keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        releaseSmoke {
            initWith release
            signingConfig signingConfigs.release
            matchingFallbacks = ['release']
            debuggable true
            minifyEnabled true
            shrinkResources true
            versionNameSuffix "-smoke"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt',
                    'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt',
                    'META-INF/AL2.0', 'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        htmlReport true
        xmlReport true
        abortOnError true
        warningsAsErrors true
        checkReleaseBuilds true
    }

    buildFeatures { buildConfig true; viewBinding true }

    sourceSets {
        test {
            resources.srcDir rootProject.file("protocol/fixtures")
        }
    }
}

ktlint {
    version = "1.8.0"
    android = true
    outputToConsole = true
    ignoreFailures = false
    baseline = file("ktlint-baseline.xml")
    reporters {
        reporter "plain"
        reporter "checkstyle"
        reporter "sarif"
    }
    filter {
        exclude("**/build/**")
        exclude("**/generated/**")
    }
}

kover {
    useJacoco("0.8.15")
    reports {
        filters {
            excludes {
                classes(
                        "*.R",
                        '*.R$*',
                        "*.BuildConfig",
                        "*.*Binding",
                        "*.databinding.*",
                        "*.proto.*"
                )
            }
        }
    }
}

tasks.named("cyclonedxDirectBom") {
    includeConfigs = ["releaseRuntimeClasspath"]
    skipConfigs = [".*[Tt]est.*", ".*[Dd]ebug.*", ".*[Rr]eleaseSmoke.*"]
    projectType = "application"
    componentGroup = "com.aqua"
    componentName = "AquaLight"
    componentVersion = releaseVersionName
    includeBomSerialNumber = true
    includeLicenseText = false
    includeMetadataResolution = true
    includeBuildEnvironment = false
    includeBuildSystem = true
    jsonOutput = layout.buildDirectory.file(
            "reports/cyclonedx-release/AquaLight-${releaseVersionName}-sbom.cdx.json"
    ).get().asFile
    xmlOutput.unsetConvention()
}

def verifyReleaseSigningConfiguration = tasks.register("verifyReleaseSigningConfiguration") {
    group = "verification"
    description = "Fails closed when release signing material is missing or invalid."

    doLast {
        def requiredValues = [
                RELEASE_KEYSTORE_PASSWORD: releaseKeystorePassword,
                RELEASE_KEY_ALIAS         : releaseKeyAlias,
                RELEASE_KEY_PASSWORD      : releaseKeyPassword
        ]
        def missing = requiredValues
                .findAll { _, value -> value == null || value.trim().isEmpty() }
                .keySet()
                .sort()

        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Missing release signing environment variable(s): ${missing.join(', ')}"
            )
        }
        if (!releaseKeystoreFile.isFile() || releaseKeystoreFile.length() == 0L) {
            throw new GradleException(
                    "Release keystore is missing or empty at ${releaseKeystoreFile.absolutePath}."
            )
        }
        logger.lifecycle("Release signing material is present; cryptographic validation remains a CI gate.")
    }
}

tasks.matching {
    it.name == "preReleaseBuild" || it.name == "preReleaseSmokeBuild"
}.configureEach {
    dependsOn(verifyReleaseSigningConfiguration)
}

