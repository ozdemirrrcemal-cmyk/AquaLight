def aqlBuildConfigString = { value ->
    def normalized = (value ?: "")
            .replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\r', '')
            .replace('\n', '\\n')
    return "\"${normalized}\""
}

def propertyOrEnvironment = { String name ->
    providers.gradleProperty(name).orElse(providers.environmentVariable(name))
}

def otaManifestPublicKeyPem = propertyOrEnvironment("AQL_OTA_MANIFEST_PUBLIC_KEY_PEM").getOrElse("")
def otaManifestKeyId = propertyOrEnvironment("AQL_OTA_MANIFEST_KEY_ID").getOrElse("aql-ota-manifest-2026-01")
def releaseVersionNameProvider = propertyOrEnvironment("AQL_VERSION_NAME")
def releaseVersionCodeProvider = propertyOrEnvironment("AQL_VERSION_CODE")
def releaseKeystorePathProvider = propertyOrEnvironment("AQL_RELEASE_KEYSTORE_PATH")
def releaseStorePasswordProvider = propertyOrEnvironment("RELEASE_KEYSTORE_PASSWORD")
def releaseKeyAliasProvider = propertyOrEnvironment("RELEASE_KEY_ALIAS")
def releaseKeyPasswordProvider = propertyOrEnvironment("RELEASE_KEY_PASSWORD")

def configuredVersionName = releaseVersionNameProvider.getOrElse("0.0.0-local")
def configuredVersionCode = releaseVersionCodeProvider.map { raw ->
    try {
        return Integer.parseInt(raw)
    } catch (NumberFormatException exception) {
        throw new GradleException("AQL_VERSION_CODE must be a positive integer.", exception)
    }
}.getOrElse(1)

android {
    namespace "com.aqua.aqualight"
    compileSdk 36

    defaultConfig {
        applicationId "com.aqua.aqualight"
        minSdk 27
        targetSdk 36
        versionCode configuredVersionCode
        versionName configuredVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "AQL_OTA_MANIFEST_PUBLIC_KEY_PEM", aqlBuildConfigString(otaManifestPublicKeyPem)
        buildConfigField "String", "AQL_OTA_MANIFEST_KEY_ID", aqlBuildConfigString(otaManifestKeyId)
    }

    flavorDimensions += "environment"
    productFlavors {
        development {
            dimension "environment"
            applicationIdSuffix ".debug"
            versionNameSuffix "-dev"
            buildConfigField "String", "AQL_ENVIRONMENT", '"development"'
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
            buildConfigField "String", "AQL_ENVIRONMENT", '"staging"'
        }
        production {
            dimension "environment"
            buildConfigField "String", "AQL_ENVIRONMENT", '"production"'
        }
    }

    signingConfigs {
        release {
            if (releaseKeystorePathProvider.isPresent()) {
                storeFile file(releaseKeystorePathProvider.get())
            }
            storePassword releaseStorePasswordProvider.orNull
            keyAlias releaseKeyAliasProvider.orNull
            keyPassword releaseKeyPasswordProvider.orNull
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".local"
            versionNameSuffix "-debug"
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        releaseSmoke {
            initWith release
            signingConfig signingConfigs.release
            matchingFallbacks = ['release']
            debuggable true
            minifyEnabled true
            shrinkResources true
            versionNameSuffix "-smoke"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt',
                    'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt',
                    'META-INF/AL2.0', 'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        htmlReport true
        xmlReport true
        sarifReport true
        abortOnError true
        warningsAsErrors false
        checkReleaseBuilds true
    }

    buildFeatures { buildConfig true; viewBinding true }

    sourceSets {
        test {
            resources.srcDir rootProject.file("protocol/fixtures")
        }
    }
}

