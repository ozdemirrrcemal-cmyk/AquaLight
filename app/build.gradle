plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.protobuf'
    id 'androidx.navigation.safeargs.kotlin'
}

def aqlBuildConfigString = { value ->
    def normalized = (value ?: "")
            .replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\r', '')
            .replace('\n', '\\n')
    return "\"${normalized}\""
}

def otaManifestPublicKeyPem = providers
        .gradleProperty("AQL_OTA_MANIFEST_PUBLIC_KEY_PEM")
        .orElse(providers.environmentVariable("AQL_OTA_MANIFEST_PUBLIC_KEY_PEM"))
        .getOrElse("")

def otaManifestKeyId = providers
        .gradleProperty("AQL_OTA_MANIFEST_KEY_ID")
        .orElse(providers.environmentVariable("AQL_OTA_MANIFEST_KEY_ID"))
        .getOrElse("aql-ota-manifest-2026-01")

android {
    namespace "com.aqua.aqualight"
    compileSdk 36

    defaultConfig {
        applicationId "com.aqua.aqualight"
        minSdk 27
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "AQL_OTA_MANIFEST_PUBLIC_KEY_PEM", aqlBuildConfigString(otaManifestPublicKeyPem)
        buildConfigField "String", "AQL_OTA_MANIFEST_KEY_ID", aqlBuildConfigString(otaManifestKeyId)
    }

    signingConfigs {
        release {
            storeFile file("../release-key.jks")
            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
            keyAlias System.getenv("RELEASE_KEY_ALIAS")
            keyPassword System.getenv("RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            pseudoLocalesEnabled true
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        releaseSmoke {
            initWith release
            signingConfig signingConfigs.release
            matchingFallbacks = ['release']
            debuggable true
            minifyEnabled true
            shrinkResources true
            pseudoLocalesEnabled true
            versionNameSuffix "-smoke"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt',
                'META-INF/NOTICE',  'META-INF/NOTICE.txt',  'META-INF/notice.txt',
                'META-INF/AL2.0', 'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        checkOnly.add("UnusedResources")
        htmlReport true
        xmlReport true
        abortOnError true
        warningsAsErrors true
    }

    buildFeatures { buildConfig true; viewBinding true }

    sourceSets {
        debug {
            java.srcDir "src/releaseSmoke/java"
        }
        test {
            resources.srcDir rootProject.file("protocol/fixtures")
        }
    }
}

