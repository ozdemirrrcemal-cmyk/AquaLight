plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.protobuf'
    id 'androidx.navigation.safeargs.kotlin'
}

def aqlBuildConfigString = { value ->
    def normalized = (value ?: "")
            .replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\r', '')
            .replace('\n', '\\n')
    return "\"${normalized}\""
}

def otaManifestPublicKeyPem = providers
        .gradleProperty("AQL_OTA_MANIFEST_PUBLIC_KEY_PEM")
        .orElse(providers.environmentVariable("AQL_OTA_MANIFEST_PUBLIC_KEY_PEM"))
        .getOrElse("")

def otaManifestKeyId = providers
        .gradleProperty("AQL_OTA_MANIFEST_KEY_ID")
        .orElse(providers.environmentVariable("AQL_OTA_MANIFEST_KEY_ID"))
        .getOrElse("aql-ota-manifest-2026-01")

def aqlVersionName = providers
        .gradleProperty("AQL_VERSION_NAME")
        .orElse(providers.environmentVariable("AQL_VERSION_NAME"))
        .getOrElse("0.0.0-dev")

def aqlVersionCodeRaw = providers
        .gradleProperty("AQL_VERSION_CODE")
        .orElse(providers.environmentVariable("AQL_VERSION_CODE"))
        .getOrElse("1")

def aqlVersionCode
try {
    aqlVersionCode = Integer.parseInt(aqlVersionCodeRaw)
} catch (NumberFormatException ignored) {
    throw new GradleException("AQL_VERSION_CODE must be a positive integer: '${aqlVersionCodeRaw}'")
}
if (aqlVersionCode < 1 || aqlVersionCode > 2100000000) {
    throw new GradleException("AQL_VERSION_CODE must be between 1 and 2100000000.")
}

def releaseKeystorePath = providers
        .gradleProperty("AQL_RELEASE_KEYSTORE_PATH")
        .orElse(providers.environmentVariable("AQL_RELEASE_KEYSTORE_PATH"))
        .getOrElse("release-key.jks")

def releaseKeystoreFile = rootProject.file(releaseKeystorePath)
def releaseKeystorePassword = providers
        .environmentVariable("RELEASE_KEYSTORE_PASSWORD")
        .getOrElse("")
def releaseKeyAlias = providers
        .environmentVariable("RELEASE_KEY_ALIAS")
        .getOrElse("")
def releaseKeyPassword = providers
        .environmentVariable("RELEASE_KEY_PASSWORD")
        .getOrElse("")

def hasReleaseSigningMaterial = releaseKeystoreFile.isFile() &&
        !releaseKeystorePassword.isBlank() &&
        !releaseKeyAlias.isBlank() &&
        !releaseKeyPassword.isBlank()

android {
    namespace "com.aqua.aqualight"
    compileSdk 36

    defaultConfig {
        applicationId "com.aqua.aqualight"
        minSdk 27
        targetSdk 36
        versionCode aqlVersionCode
        versionName aqlVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "AQL_OTA_MANIFEST_PUBLIC_KEY_PEM", aqlBuildConfigString(otaManifestPublicKeyPem)
        buildConfigField "String", "AQL_OTA_MANIFEST_KEY_ID", aqlBuildConfigString(otaManifestKeyId)
    }

    signingConfigs {
        release {
            if (hasReleaseSigningMaterial) {
                storeFile releaseKeystoreFile
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigningMaterial) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        releaseSmoke {
            initWith release
            if (hasReleaseSigningMaterial) {
                signingConfig signingConfigs.release
            }
            matchingFallbacks = ['release']
            debuggable true
            minifyEnabled true
            shrinkResources true
            versionNameSuffix "-smoke"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt',
                'META-INF/NOTICE',  'META-INF/NOTICE.txt',  'META-INF/notice.txt',
                'META-INF/AL2.0', 'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        htmlReport true
        xmlReport true
        abortOnError true
        warningsAsErrors true
    }

    buildFeatures { buildConfig true; viewBinding true }

    sourceSets {
        test {
            resources.srcDir rootProject.file("protocol/fixtures")
        }
    }
}

