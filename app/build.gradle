abstract class ExpandLintBaselineTask extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getCompressedBaseline()

    @OutputFile
    abstract RegularFileProperty getExpandedBaseline()

    @TaskAction
    void expandBaseline() {
        def source = compressedBaseline.get().asFile
        def target = expandedBaseline.get().asFile
        target.parentFile.mkdirs()
        source.withInputStream { input ->
            new GZIPInputStream(input).withCloseable { gzip ->
                target.withOutputStream { output -> output << gzip }
            }
        }
    }
}

def aqlBuildConfigString = { value ->
    def normalized = (value ?: "")
            .replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\r', '')
            .replace('\n', '\\n')
    return "\"${normalized}\""
}

def googlePlayMaxVersionCode = 2100000000

def aqlVersionCode = providers
        .gradleProperty("AQL_VERSION_CODE")
        .orElse(providers.environmentVariable("AQL_VERSION_CODE"))
        .orElse(providers.environmentVariable("GITHUB_RUN_NUMBER"))
        .orElse("1")
        .map { rawValue ->
            def normalized = rawValue.trim()
            int parsed
            try {
                parsed = Integer.parseInt(normalized)
            } catch (NumberFormatException ignored) {
                throw new GradleException(
                        "AQL_VERSION_CODE/GITHUB_RUN_NUMBER must be a positive integer, got '${normalized}'."
                )
            }
            if (parsed < 1 || parsed > googlePlayMaxVersionCode) {
                throw new GradleException(
                        "versionCode must be between 1 and ${googlePlayMaxVersionCode}, got ${parsed}."
                )
            }
            return parsed
        }
        .get()

def configuredReleaseIdentity = providers
        .gradleProperty("AQL_RELEASE_VERSION")
        .orElse(providers.environmentVariable("AQL_RELEASE_VERSION"))
        .orElse(providers.gradleProperty("AQL_RELEASE_TAG"))
        .orElse(providers.environmentVariable("AQL_RELEASE_TAG"))
        .getOrElse("")
        .trim()

def githubReleaseTag = providers.environmentVariable("GITHUB_REF_TYPE")
        .getOrElse("")
        .trim() == "tag"
        ? providers.environmentVariable("GITHUB_REF_NAME").getOrElse("").trim()
        : ""

def aqlReleaseIdentity = configuredReleaseIdentity ?: githubReleaseTag
def aqlVersionName = "1.0.0"

if (!aqlReleaseIdentity.isEmpty()) {
    def releaseIdentityMatcher = aqlReleaseIdentity =~ /^(?:v)?(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/
    if (!releaseIdentityMatcher.matches()) {
        throw new GradleException(
                "Release identity must be vMAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH, got '${aqlReleaseIdentity}'."
        )
    }
    aqlVersionName = "${releaseIdentityMatcher.group(1)}.${releaseIdentityMatcher.group(2)}.${releaseIdentityMatcher.group(3)}"
}

def otaManifestPublicKeyPem = providers
        .gradleProperty("AQL_OTA_MANIFEST_PUBLIC_KEY_PEM")
        .orElse(providers.environmentVariable("AQL_OTA_MANIFEST_PUBLIC_KEY_PEM"))
        .getOrElse("")

def otaManifestKeyId = providers
        .gradleProperty("AQL_OTA_MANIFEST_KEY_ID")
        .orElse(providers.environmentVariable("AQL_OTA_MANIFEST_KEY_ID"))
        .getOrElse("aql-ota-manifest-2026-01")

def requireProductScopedManifestTemplate = { String label, String value ->
    def officialChannelPattern = java.util.regex.Pattern.compile(
            '^https://raw\\.githubusercontent\\.com/' +
                    'ozdemirrrcemal-cmyk/AquaLight-OTA-Releases/main/channels/' +
                    '(stable|beta|dev)/\\{env\\}/manifest-\\1\\.json$'
    )
    if (value.count("{env}") != 1 || !(value ==~ officialChannelPattern)) {
        throw new GradleException(
                "${label} must be an exact product-scoped channel file with one {env} placeholder."
        )
    }
    value
}

def stableOtaManifestUrl = requireProductScopedManifestTemplate(
        "AQL_OTA_STABLE_MANIFEST_URL",
        providers
        .gradleProperty("AQL_OTA_STABLE_MANIFEST_URL")
        .orElse(providers.environmentVariable("AQL_OTA_STABLE_MANIFEST_URL"))
        .getOrElse(
                "https://raw.githubusercontent.com/ozdemirrrcemal-cmyk/" +
                        "AquaLight-OTA-Releases/main/channels/stable/" +
                        "{env}/manifest-stable.json"
        )
)

// A beta asset is not published yet. Internal builds can opt in as soon as one exists;
// otherwise they deliberately use the same verified stable manifest instead of a dead URL.
def debugOtaManifestUrl = requireProductScopedManifestTemplate(
        "AQL_OTA_DEBUG_MANIFEST_URL",
        providers
        .gradleProperty("AQL_OTA_DEBUG_MANIFEST_URL")
        .orElse(providers.environmentVariable("AQL_OTA_DEBUG_MANIFEST_URL"))
        .getOrElse(stableOtaManifestUrl)
)

def lintBaselineFile = layout.projectDirectory.file("lint-baseline.xml")
def finalLintModeValue = providers
        .gradleProperty("AQL_FINAL_LINT")
        .getOrElse("false")
        .trim()
        .toLowerCase(Locale.ROOT)
if (!(finalLintModeValue in ["true", "false"])) {
    throw new GradleException(
            "AQL_FINAL_LINT must be exactly 'true' or 'false', got '${finalLintModeValue}'."
    )
}
def finalLintMode = finalLintModeValue == "true"

def prepareLintBaseline = tasks.register("prepareLintBaseline", ExpandLintBaselineTask) {
    compressedBaseline.set(layout.projectDirectory.file("lint-baseline.xml.gz"))
    expandedBaseline.set(lintBaselineFile)
}

android {
    namespace "com.aqua.aqualight"
    compileSdk 36

    defaultConfig {
        applicationId "com.aqua.aqualight"
        minSdk 27
        targetSdk 36
        versionCode aqlVersionCode
        versionName aqlVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "AQL_OTA_MANIFEST_PUBLIC_KEY_PEM", aqlBuildConfigString(otaManifestPublicKeyPem)
        buildConfigField "String", "AQL_OTA_MANIFEST_KEY_ID", aqlBuildConfigString(otaManifestKeyId)
        buildConfigField "String", "AQL_OTA_MANIFEST_URL", aqlBuildConfigString(stableOtaManifestUrl)
    }

    signingConfigs {
        release {
            storeFile file("../release-key.jks")
            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
            keyAlias System.getenv("RELEASE_KEY_ALIAS")
            keyPassword System.getenv("RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "AQL_OTA_MANIFEST_URL", aqlBuildConfigString(debugOtaManifestUrl)
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        releaseSmoke {
            initWith release
            signingConfig signingConfigs.release
            matchingFallbacks = ['release']
            debuggable false
            minifyEnabled true
            shrinkResources true
            versionNameSuffix "-smoke"
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    packaging {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt',
                'META-INF/NOTICE',  'META-INF/NOTICE.txt',  'META-INF/notice.txt',
                'META-INF/AL2.0', 'META-INF/LGPL2.1'
            ]
        }
    }
   	
    lint {
        if (!finalLintMode) {
            baseline = lintBaselineFile.asFile
        }
        htmlReport true
        xmlReport true
        abortOnError true
        warningsAsErrors !finalLintMode
        checkReleaseBuilds true
    }

    buildFeatures { buildConfig true; viewBinding true; compose true }

    sourceSets {
        test {
            resources.srcDir rootProject.file("protocol/fixtures")
        }
    }
}

tasks.configureEach { task ->
    def taskName = task.name.toLowerCase()
    if (!finalLintMode &&
            task.name != "prepareLintBaseline" &&
            taskName.contains("lint")) {
        task.dependsOn(prepareLintBaseline)
    }
}

