plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.protobuf'
    id 'androidx.navigation.safeargs.kotlin'
    id 'jacoco'
}

def aqlBuildConfigString = { value ->
    def normalized = (value ?: "")
            .replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\r', '')
            .replace('\n', '\\n')
    return "\"${normalized}\""
}

def providerValue = { String name, String fallback ->
    providers.gradleProperty(name)
            .orElse(providers.environmentVariable(name))
            .getOrElse(fallback)
}

def aqlVersionName = providerValue("AQL_VERSION_NAME", "0.0.0-dev")
def aqlVersionCodeText = providerValue("AQL_VERSION_CODE", "1")
def aqlVersionCode
try {
    aqlVersionCode = Integer.parseInt(aqlVersionCodeText)
} catch (NumberFormatException error) {
    throw new GradleException("AQL_VERSION_CODE must be an integer: ${aqlVersionCodeText}", error)
}
if (aqlVersionCode <= 0 || aqlVersionCode > 2_100_000_000) {
    throw new GradleException("AQL_VERSION_CODE must be between 1 and 2100000000")
}

def releaseKeystorePath = providerValue(
        "RELEASE_KEYSTORE_FILE",
        rootProject.file("release-key.jks").absolutePath
)
def enforceReleaseConfiguration = providerValue(
        "AQL_ENFORCE_RELEASE_CONFIGURATION",
        "false"
).toBoolean()

def otaManifestPublicKeyPem = providerValue("AQL_OTA_MANIFEST_PUBLIC_KEY_PEM", "")
def otaManifestKeyId = providerValue(
        "AQL_OTA_MANIFEST_KEY_ID",
        "aql-ota-manifest-2026-01"
)

android {
    namespace "com.aqua.aqualight"
    compileSdk 36

    defaultConfig {
        applicationId "com.aqua.aqualight"
        minSdk 27
        targetSdk 36
        versionCode aqlVersionCode
        versionName aqlVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "AQL_OTA_MANIFEST_PUBLIC_KEY_PEM", aqlBuildConfigString(otaManifestPublicKeyPem)
        buildConfigField "String", "AQL_OTA_MANIFEST_KEY_ID", aqlBuildConfigString(otaManifestKeyId)
    }

    signingConfigs {
        release {
            storeFile file(releaseKeystorePath)
            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
            keyAlias System.getenv("RELEASE_KEY_ALIAS")
            keyPassword System.getenv("RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        debug {
            enableUnitTestCoverage true
            buildConfigField "String", "AQL_ENVIRONMENT", '"debug"'
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "AQL_ENVIRONMENT", '"production"'
        }

        releaseSmoke {
            initWith release
            signingConfig signingConfigs.release
            matchingFallbacks = ['release']
            debuggable true
            minifyEnabled true
            shrinkResources true
            versionNameSuffix "-smoke"
            buildConfigField "String", "AQL_ENVIRONMENT", '"staging-smoke"'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt',
                    'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt',
                    'META-INF/AL2.0', 'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        htmlReport true
        xmlReport true
        abortOnError true
        warningsAsErrors true
        checkReleaseBuilds true
    }

    testOptions {
        unitTests.all {
            jacoco.includeNoLocationClasses = true
            jacoco.excludes = ['jdk.internal.*']
        }
    }

    buildFeatures { buildConfig true; viewBinding true }

    sourceSets {
        test {
            resources.srcDir rootProject.file("protocol/fixtures")
        }
    }
}

jacoco {
    toolVersion = "0.8.14"
}

configurations {
    aqlDetekt
}

def aqlDetektSourcePaths = [
        file("src/main/java"),
        file("src/main/kotlin")
].findAll { it.isDirectory() }

def aqlDetektReportDirectory = file("$buildDir/reports/detekt")
def aqlDetektReportFiles = [
        html: new File(aqlDetektReportDirectory, "detekt.html"),
        xml: new File(aqlDetektReportDirectory, "detekt.xml"),
        sarif: new File(aqlDetektReportDirectory, "detekt.sarif")
]

def aqlDetektTask = tasks.register("aqlDetekt", JavaExec) {
    group = "verification"
    description = "Runs Detekt in transitional reporting mode without the conflicting Gradle lifecycle plugin."
    classpath = configurations.aqlDetekt
    mainClass.set("io.gitlab.arturbosch.detekt.cli.Main")
    ignoreExitValue = true

    inputs.files(aqlDetektSourcePaths)
            .withPropertyName("detektSources")
            .withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.files(aqlDetektReportFiles.values())
            .withPropertyName("detektReports")

    args(
            "--input", aqlDetektSourcePaths.collect { it.absolutePath }.join(","),
            "--build-upon-default-config",
            "--parallel",
            "--report", "html:${aqlDetektReportFiles.html.absolutePath}",
            "--report", "xml:${aqlDetektReportFiles.xml.absolutePath}",
            "--report", "sarif:${aqlDetektReportFiles.sarif.absolutePath}"
    )

    doFirst {
        aqlDetektReportDirectory.mkdirs()
    }
    doLast {
        def missingReports = aqlDetektReportFiles.values().findAll { !it.isFile() }
        if (!missingReports.isEmpty()) {
            throw new GradleException(
                    "Detekt did not produce the required report(s): " +
                            missingReports.collect { it.absolutePath }.join(", ")
            )
        }
    }
}

// Preserve the existing CI command contract while avoiding duplicate task registration.
def existingDetektTask = tasks.findByName("detekt")
if (existingDetektTask == null) {
    tasks.register("detekt") {
        group = "verification"
        description = "Compatibility lifecycle task for AquaLight Detekt analysis."
        dependsOn aqlDetektTask
    }
} else {
    existingDetektTask.dependsOn aqlDetektTask
}

