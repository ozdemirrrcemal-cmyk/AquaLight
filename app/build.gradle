def coverageExclusions = [
        '**/R.class',
        '**/R$*.class',
        '**/BuildConfig.*',
        '**/Manifest*.*',
        '**/*Test*.*',
        '**/*_Factory.*',
        '**/*_MembersInjector.*',
        '**/*Directions*.*',
        '**/*Args*.*',
        '**/databinding/**',
        '**/generated/**'
]

def debugCoverageClassDirectories = files(
        fileTree(dir: "$buildDir/tmp/kotlin-classes/debug", excludes: coverageExclusions),
        fileTree(dir: "$buildDir/intermediates/javac/debug/classes", excludes: coverageExclusions)
)

def criticalCoverageIncludes = [
        '**/data/auth/AppSessionCoordinator*.class',
        '**/data/care/CareTaskStoreRules*.class',
        '**/data/user/UserDataScope*.class'
]

def criticalCoverageClassDirectories = files(
        fileTree(
                dir: "$buildDir/tmp/kotlin-classes/debug",
                includes: criticalCoverageIncludes,
                excludes: coverageExclusions
        ),
        fileTree(
                dir: "$buildDir/intermediates/javac/debug/classes",
                includes: criticalCoverageIncludes,
                excludes: coverageExclusions
        )
)

def debugCoverageExecutionData = fileTree(
        dir: buildDir,
        includes: [
                'outputs/unit_test_code_coverage/debugUnitTest/testDebugUnitTest.exec',
                'jacoco/testDebugUnitTest.exec'
        ]
)

tasks.register("jacocoDebugUnitTestReport", JacocoReport) {
    dependsOn "testDebugUnitTest"
    group = "verification"
    description = "Generates JaCoCo coverage for Debug unit tests."

    reports {
        xml.required.set(true)
        html.required.set(true)
        csv.required.set(false)
    }

    classDirectories.setFrom(debugCoverageClassDirectories)
    sourceDirectories.setFrom(files("src/main/java", "src/main/kotlin"))
    executionData.setFrom(debugCoverageExecutionData)
}

tasks.register("jacocoDebugCoverageVerification", JacocoCoverageVerification) {
    dependsOn "testDebugUnitTest"
    group = "verification"
    description = "Enforces the minimum line coverage for commercial-critical classes."

    classDirectories.setFrom(criticalCoverageClassDirectories)
    sourceDirectories.setFrom(files("src/main/java", "src/main/kotlin"))
    executionData.setFrom(debugCoverageExecutionData)

    violationRules {
        rule {
            element = 'CLASS'
            includes = [
                    'com.aqua.aqualight.data.auth.AppSessionCoordinator*',
                    'com.aqua.aqualight.data.care.CareTaskStoreRules*',
                    'com.aqua.aqualight.data.user.UserDataScope*'
            ]
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.60
            }
        }
    }
}

tasks.named("check").configure {
    dependsOn "jacocoDebugUnitTestReport", "jacocoDebugCoverageVerification"
}

def verifyReleaseConfiguration = tasks.register("verifyReleaseConfiguration") {
    group = "verification"
    description = "Validates production versioning and release signing inputs."

    doLast {
        if (!enforceReleaseConfiguration) {
            logger.lifecycle(
                    "Production release configuration enforcement is disabled for this build. " +
                            "Set AQL_ENFORCE_RELEASE_CONFIGURATION=true in the controlled release workflow."
            )
            return
        }

        if (!(aqlVersionName ==~ /\d+\.\d+\.\d+(?:-(?:alpha|beta|rc)\.\d+)?/)) {
            throw new GradleException("Invalid production AQL_VERSION_NAME: ${aqlVersionName}")
        }
        if (!file(releaseKeystorePath).isFile()) {
            throw new GradleException("Release keystore does not exist: ${releaseKeystorePath}")
        }

        [
                "RELEASE_KEYSTORE_PASSWORD",
                "RELEASE_KEY_ALIAS",
                "RELEASE_KEY_PASSWORD"
        ].each { variable ->
            if ((System.getenv(variable) ?: "").trim().isEmpty()) {
                throw new GradleException("Required release signing variable is missing: ${variable}")
            }
        }
    }
}

tasks.matching { task ->
    task.name == "bundleRelease" || task.name == "assembleRelease"
}.configureEach {
    dependsOn verifyReleaseConfiguration
}

def forbiddenFirebaseRuntimeModules = [
        "firebase-analytics",
        "firebase-analytics-ktx",
        "firebase-database",
        "firebase-database-ktx",
        "firebase-messaging",
        "firebase-messaging-ktx",
        "firebase-config",
        "firebase-config-ktx",
        "firebase-perf",
        "firebase-perf-ktx",
        "firebase-crashlytics",
        "firebase-crashlytics-ktx"
] as Set

tasks.register("verifyFirebaseRuntimePolicy") {
    group = "verification"
    description = "Fails when an unapproved Firebase runtime resolves transitively."

    inputs.property(
            "forbiddenFirebaseRuntimeModules",
            forbiddenFirebaseRuntimeModules.toList().sort()
    )
    inputs.files(
            configurations.named("debugRuntimeClasspath"),
            configurations.named("releaseRuntimeClasspath")
    ).withPropertyName("firebaseRuntimeClasspaths").withPathSensitivity(PathSensitivity.NONE)

    doLast { task ->
        def modules = task.inputs.properties["forbiddenFirebaseRuntimeModules"] as List
        def forbidden = task.inputs.files.files
                .findAll { file ->
                    modules.any { module ->
                        def versionedPrefix = "${module}-"
                        def versionAndExtension = file.name.startsWith(versionedPrefix)
                                ? file.name.substring(versionedPrefix.length())
                                : ""
                        !versionAndExtension.isEmpty() &&
                                Character.isDigit(versionAndExtension.charAt(0)) &&
                                (versionAndExtension.endsWith(".aar") ||
                                        versionAndExtension.endsWith(".jar"))
                    }
                }
                .collect { file -> file.name }
                .unique()
                .sort()

        if (!forbidden.isEmpty()) {
            throw new GradleException(
                    "Forbidden Firebase runtime artifact(s): ${forbidden.join(', ')}"
            )
        }
        task.logger.lifecycle("Firebase runtime policy passed: Auth and Firestore only.")
    }
}
