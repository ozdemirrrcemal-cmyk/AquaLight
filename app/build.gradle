plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.protobuf'
    id 'androidx.navigation.safeargs.kotlin'
    id 'io.gitlab.arturbosch.detekt'
    id 'org.jetbrains.kotlinx.kover'
}

def aqlBuildConfigString = { value ->
    def normalized = (value ?: '')
            .replace('\\', '\\\\')
            .replace('"', '\\"')
            .replace('\r', '')
            .replace('\n', '\\n')
    return "\"${normalized}\""
}

def resolvedVersionCodeText = providers
        .gradleProperty('AQL_VERSION_CODE')
        .orElse(providers.environmentVariable('AQL_VERSION_CODE'))
        .getOrElse('1')

def resolvedVersionName = providers
        .gradleProperty('AQL_VERSION_NAME')
        .orElse(providers.environmentVariable('AQL_VERSION_NAME'))
        .getOrElse('0.0.0-dev')

def resolvedVersionCode
try {
    resolvedVersionCode = Integer.parseInt(resolvedVersionCodeText)
} catch (NumberFormatException ignored) {
    throw new GradleException("AQL_VERSION_CODE must be an integer: '${resolvedVersionCodeText}'")
}
if (resolvedVersionCode < 1 || resolvedVersionCode > 2_100_000_000) {
    throw new GradleException('AQL_VERSION_CODE must be between 1 and 2100000000.')
}

def otaManifestPublicKeyPem = providers
        .gradleProperty('AQL_OTA_MANIFEST_PUBLIC_KEY_PEM')
        .orElse(providers.environmentVariable('AQL_OTA_MANIFEST_PUBLIC_KEY_PEM'))
        .getOrElse('')

def otaManifestKeyId = providers
        .gradleProperty('AQL_OTA_MANIFEST_KEY_ID')
        .orElse(providers.environmentVariable('AQL_OTA_MANIFEST_KEY_ID'))
        .getOrElse('aql-ota-manifest-2026-01')

def releaseKeystorePath = (System.getenv('RELEASE_KEYSTORE_PATH') ?: '').trim()
def releaseKeystorePassword = (System.getenv('RELEASE_KEYSTORE_PASSWORD') ?: '').trim()
def releaseKeyAlias = (System.getenv('RELEASE_KEY_ALIAS') ?: '').trim()
def releaseKeyPassword = (System.getenv('RELEASE_KEY_PASSWORD') ?: '').trim()
def releaseSigningReady = !releaseKeystorePath.isEmpty() &&
        !releaseKeystorePassword.isEmpty() &&
        !releaseKeyAlias.isEmpty() &&
        !releaseKeyPassword.isEmpty() &&
        file(releaseKeystorePath).isFile()

android {
    namespace 'com.aqua.aqualight'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aqua.aqualight'
        minSdk 27
        targetSdk 36
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'AQL_OTA_MANIFEST_PUBLIC_KEY_PEM', aqlBuildConfigString(otaManifestPublicKeyPem)
        buildConfigField 'String', 'AQL_OTA_MANIFEST_KEY_ID', aqlBuildConfigString(otaManifestKeyId)
        buildConfigField 'String', 'AQL_ENVIRONMENT', aqlBuildConfigString('production')
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'String', 'AQL_ENVIRONMENT', aqlBuildConfigString('debug')
        }

        release {
            def configuredReleaseSigning = signingConfigs.findByName('release')
            if (configuredReleaseSigning != null) {
                signingConfig configuredReleaseSigning
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField 'String', 'AQL_ENVIRONMENT', aqlBuildConfigString('production')
        }

        staging {
            initWith release
            signingConfig signingConfigs.debug
            applicationIdSuffix '.staging'
            versionNameSuffix '-staging'
            matchingFallbacks = ['release']
            debuggable true
            buildConfigField 'String', 'AQL_ENVIRONMENT', aqlBuildConfigString('staging')
        }

        releaseSmoke {
            initWith release
            def configuredReleaseSigning = signingConfigs.findByName('release')
            if (configuredReleaseSigning != null) {
                signingConfig configuredReleaseSigning
            }
            matchingFallbacks = ['release']
            debuggable true
            minifyEnabled true
            shrinkResources true
            versionNameSuffix '-smoke'
            buildConfigField 'String', 'AQL_ENVIRONMENT', aqlBuildConfigString('release-smoke')
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt',
                    'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt',
                    'META-INF/AL2.0', 'META-INF/LGPL2.1'
            ]
        }
    }

    lint {
        baseline = file('lint-baseline.xml')
        htmlReport true
        xmlReport true
        sarifReport true
        abortOnError true
        warningsAsErrors true
        checkReleaseBuilds true
        absolutePaths false
    }

    buildFeatures { buildConfig true; viewBinding true }

    sourceSets {
        test {
            resources.srcDir rootProject.file('protocol/fixtures')
        }
    }
}

detekt {
    toolVersion = '1.23.8'
    source = files('src/main/java', 'src/test/java', 'src/androidTest/java')
    parallel = true
    buildUponDefaultConfig = true
    allRules = false
    config.setFrom(rootProject.file('config/detekt/detekt.yml'))
    baseline = rootProject.file('config/detekt/baseline.xml')
    ignoreFailures = false
    basePath = rootProject.projectDir
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = '17'
    exclude('**/build/**', '**/generated/**')
    reports {
        xml.required.set(true)
        html.required.set(true)
        sarif.required.set(true)
        md.required.set(false)
    }
}

tasks.withType(io.gitlab.arturbosch.detekt.DetektCreateBaselineTask).configureEach {
    jvmTarget = '17'
    exclude('**/build/**', '**/generated/**')
}

kover {
    reports {
        filters {
            excludes {
                classes(
                        '*.BuildConfig',
                        '*.R',
                        '*.R$*',
                        '*.*Binding',
                        '*.*Directions',
                        '*.*Args'
                )
            }
        }
    }
}

dependencies {
    // Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:34.5.0')

    // Firebase runtime is deliberately limited to authentication and text feedback storage.
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.webkit:webkit:1.14.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.9.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.9.5'

    // Media3
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'

    // Image crop
    implementation 'com.github.yalantis:ucrop:2.2.11'

    implementation 'com.google.code.gson:gson:2.13.2'

    // WebSocket runtime
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // QR provisioning scanner
    implementation 'androidx.camera:camera-core:1.4.2'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // Lottie animations
    implementation 'com.airbnb.android:lottie:6.7.1'

    // Charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // BlurView
    implementation 'com.github.Dimezis:BlurView:version-2.0.6'

    // Phone numbers
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.18'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'

    // WorkManager
    implementation 'androidx.work:work-runtime-ktx:2.11.2'

    // Country code
    implementation 'com.hbb20:ccp:2.7.3'

    // Image loading
    implementation 'io.coil-kt.coil3:coil-android:3.3.0'
    implementation 'io.coil-kt.coil3:coil-network-okhttp:3.3.0'

    // Google Sign-In
    implementation 'com.google.android.gms:play-services-auth:21.4.0'

    // Desugar
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    // DataStore Proto
    implementation 'androidx.datastore:datastore:1.1.3'
    implementation 'com.google.protobuf:protobuf-javalite:3.25.3'
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Security
    implementation 'androidx.security:security-crypto:1.1.0'

    // Test
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'androidx.test:core-ktx:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

protobuf {
    protoc { artifact = 'com.google.protobuf:protoc:3.25.3' }
    generateProtoTasks {
        all().each { task ->
            task.builtins { java { option 'lite' } }
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("AquaLight-${resolvedVersionName}.apk")
        }
    }
}

tasks.register('verifyReleaseSigning') {
    group = 'verification'
    description = 'Fails fast when the production/release-smoke signing material is absent or incomplete.'

    doLast {
        def missing = []
        if (releaseKeystorePath.isEmpty()) missing += 'RELEASE_KEYSTORE_PATH'
        if (releaseKeystorePassword.isEmpty()) missing += 'RELEASE_KEYSTORE_PASSWORD'
        if (releaseKeyAlias.isEmpty()) missing += 'RELEASE_KEY_ALIAS'
        if (releaseKeyPassword.isEmpty()) missing += 'RELEASE_KEY_PASSWORD'
        if (!releaseKeystorePath.isEmpty() && !file(releaseKeystorePath).isFile()) {
            missing += "keystore file (${releaseKeystorePath})"
        }
        if (!missing.isEmpty()) {
            throw new GradleException("Release signing is not ready. Missing: ${missing.join(', ')}")
        }
    }
}

tasks.configureEach { task ->
    if (task.name in ['assembleRelease', 'bundleRelease', 'assembleReleaseSmoke']) {
        task.dependsOn(tasks.named('verifyReleaseSigning'))
    }
}

def forbiddenFirebaseRuntimeModules = [
        'firebase-analytics',
        'firebase-analytics-ktx',
        'firebase-database',
        'firebase-database-ktx',
        'firebase-messaging',
        'firebase-messaging-ktx',
        'firebase-config',
        'firebase-config-ktx',
        'firebase-perf',
        'firebase-perf-ktx',
        'firebase-crashlytics',
        'firebase-crashlytics-ktx'
] as Set

tasks.register('verifyFirebaseRuntimePolicy') {
    group = 'verification'
    description = 'Fails when an unapproved Firebase runtime resolves transitively.'

    inputs.property(
            'forbiddenFirebaseRuntimeModules',
            forbiddenFirebaseRuntimeModules.toList().sort()
    )
    inputs.files(
            configurations.named('debugRuntimeClasspath'),
            configurations.named('stagingRuntimeClasspath'),
            configurations.named('releaseRuntimeClasspath'),
            configurations.named('releaseSmokeRuntimeClasspath')
    ).withPropertyName('firebaseRuntimeClasspaths').withPathSensitivity(PathSensitivity.NONE)

    doLast { task ->
        def modules = task.inputs.properties['forbiddenFirebaseRuntimeModules'] as List
        def forbidden = task.inputs.files.files
                .findAll { artifact ->
                    modules.any { module ->
                        def versionedPrefix = "${module}-"
                        def versionAndExtension = artifact.name.startsWith(versionedPrefix)
                                ? artifact.name.substring(versionedPrefix.length())
                                : ''
                        !versionAndExtension.isEmpty() &&
                                Character.isDigit(versionAndExtension.charAt(0)) &&
                                (versionAndExtension.endsWith('.aar') ||
                                        versionAndExtension.endsWith('.jar'))
                    }
                }
                .collect { artifact -> artifact.name }
                .unique()
                .sort()

        if (!forbidden.isEmpty()) {
            throw new GradleException(
                    "Forbidden Firebase runtime artifact(s): ${forbidden.join(', ')}"
            )
        }
        task.logger.lifecycle('Firebase runtime policy passed: Auth and Firestore only.')
    }
}
