plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'com.google.protobuf' version '0.9.4' // 🧩 Proto DataStore için eklendi
}

android {
    namespace "com.aqua.aqualight"
    compileSdk 34

    defaultConfig {
        applicationId "com.aqua.aqualight"
        minSdk 27
        targetSdk 34
        versionCode 1
        versionName "1.0.10"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            storeFile file("../release-key.jks")
            storePassword System.getenv("RELEASE_KEYSTORE_PASSWORD")
            keyAlias System.getenv("RELEASE_KEY_ALIAS")
            keyPassword System.getenv("RELEASE_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        resources.excludes += [
            'META-INF/DEPENDENCIES',
            'META-INF/LICENSE',
            'META-INF/LICENSE.txt',
            'META-INF/license.txt',
            'META-INF/NOTICE',
            'META-INF/NOTICE.txt',
            'META-INF/notice.txt',
            'META-INF/AL2.0',
            'META-INF/LGPL2.1'
        ]
    }

    buildFeatures {
		buildConfig true
		viewBinding true
    }
}

dependencies {
    // 🧩 Android temel bileşenleri
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.appcompat:appcompat:1.6.1"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // 🧭 Navigation bileşenleri
    implementation "androidx.navigation:navigation-fragment-ktx:2.7.5"
    implementation "androidx.navigation:navigation-ui-ktx:2.7.5"

    // 📜 RecyclerView
    implementation "androidx.recyclerview:recyclerview:1.3.2"

    // 🎬 ExoPlayer (arka plan video için)
    implementation "com.google.android.exoplayer:exoplayer:2.19.1"

    // 🧊 BlurView (arka plan blur efekti için)
    implementation 'com.github.Dimezis:BlurView:version-2.0.4'

    // 🔥 Firebase
    implementation platform("com.google.firebase:firebase-bom:32.7.0")
    implementation "com.google.firebase:firebase-analytics"
    implementation "com.google.firebase:firebase-auth"
    implementation "com.google.firebase:firebase-firestore"
    implementation "com.google.firebase:firebase-database"
    implementation "com.google.firebase:firebase-storage"
    implementation "com.google.firebase:firebase-messaging"
    implementation "com.google.firebase:firebase-crashlytics"
    implementation "com.google.firebase:firebase-config"
    implementation "com.google.firebase:firebase-perf"

    // 🔐 Google Sign-In
    implementation "com.google.android.gms:play-services-auth:21.1.0"

    // ☕ Java 8+ API Desteği
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"

    // 🔹 Proto DataStore
    implementation "androidx.datastore:datastore:1.1.1"
    implementation "androidx.datastore:datastore-core:1.1.1"
    implementation "androidx.datastore:datastore-core-okio:1.1.1"

    // 🔒 Encryption (AndroidX Security)
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // 🔧 Protocol Buffers
    implementation "com.google.protobuf:protobuf-javalite:3.25.3"

    // 🧪 Test kütüphaneleri
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
}

// 🔧 Proto DataStore için gerekli Gradle yapılandırması
protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:3.25.3"
    }
    generateProtoTasks {
        all().each { task ->
            task.builtins {
                java {
                    option "lite"
                }
            }
        }
    }
}