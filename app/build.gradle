protobuf {
    protoc { artifact = "com.google.protobuf:protoc:3.25.3" }
    generateProtoTasks {
        all().each { task ->
            task.builtins { java { option "lite" } }
        }
    }
}

androidComponents {
    onVariants(selector().withBuildType("release")) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("AquaLight.apk")
        }
    }
}
