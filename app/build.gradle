detekt {
    buildUponDefaultConfig = true
    allRules = false
    ignoreFailures = false
    parallel = true
    config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
    basePath = rootDir.absolutePath
}

tasks.withType(io.gitlab.arturbosch.detekt.Detekt).configureEach {
    jvmTarget = "17"
    exclude("**/build/**", "**/generated/**")
    reports {
        html.required.set(true)
        xml.required.set(true)
        sarif.required.set(true)
        txt.required.set(false)
        md.required.set(false)
    }
}

def criticalCoverageIncludes = [
        "com/aqua/aqualight/application/feedback/**",
        "com/aqua/aqualight/data/auth/AccountDeletionCheckpoint*",
        "com/aqua/aqualight/data/auth/AppSessionCoordinator*",
        "com/aqua/aqualight/data/auth/OwnerSessionStateMachine*",
        "com/aqua/aqualight/data/feedback/FirebaseFeedbackSubmissionOperations*"
]
def generatedCoverageExcludes = [
        "**/R.class", "**/R$*.class", "**/BuildConfig.*", "**/Manifest*.*",
        "**/*Test*.*", "**/*_Factory.*", "**/*Directions*.*", "**/*Args*.*"
]
def criticalCoverageClassDirectories = files(
        fileTree(dir: "$buildDir/tmp/kotlin-classes/developmentDebug") {
            include criticalCoverageIncludes
            exclude generatedCoverageExcludes
        },
        fileTree(dir: "$buildDir/intermediates/javac/developmentDebug/classes") {
            include criticalCoverageIncludes
            exclude generatedCoverageExcludes
        }
)
def criticalCoverageSources = files("src/main/java", "src/main/kotlin")
def criticalCoverageExecutionData = fileTree(buildDir) {
    include "jacoco/testDevelopmentDebugUnitTest.exec"
    include "outputs/unit_test_code_coverage/developmentDebugUnitTest/testDevelopmentDebugUnitTest.exec"
}

tasks.register("jacocoCriticalCoverageReport", JacocoReport) {
    dependsOn "testDevelopmentDebugUnitTest"
    classDirectories.setFrom(criticalCoverageClassDirectories)
    sourceDirectories.setFrom(criticalCoverageSources)
    executionData.setFrom(criticalCoverageExecutionData)
    reports {
        xml.required.set(true)
        html.required.set(true)
        csv.required.set(false)
    }
}

tasks.register("jacocoCriticalCoverageVerification", JacocoCoverageVerification) {
    dependsOn "jacocoCriticalCoverageReport"
    classDirectories.setFrom(criticalCoverageClassDirectories)
    sourceDirectories.setFrom(criticalCoverageSources)
    executionData.setFrom(criticalCoverageExecutionData)
    violationRules {
        rule {
            element = "BUNDLE"
            limit {
                counter = "LINE"
                value = "COVEREDRATIO"
                minimum = 0.60
            }
        }
    }
}

tasks.register("verifyCommercialReleaseConfiguration") {
    group = "verification"
    description = "Rejects production release builds without immutable version and signing inputs."

    doLast {
        def requiredProviders = [
                AQL_VERSION_NAME          : releaseVersionNameProvider,
                AQL_VERSION_CODE          : releaseVersionCodeProvider,
                AQL_RELEASE_KEYSTORE_PATH : releaseKeystorePathProvider,
                RELEASE_KEYSTORE_PASSWORD: releaseStorePasswordProvider,
                RELEASE_KEY_ALIAS         : releaseKeyAliasProvider,
                RELEASE_KEY_PASSWORD      : releaseKeyPasswordProvider
        ]
        def missing = requiredProviders.findAll { ignored, provider ->
            !provider.isPresent() || provider.get().trim().isEmpty()
        }.keySet().sort()

        if (!missing.isEmpty()) {
            throw new GradleException("Production release configuration is incomplete: ${missing.join(', ')}")
        }
        if (configuredVersionCode <= 0 || configuredVersionCode > 2_100_000_000) {
            throw new GradleException("AQL_VERSION_CODE must be between 1 and 2100000000.")
        }
        if (!(configuredVersionName ==~ /[0-9]+\.[0-9]+\.[0-9]+/)) {
            throw new GradleException("AQL_VERSION_NAME must be a stable MAJOR.MINOR.PATCH value.")
        }
        if (!file(releaseKeystorePathProvider.get()).isFile()) {
            throw new GradleException("AQL_RELEASE_KEYSTORE_PATH does not point to a readable keystore file.")
        }
    }
}

["assembleProductionRelease", "bundleProductionRelease"].each { taskName ->
    tasks.matching { task -> task.name == taskName }.configureEach {
        dependsOn "verifyCommercialReleaseConfiguration"
    }
}

androidComponents {
    def allowedVariants = [
            "developmentDebug",
            "stagingDebug",
            "stagingRelease",
            "stagingReleaseSmoke",
            "productionRelease"
    ] as Set

    beforeVariants(selector().all()) { variantBuilder ->
        def environment = variantBuilder.productFlavors
                .find { pair -> pair.first == "environment" }
                ?.second
        def buildType = variantBuilder.buildType
        def variantIdentity = environment && buildType
                ? "${environment}${buildType.capitalize()}"
                : ""
        variantBuilder.enable = allowedVariants.contains(variantIdentity)
    }

    onVariants(selector().withBuildType("release")) { variant ->
        def environment = variant.productFlavors
                .find { pair -> pair.first == "environment" }
                ?.second
        if (environment == "production") {
            variant.outputs.each { output ->
                output.outputFileName.set("AquaLight-${configuredVersionName}.apk")
            }
        }
    }
}

def forbiddenFirebaseRuntimeModules = [
        "firebase-analytics",
        "firebase-analytics-ktx",
        "firebase-database",
        "firebase-database-ktx",
        "firebase-messaging",
        "firebase-messaging-ktx",
        "firebase-config",
        "firebase-config-ktx",
        "firebase-perf",
        "firebase-perf-ktx",
        "firebase-crashlytics",
        "firebase-crashlytics-ktx"
] as Set

tasks.register("verifyFirebaseRuntimePolicy") {
    group = "verification"
    description = "Fails when an unapproved Firebase runtime resolves transitively."

    inputs.property(
            "forbiddenFirebaseRuntimeModules",
            forbiddenFirebaseRuntimeModules.toList().sort()
    )
    inputs.files(
            configurations.named("developmentDebugRuntimeClasspath"),
            configurations.named("stagingReleaseRuntimeClasspath"),
            configurations.named("productionReleaseRuntimeClasspath")
    ).withPropertyName("firebaseRuntimeClasspaths").withPathSensitivity(PathSensitivity.NONE)

    doLast { task ->
        def modules = task.inputs.properties["forbiddenFirebaseRuntimeModules"] as List
        def forbidden = task.inputs.files.files
                .findAll { file ->
                    modules.any { module ->
                        def versionedPrefix = "${module}-"
                        def versionAndExtension = file.name.startsWith(versionedPrefix)
                                ? file.name.substring(versionedPrefix.length())
                                : ""
                        !versionAndExtension.isEmpty() &&
                                Character.isDigit(versionAndExtension.charAt(0)) &&
                                (versionAndExtension.endsWith(".aar") ||
                                        versionAndExtension.endsWith(".jar"))
                    }
                }
                .collect { file -> file.name }
                .unique()
                .sort()

        if (!forbidden.isEmpty()) {
            throw new GradleException(
                    "Forbidden Firebase runtime artifact(s): ${forbidden.join(', ')}"
            )
        }
        task.logger.lifecycle("Firebase runtime policy passed: Auth and Firestore only.")
    }
}
