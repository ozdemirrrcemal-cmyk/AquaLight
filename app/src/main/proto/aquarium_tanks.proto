syntax = "proto3";

option java_package = "com.aqua.aqualight.data.aquarium.store";
option java_multiple_files = true;

message AquariumTanksStore {
  repeated StoredTank tanks = 1;

  // First commercial schema stores calendar-only values as epoch days, never epoch milliseconds.
  // Unsupported versions are rejected and recovered as a clean store; no legacy migration exists.
  uint32 schema_version = 100;
}

message StoredTank {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string photoUri = 4;
  int64 setup_date_epoch_day = 5;

  int32 widthCm = 6;
  int32 lengthCm = 7;
  int32 heightCm = 8;
  string volumeUnit = 9;
  string tankType = 10;
  string tankStyle = 11;
  int64 createdAtMillis = 12;
  string sizeUnit = 13;

  bool smartCareDisabled = 14;
  bool careRemindersDisabled = 15;

  string owner_uid = 100;

  repeated StoredPlantTag plants = 20;
  repeated StoredMaterial materials = 30;
  repeated StoredLivestock livestock = 40;
  StoredSmartLightProfile smart_light_profile = 50;
}

message StoredSmartLightProfile {
  // Blank enum codes and absent optional scalars mean unknown. They are surfaced
  // as MissingData and are never replaced by inferred or compatibility values.
  string plant_density = 1;
  string highest_plant_light_demand = 2;
  string co2_status = 3;
  optional bool is_active_soil = 4;
  optional int32 water_depth_cm = 5;
  optional int32 fixture_mount_height_cm = 6;
  optional int32 preferred_viewing_start_minute_of_day = 7;
  optional int32 preferred_viewing_end_minute_of_day = 8;
  string algae_observation = 9;
  string plant_stress_observation = 10;
  optional int64 observation_date_epoch_day = 11;
}

message StoredPlantTag {
  int64 id = 1;
  string plantName = 2;
  string category = 3;
  float markerX = 4;
  float markerY = 5;
}

message StoredMaterial {
  int64 id = 1;
  string productId = 2;
  string categoryKey = 3;
  string categoryTitle = 4;
  string name = 5;
  string brand = 6;
  string note = 7;
}

message StoredLivestock {
  int64 id = 1;
  string name = 2;
  string category = 3;
  int32 quantity = 4;
  int64 added_date_epoch_day = 5;
  string note = 6;
}
