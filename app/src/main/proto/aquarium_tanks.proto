syntax = "proto3";

option java_package = "com.aqua.aqualight.data.aquarium.store";
option java_multiple_files = true;

message AquariumTanksStore {
  repeated StoredTank tanks = 1;

  // First commercial schema stores calendar-only values as epoch days, never epoch milliseconds.
  // Unsupported versions are rejected and recovered as a clean store; no legacy migration exists.
  uint32 schema_version = 100;
}

message StoredTank {
  int64 id = 1;
  string name = 2;
  string description = 3;
  string photoUri = 4;
  int64 setup_date_epoch_day = 5;

  int32 widthCm = 6;
  int32 lengthCm = 7;
  int32 heightCm = 8;
  string volumeUnit = 9;
  string tankType = 10;
  string tankStyle = 11;
  int64 createdAtMillis = 12;
  string sizeUnit = 13;

  bool smartCareDisabled = 14;
  bool careRemindersDisabled = 15;

  string owner_uid = 100;

  repeated StoredPlantTag plants = 20;
  repeated StoredMaterial materials = 30;
  repeated StoredLivestock livestock = 40;
  repeated StoredLivestockHealthObservation health_observations = 50;
}

message StoredLivestockHealthObservation {
  int64 id = 1;
  int64 livestock_id = 2;
  string livestock_name = 3;
  string livestock_category = 4;
  string catalog_entry_id = 5;
  int32 affected_count = 6;
  int64 observed_at_millis = 7;
  int64 started_at_millis = 8;
  repeated string symptom_codes = 9;
  string trend_code = 10;
  string note = 11;
  // "yes" or "unsure". Required when the recorded behavior is species-dependent.
  string baseline_change_code = 12;
  int64 closed_at_millis = 13;
  string outcome_code = 14;
  repeated StoredLivestockHealthCheck checks = 15;
  string photo_uri = 16;
}

message StoredLivestockHealthCheck {
  int64 id = 1;
  int64 observed_at_millis = 2;
  int32 affected_count = 3;
  string trend_code = 4;
  string note = 5;
  string photo_uri = 6;
}

message StoredPlantTag {
  int64 id = 1;
  string plantName = 2;
  string category = 3;
  float markerX = 4;
  float markerY = 5;
  string catalogId = 6;
}

message StoredMaterial {
  int64 id = 1;
  string productId = 2;
  string categoryKey = 3;
  string categoryTitle = 4;
  string name = 5;
  string brand = 6;
  string note = 7;
}

message StoredLivestock {
  int64 id = 1;
  string name = 2;
  string category = 3;
  int32 quantity = 4;
  int64 added_date_epoch_day = 5;
  string note = 6;
  // Required stable identity. Catalog records use their catalog id; user-defined records use custom:<livestockId>.
  string catalog_entry_id = 7;
}
