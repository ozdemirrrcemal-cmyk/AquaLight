syntax = "proto3";

option java_package = "com.aqua.aqualight.data.devices";
option java_multiple_files = true;

message DevicesPreferences {
  repeated SavedDeviceInfo devices = 1;
}

message SavedDeviceInfo {
  int64 id = 1;
  string aqua_name = 2;
  string name = 3;
  string ip = 4;
  string serial = 5;
  string firmware_build = 6;
  int64 last_seen_millis = 7;
  int64 tank_id = 8;

  string device_type = 9;
  int32 udp_version = 10;
  bool tab_light = 11;
  bool tab_timer = 12;
  bool tab_temperature = 13;

  string product_id = 14;
  string product_family = 15;
  string product_model = 16;
  string hardware_revision = 17;
  string firmware_version = 18;
  int32 api_version = 19;

  int32 channel_count = 20;
  int32 sensor_count = 21;

  repeated string supported_features = 22;
  repeated string supported_screens = 23;

  string device_uid = 24;
  string mac_address = 25;
  string firmware_serial = 26;

  string owner_uid = 100;
}