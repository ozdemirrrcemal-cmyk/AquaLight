syntax = "proto3";

option java_package = "com.aqua.aqualight.data.devices.light.programs.store";
option java_multiple_files = true;

message LightProgramsStore {
  repeated StoredLightProgram programs = 1;
}

message StoredLightProgram {
  string id = 1;
  string owner_uid = 2;

  int64 device_id = 3;
  string device_uid = 4;
  string product_id = 5;

  string name = 6;
  bool is_active = 7;

  int32 start_minute = 8;
  int32 peak_start_minute = 9;
  int32 peak_end_minute = 10;
  int32 end_minute = 11;

  int32 red = 12;
  int32 green = 13;
  int32 blue = 14;
  int32 white = 15;

  string repeat_mode = 16;
  repeated int32 selected_days = 17;
  string transition_mode = 18;

  string sync_state = 19;
  int64 created_at_millis = 20;
  int64 updated_at_millis = 21;
  int64 last_loaded_at_millis = 22;
  string last_loaded_hash = 23;
}
