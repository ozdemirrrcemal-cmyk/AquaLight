syntax = "proto3";

option java_package = "com.aqua.aqualight.data.devices.light.presets";
option java_multiple_files = true;

message LightPresetsPreferences {
  repeated LightPresetProto presets = 1;
}

message LightPresetProto {
  string id = 1;
  string name = 2;

  int32 red = 3;
  int32 green = 4;
  int32 blue = 5;
  int32 white = 6;

  int64 created_at = 7;
  int64 updated_at = 8;

  string owner_uid = 100;
}