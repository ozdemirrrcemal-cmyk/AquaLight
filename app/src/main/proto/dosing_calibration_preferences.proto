syntax = "proto3";

option java_package = "com.aqua.aqualight.data.devices.dosing.proto";
option java_multiple_files = true;

message DosingCalibrationPreferences {
  repeated DosingChannelCalibrationRecord records = 1;
}

message DosingChannelCalibrationRecord {
  int64 device_id = 1;
  int32 channel_index = 2;

  reserved 3, 5 to 9;
  reserved "liquid_name",
           "phone_saved_at_millis",
           "time_source",
           "esp_raw_time_text",
           "has_measured_amount_ml",
           "measured_amount_ml";

  int64 last_calibrated_at_millis = 4;
}