syntax = "proto3";
option java_package = "com.aqua.aqualight.data";
option java_multiple_files = true;

message UserPreferences {
  string idToken         = 1;
  string email           = 2;
  string username        = 3;
  string profilePhotoUrl = 4;
  bool   isLoggedIn      = 5;
  string fullName        = 6;
  string themeMode       = 7;
  string languageCode    = 8;
  bool   notificationsEnabled = 9;
  bool   autoUpdateEnabled     = 10;

  // Adres bilgileri
  string firstName       = 11;
  string lastName        = 12;
  string city            = 13;
  string addressLine     = 14;
  string postCode        = 15;
  string phoneNumber     = 16;
  string country         = 17;

  // Login alerts
  bool   loginAlertsEnabled = 18;

  // 2FA
  bool   twoFactorEnabled   = 19;

  // Usage analytics
  int32  weeklyAutomationCount   = 20;
  int32  weeklyAlertCount        = 21;
  int32  todayAutomationCount    = 22;
  int32  todayManualActionCount  = 23;
  int64  lastEventTimeMillis     = 24;
  string lastEventDescription    = 25;
  string lastUsageDayKey         = 26;
  string lastUsageWeekKey        = 27;

  // ⭐️ SEÇİLİ CİHAZ ALANLARI (Eksik olanlar)
  int64  selectedDeviceId        = 28;
  string selectedDeviceAquaName  = 29;
  string selectedDeviceName      = 30;
  string selectedDeviceIp        = 31;
  string selectedDeviceSerial    = 32;
}