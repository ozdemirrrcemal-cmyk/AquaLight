syntax = "proto3";

option java_package = "com.aqua.aqualight.data.user";
option java_multiple_files = true;


message UserProfileCache {
  string ownerUid = 1;
  string email = 2;
  string username = 3;
  string profilePhotoUrl = 4;
  string fullName = 5;
  string firstName = 6;
  string lastName = 7;
  string city = 8;
  string addressLine = 9;
  string postCode = 10;
  string phoneNumber = 11;
  string country = 12;
}

message UserPreferences {
  string uid = 1;
  string email = 2;
  string username = 3;
  string profilePhotoUrl = 4;
  bool isLoggedIn = 5;
  string fullName = 6;
  string themeMode = 7;
  string languageCode = 8;
  bool notificationsEnabled = 9;
  bool autoUpdateEnabled = 10;

  // Address
  string firstName = 11;
  string lastName = 12;
  string city = 13;
  string addressLine = 14;
  string postCode = 15;
  string phoneNumber = 16;
  string country = 17;

  // Login alerts
  bool loginAlertsEnabled = 18;

  // 2FA
  bool twoFactorEnabled = 19;

  // Usage analytics
  int32 weeklyAutomationCount = 20;
  int32 weeklyAlertCount = 21;
  int32 todayAutomationCount = 22;
  int32 todayManualActionCount = 23;
  int64 lastEventTimeMillis = 24;
  string lastEventDescription = 25;
  string lastUsageDayKey = 26;
  string lastUsageWeekKey = 27;

  // Per-user profile/address cache. Active fields above are only the current session projection.
  repeated UserProfileCache profileCaches = 101;

  // Devices were moved to devices_preferences.proto.
  reserved 100;
  reserved "devices";
}