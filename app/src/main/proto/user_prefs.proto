syntax = "proto3";
option java_package = "com.aqua.aqualight.data";
option java_multiple_files = true;

message UserPreferences {
  string idToken         = 1;
  string email           = 2;
  string username        = 3;
  string profilePhotoUrl = 4;
  bool   isLoggedIn      = 5;
  string fullName        = 6;
  string themeMode       = 7;
  string languageCode    = 8;
  bool   notificationsEnabled = 9;
  bool   autoUpdateEnabled     = 10;

  // 🆕 Adres bilgileri
  string firstName       = 11;
  string lastName        = 12;
  string city            = 13;
  string addressLine     = 14;
  string postCode        = 15;
  string phoneNumber     = 16;
  string country         = 17;

  // 🆕 Login uyarıları (giriş alert)
  bool   loginAlertsEnabled = 18;

  // 🆕 İki faktörlü kimlik doğrulama
  bool   twoFactorEnabled   = 19;

  // 🆕 Usage / Analytics alanları
  int32  weeklyAutomationCount   = 20; // Son hafta tetiklenen otomasyon sayısı
  int32  weeklyAlertCount        = 21; // Son hafta oluşan uyarı/alarm sayısı
  int32  todayAutomationCount    = 22; // Bugün çalışan otomasyon
  int32  todayManualActionCount  = 23; // Bugün yapılan manuel müdahale

  int64  lastEventTimeMillis     = 24; // Son önemli olay zamanı
  string lastEventDescription    = 25; // "Lighting • Evening schedule turned ON"

  string lastUsageDayKey         = 26; // "2025-11-20" gibi
  string lastUsageWeekKey        = 27; // "2025-W47" gibi
}